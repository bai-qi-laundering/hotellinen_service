<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>百麒物流 - 飯店點收簽單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; touch-action: manipulation; }
        .main-container { max-width: 500px; margin: 0 auto; }
        
        input[type="date"]::-webkit-calendar-picker-indicator { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        
        .sign-canvas { display: block; width: 100%; height: 160px; background: #fff; border: 2px dashed #cbd5e1; border-radius: 0.5rem; touch-action: none; cursor: crosshair; }
    </style>
</head>
<body class="p-3 pb-32 relative">

    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-green-700 text-white px-6 py-3 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-[10000] font-bold text-center">
        ✅ 點收簽單已成功更新！
    </div>

    <div class="main-container">
        <!-- 頂部資訊區 -->
        <div class="bg-blue-800 text-white p-5 rounded-t-2xl shadow-md text-center relative">
            <h1 id="hotelTitle" class="text-3xl font-black mb-1 mt-2">載入中...</h1>
            <div class="flex justify-center items-center gap-3 mt-2">
                <p id="dateTitle" class="text-lg font-bold text-blue-200">出貨點收系統</p>
                <button onclick="fetchData(true)" class="bg-blue-700 text-white text-sm px-3 py-1 rounded-lg shadow active:bg-blue-600 border border-blue-600">
                    🔄 重新載入
                </button>
            </div>
            <span id="syncIndicator" class="text-xs text-green-300 font-bold opacity-0 transition-opacity duration-500 absolute top-4 right-4 tracking-widest">●即時同步中</span>
        </div>
        
        <!-- 日期選擇區 -->
        <div class="bg-white p-4 rounded-b-2xl shadow-md mb-6 flex flex-col gap-3 border-t border-blue-900">
            <div class="relative w-full bg-blue-50 rounded-lg h-14 flex items-center justify-center border border-blue-200">
                <span class="absolute left-4 text-xl">📅</span>
                <div id="dateDisplay" class="w-full text-center font-bold text-xl pointer-events-none text-blue-900">載入中...</div>
                <input type="date" id="datePicker" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="dateChanged()">
            </div>
            <p class="text-center text-sm text-gray-400 font-bold">點擊上方可回溯查詢歷史點交紀錄</p>
        </div>

        <!-- 點交清單區 -->
        <div id="departmentsContainer" class="space-y-6">
            <div class="text-center py-10 text-gray-500 font-bold text-lg">載入資料中...</div>
        </div>
    </div>

    <!-- 雙簽名視窗 -->
    <div id="signModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-[10000] overflow-y-auto">
        <div class="bg-white p-5 rounded-2xl w-full max-w-sm my-auto">
            <h2 id="modalDeptTitle" class="text-xl font-black text-center text-blue-800 mb-4 border-b pb-2">部門名稱</h2>
            
            <div class="mb-5">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold text-gray-800">1. 飯店端主管簽收</h2>
                    <button onclick="clearCanvas(clientCtx, clientCanvas)" class="text-sm text-red-500 font-bold px-2 py-1 rounded bg-red-50 shadow-sm active:bg-red-100">清除重簽</button>
                </div>
                <canvas id="clientCanvas" class="sign-canvas"></canvas>
            </div>

            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold text-gray-800">2. 百麒司機簽收</h2>
                    <button onclick="clearCanvas(driverCtx, driverCanvas)" class="text-sm text-red-500 font-bold px-2 py-1 rounded bg-red-50 shadow-sm active:bg-red-100">清除重簽</button>
                </div>
                <canvas id="driverCanvas" class="sign-canvas"></canvas>
                <div class="text-xs text-blue-600 font-bold mt-2 text-right">💡 司機簽名將自動同步至其他<span class="text-red-500">未簽名</span>的部門</div>
            </div>

            <div class="flex gap-3">
                <button onclick="closeSignModal()" class="flex-1 p-4 text-lg font-bold bg-gray-200 text-gray-700 rounded-xl active:bg-gray-300">取消</button>
                <button id="submitBtn" onclick="submitVerify()" class="flex-1 p-4 text-lg font-bold bg-blue-600 text-white rounded-xl shadow-md active:bg-blue-700">確認送出</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, setDoc, getDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEXcnXOKRags29CvhM6TKe3N-zty-ela4",
            authDomain: "hotel-inventory-3a1ad.firebaseapp.com",
            projectId: "hotel-inventory-3a1ad",
            storageBucket: "hotel-inventory-3a1ad.firebasestorage.app",
            messagingSenderId: "363844184412",
            appId: "1:363844184412:web:66cdd6425d53bde75f3999",
            measurementId: "G-NM1W9JT70F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let currentHotel = "";
        let currentDate = "";
        let groupedData = {}; 
        let activeDeptKey = ""; 
        let masterTemplate = []; 
        let globalItemOrder = {}; 
        let autoSyncTimer = null; 

        const clientCanvas = document.getElementById('clientCanvas');
        const driverCanvas = document.getElementById('driverCanvas');
        const clientCtx = clientCanvas.getContext('2d');
        const driverCtx = driverCanvas.getContext('2d');

        window.clientCanvas = clientCanvas;
        window.driverCanvas = driverCanvas;
        window.clientCtx = clientCtx;
        window.driverCtx = driverCtx;

        window.dateChanged = dateChanged;
        window.clearCanvas = clearCanvas;
        window.openSignModal = openSignModal;
        window.closeSignModal = closeSignModal;
        window.submitVerify = submitVerify;
        window.handleQtyChange = handleQtyChange;
        window.toggleDropdown = toggleDropdown;
        window.selectOption = selectOption;
        window.addNewItem = addNewItem;
        window.fetchData = fetchData;

        const loadingHtml = `
            <div class="flex flex-col items-center justify-center py-12 space-y-4">
                <svg class="animate-spin h-12 w-12 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <div id="loadingText" class="text-blue-700 font-black text-xl animate-pulse tracking-wide">載入中...</div>
            </div>
        `;

        function getLocalDateString(dateObj) {
            return new Date(dateObj.getTime() - (dateObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        }

        function getExactTimeString() {
            const now = new Date();
            const y = now.getFullYear(); const m = String(now.getMonth() + 1).padStart(2, '0'); const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0'); const min = String(now.getMinutes()).padStart(2, '0'); const s = String(now.getSeconds()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}:${s}`;
        }

        function updateDateDisplay() {
            const d = new Date(document.getElementById('datePicker').value);
            document.getElementById('dateDisplay').innerText = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
            currentDate = document.getElementById('datePicker').value;
        }

        function dateChanged() { 
            updateDateDisplay(); 
            let cachedData = localStorage.getItem(`logistics_cache_${currentHotel}_${currentDate}`);
            if (cachedData) {
                processAndRenderData(JSON.parse(cachedData));
                fetchData(true); 
            } else {
                fetchData(false); 
            }
        }

        // ★ 核心新功能：自動尋找最新單據的日期！
        async function autoFindLatestDate(hotelKeyword) {
            let itemsToCheck = [];
            // 找出這家飯店在試算表中的專屬品項
            let hotelItems = masterTemplate.filter(t => t.baseName === hotelKeyword || (t.hotel && t.hotel.includes(hotelKeyword)));
            
            if (hotelItems.length > 0) {
                // 挑前 3 個熱門品項當作探測針 (省配額)
                itemsToCheck = hotelItems.slice(0, 3);
            } else {
                // 如果第一次開還沒快取，預設查最常見的三種
                itemsToCheck = [
                    { hotel: hotelKeyword + " 房務", item: "床包" },
                    { hotel: hotelKeyword + " 房務", item: "被套" },
                    { hotel: hotelKeyword + " 房務", item: "大毛" }
                ];
            }

            let checkDate = new Date();
            // 往前最多找 15 天，沒找到就算了，預設回傳今天
            for (let i = 0; i < 15; i++) { 
                let dStr = getLocalDateString(checkDate);
                
                // 發射 3 根探測針查詢這天有沒有資料
                let promises = itemsToCheck.map(t => {
                    let docId = `${dStr}_${t.hotel}_${t.item.replace(/\//g, '-')}`;
                    return getDoc(doc(db, "inventory_records", docId));
                });
                
                try {
                    let snaps = await Promise.all(promises);
                    let hasData = snaps.some(snap => {
                        if (snap.exists()) {
                            let d = snap.data();
                            // 只要有盤點數量或是簽名，就代表這天有單據！
                            return (d.count && d.count !== "0") || 
                                   (d.doubleCount && d.doubleCount !== "0") || 
                                   d.signature || 
                                   d.doubleSignature;
                        }
                        return false;
                    });
                    
                    if (hasData) {
                        return dStr; // 找到最新單據了！立刻回傳日期
                    }
                } catch(e) {
                    console.error("Auto search error", e);
                }
                
                // 這天沒有，找前一天
                checkDate.setDate(checkDate.getDate() - 1);
            }
            
            // 如果這家飯店最近 15 天完全沒單據，預設顯示今天
            return getLocalDateString(new Date()); 
        }

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            currentHotel = urlParams.get('hotel');
            
            if (!currentHotel || currentHotel.trim() === "") {
                document.getElementById('hotelTitle').innerText = "連結錯誤";
                document.getElementById('departmentsContainer').innerHTML = `
                    <div class="text-center py-16 bg-red-50 rounded-2xl border-2 border-red-200">
                        <span class="text-4xl block mb-2">🚫</span>
                        <div class="text-red-600 font-black text-xl mb-2">無效的存取連結</div>
                        <div class="text-red-500 font-bold text-sm">請向物流單位索取您所屬飯店的專屬點交網址</div>
                    </div>`;
                return;
            }

            document.getElementById('hotelTitle').innerText = currentHotel + " 點交";
            
            // 1. 優先從快取載入排序大腦 (給自動尋找日期當作探測針名單)
            let cachedTemplate = localStorage.getItem(`inventory_masterData`);
            if (cachedTemplate) {
                try {
                    masterTemplate = JSON.parse(cachedTemplate);
                    globalItemOrder = {};
                    masterTemplate.forEach((t, idx) => {
                        if (globalItemOrder[t.item] === undefined) globalItemOrder[t.item] = idx; 
                    });
                } catch(e){}
            }

            // 同步向雲端要最新設定 (背景執行，不卡畫面)
            getDoc(doc(db, 'inventory_config', 'master_template')).then(templateDoc => {
                if (templateDoc.exists() && templateDoc.data().items) {
                    masterTemplate = templateDoc.data().items;
                    localStorage.setItem(`inventory_masterData`, JSON.stringify(masterTemplate));
                    globalItemOrder = {};
                    masterTemplate.forEach((t, idx) => {
                        if (globalItemOrder[t.item] === undefined) globalItemOrder[t.item] = idx;
                    });
                }
            });

            // 2. ★ 開始執行智慧尋找最新日期！
            document.getElementById('departmentsContainer').innerHTML = loadingHtml.replace("載入中...", "🔍 自動搜尋最新單據中...");
            
            const latestDate = await autoFindLatestDate(currentHotel);
            
            // 把找到的最新日期設定上去
            document.getElementById('datePicker').value = latestDate;
            updateDateDisplay();

            // 3. 載入該日期的資料
            let cachedData = localStorage.getItem(`logistics_cache_${currentHotel}_${currentDate}`);
            if (cachedData) {
                try {
                    processAndRenderData(JSON.parse(cachedData));
                    fetchData(true); 
                } catch(e) {
                    fetchData(false);
                }
            } else {
                fetchData(false);
            }

            if (autoSyncTimer) clearInterval(autoSyncTimer); 
        }

        async function fetchData(isBackground = false) {
            if (!isBackground) {
                document.getElementById('departmentsContainer').innerHTML = loadingHtml.replace("載入中...", "讀取最新資料中...");
            } else {
                const indicator = document.getElementById('syncIndicator');
                if(indicator) {
                    indicator.classList.remove('opacity-0');
                    setTimeout(() => indicator.classList.add('opacity-0'), 1500);
                }
            }

            try {
                let rawData = [];
                let baseInventoryItems = [];

                const invQ = query(collection(db, "inventory_records"), where("date", "==", currentDate));
                const invSnap = await getDocs(invQ);

                invSnap.forEach(docSnap => {
                    const d = docSnap.data();
                    if (d.hotel && d.hotel.includes(currentHotel)) {
                        let deptName = d.hotel.replace(currentHotel, "").trim();
                        if (deptName === "") deptName = "房務"; 
                        
                        baseInventoryItems.push({
                            hotelFull: d.hotel,
                            deptName: deptName,
                            itemName: d.item,
                            originalQty: d.doubleCount || d.count || "0",
                            auntNote: d.note || ""
                        });
                    }
                });

                const logQ = query(collection(db, "logistics_records"), where("date", "==", currentDate), where("hotelKeyword", "==", currentHotel));
                const logSnap = await getDocs(logQ);
                let savedLogistics = {};
                
                logSnap.forEach(docSnap => {
                    const d = docSnap.data();
                    savedLogistics[d.deptName] = d;
                });

                baseInventoryItems.forEach(item => {
                    let savedDept = savedLogistics[item.deptName] || 
                                    savedLogistics[item.hotelFull] || 
                                    savedLogistics[`${currentHotel} ${item.deptName}`];
                    
                    if (!savedDept) {
                        savedDept = Object.values(savedLogistics).find(s => 
                            s.deptName.includes(item.deptName) || 
                            item.deptName.includes(s.deptName) ||
                            item.hotelFull.includes(s.deptName)
                        );
                    }

                    let actualQty = item.originalQty;
                    let driverNote = "";
                    let clientSig = "";
                    let driverSig = "";

                    if (savedDept) {
                        clientSig = savedDept.clientSig || "";
                        driverSig = savedDept.driverSig || "";
                        if (savedDept.items) {
                            let savedItem = savedDept.items.find(i => i.itemName === item.itemName);
                            if (savedItem) {
                                if (savedItem.actualQty !== undefined && savedItem.actualQty !== "") {
                                    actualQty = savedItem.actualQty;
                                }
                                driverNote = savedItem.driverNote || "";
                            }
                        }
                    }

                    rawData.push({
                        deptName: item.deptName,
                        itemName: item.itemName,
                        originalQty: item.originalQty,
                        auntNote: item.auntNote,
                        actualQty: actualQty,
                        driverNote: driverNote,
                        clientSig: clientSig,
                        driverSig: driverSig
                    });
                });

                for (let deptKey in savedLogistics) {
                    let savedDept = savedLogistics[deptKey];
                    if (savedDept.items) {
                        savedDept.items.forEach(savedItem => {
                            let exists = rawData.some(r => r.deptName === savedDept.deptName && r.itemName === savedItem.itemName);
                            if (!exists) {
                                rawData.push({
                                    deptName: savedDept.deptName,
                                    itemName: savedItem.itemName,
                                    originalQty: savedItem.originalQty || "0",
                                    auntNote: savedItem.auntNote || "",
                                    actualQty: savedItem.actualQty !== undefined ? savedItem.actualQty : (savedItem.originalQty || "0"),
                                    driverNote: savedItem.driverNote || "",
                                    clientSig: savedDept.clientSig || "",
                                    driverSig: savedDept.driverSig || ""
                                });
                            }
                        });
                    }
                }

                localStorage.setItem(`logistics_cache_${currentHotel}_${currentDate}`, JSON.stringify(rawData));
                processAndRenderData(rawData);
            } catch (err) {
                console.error(err);
                if (!isBackground) {
                    document.getElementById('departmentsContainer').innerHTML = `<div class="text-center py-10 text-red-500 font-bold">讀取失敗：請檢查網路連線</div>`;
                }
            }
        }

        function processAndRenderData(rawData) {
            let uniqueDataMap = {};
            rawData.forEach(item => {
                let key = item.deptName + "_" + item.itemName;
                uniqueDataMap[key] = item; 
            });
            const cleanData = Object.values(uniqueDataMap);

            if (cleanData.length === 0) {
                document.getElementById('departmentsContainer').innerHTML = '<div class="text-center py-16 text-gray-500 font-bold text-xl">此日期無待點交資料！<br><span class="text-sm">請點擊上方日曆切換查詢日期</span></div>';
                return;
            }

            groupedData = {};
            cleanData.forEach(item => {
                if ((item.originalQty === "" || item.originalQty === "0" || item.originalQty === 0) && 
                    (item.actualQty === "" || item.actualQty === "0" || item.actualQty === 0)) {
                    return; 
                }

                if (!groupedData[item.deptName]) {
                    groupedData[item.deptName] = { items: [], clientSig: "", driverSig: "" };
                }
                
                if (item.clientSig) groupedData[item.deptName].clientSig = item.clientSig;
                if (item.driverSig) groupedData[item.deptName].driverSig = item.driverSig;

                let finalActualQty = (item.actualQty !== undefined && item.actualQty !== "" && item.actualQty !== null) ? item.actualQty : item.originalQty;

                groupedData[item.deptName].items.push({
                    deptName: item.deptName,
                    itemName: item.itemName,
                    originalQty: item.originalQty,
                    auntNote: item.auntNote,
                    actualQty: finalActualQty,
                    driverNote: item.driverNote
                });
            });

            if (Object.keys(groupedData).length === 0) {
                document.getElementById('departmentsContainer').innerHTML = '<div class="text-center py-16 text-green-600 font-bold text-xl">🎉 此日期所有品項出貨量皆為 0，無須點交！</div>';
                return;
            }

            renderDepartments();
        }

        function handleQtyChange(dept, idx, val) {
            groupedData[dept].items[idx].actualQty = val;
            const original = groupedData[dept].items[idx].originalQty;
            const statusSpan = document.getElementById(`status-${dept}-${idx}`);
            if (String(val) === String(original)) {
                statusSpan.innerHTML = "✅ 相符"; 
                statusSpan.className = "text-green-600 font-bold ml-3 text-base";
            } else {
                statusSpan.innerHTML = "⚠️ 已修改"; 
                statusSpan.className = "text-red-500 font-bold ml-3 text-base";
            }
        }

        function toggleDropdown(deptId, e) {
            e.stopPropagation();
            const menu = document.getElementById(`customDropdownMenu-${deptId}`);
            if (menu) menu.classList.toggle('hidden');
        }

        function selectOption(deptId, val) {
            document.getElementById(`newItemInput-${deptId}`).value = val;
            document.getElementById(`customDropdownMenu-${deptId}`).classList.add('hidden');
        }

        function addNewItem(deptId, deptName) {
            const inputEl = document.getElementById(`newItemInput-${deptId}`);
            const newItemName = inputEl.value.trim();

            if (!newItemName) {
                alert("請輸入要新增的品項名稱！");
                return;
            }
            
            let exists = groupedData[deptName].items.some(i => i.itemName === newItemName);
            if (exists) {
                alert("這個品項已經在上方列表裡面囉！");
                return;
            }

            groupedData[deptName].items.push({
                deptName: deptName,
                itemName: newItemName,
                originalQty: "0",
                auntNote: "",
                actualQty: "0",
                driverNote: "司機臨時新增"
            });

            inputEl.value = "";
            
            const toast = document.getElementById('toast');
            toast.innerText = "✅ 已新增臨時品項！";
            toast.classList.remove('opacity-0'); 
            setTimeout(() => toast.classList.add('opacity-0'), 2000);

            renderDepartments(); 
        }

        document.addEventListener('click', function(e) {
            document.querySelectorAll('[id^="customDropdownMenu-"]').forEach(menu => {
                const deptId = menu.id.split('-')[1];
                const btn = document.getElementById(`dropdownBtn-${deptId}`);
                const input = document.getElementById(`newItemInput-${deptId}`);
                
                if (menu && !menu.classList.contains('hidden')) {
                    if (!menu.contains(e.target) && (!btn || !btn.contains(e.target)) && e.target !== input) {
                        menu.classList.add('hidden');
                    }
                }
            });
        });

        function renderDepartments() {
            let html = "";
            let deptIndex = 0;

            const commonItems = ['方巾', '床墊', '枕頭', '床包', '羽毛被', '抱枕套', '置物墊', '嬰兒床圍組', '嬰兒床包/裙', '嬰兒被套', '嬰兒枕套', '嬰兒床圍', '桌裙', '親子床單', '親子被套', '涼被', '門簾'];

            for (let dept in groupedData) {
                deptIndex++;
                let deptId = `dept_${deptIndex}`;

                // ★ 精準抓取專屬排序號碼牌邏輯開始 ★
                let localItemOrder = {};
                if (masterTemplate && masterTemplate.length > 0) {
                    let matchedItems = masterTemplate.filter(t => 
                        (t.baseName === currentHotel || (t.hotel && t.hotel.includes(currentHotel))) && 
                        ((t.deptName || "房務") === dept || (t.deptName === "" && dept === "房務") || (t.hotel && t.hotel.includes(dept)))
                    );
                    
                    if (matchedItems.length === 0) {
                        matchedItems = masterTemplate.filter(t => t.baseName === currentHotel || (t.hotel && t.hotel.includes(currentHotel)));
                    }

                    matchedItems.forEach((t, idx) => {
                        if (localItemOrder[t.item] === undefined) localItemOrder[t.item] = idx;
                    });
                }

                let hasClientSig = groupedData[dept].clientSig ? true : false;
                let hasDriverSig = groupedData[dept].driverSig ? true : false;
                let isCompleted = hasClientSig && hasDriverSig;

                let actionButton = "";

                if (isCompleted) {
                    actionButton = `<div class="w-full mt-2 py-4 text-green-700 font-black text-2xl text-center bg-green-50 rounded-xl border-2 border-green-200 shadow-sm flex items-center justify-center gap-2">
                        <span>✅ 已點收完畢</span>
                        <button onclick="openSignModal('${dept}')" class="text-sm bg-white text-green-700 border border-green-300 px-3 py-1 rounded shadow-sm active:bg-green-100 ml-4">查看簽名</button>
                    </div>`;
                } else if (hasClientSig && !hasDriverSig) {
                    actionButton = `<button onclick="openSignModal('${dept}')" class="w-full mt-4 p-4 bg-orange-500 text-white rounded-xl font-bold text-lg shadow-md animate-pulse">🚚 等待司機簽名確認</button>`;
                } else if (!hasClientSig && hasDriverSig) {
                    actionButton = `<button onclick="openSignModal('${dept}')" class="w-full mt-4 p-4 bg-orange-500 text-white rounded-xl font-bold text-lg shadow-md animate-pulse">🏨 等待飯店確認簽名</button>`;
                } else {
                    actionButton = `<button onclick="openSignModal('${dept}')" class="w-full mt-4 p-4 bg-blue-600 text-white rounded-xl font-bold text-lg shadow-md">📝 進行點交與簽名</button>`;
                }

                // ★ 使用專屬號碼牌進行排序
                groupedData[dept].items.sort((a, b) => {
                    let idxA = localItemOrder[a.itemName] !== undefined ? localItemOrder[a.itemName] : 9999;
                    let idxB = localItemOrder[b.itemName] !== undefined ? localItemOrder[b.itemName] : 9999;
                    return idxA - idxB;
                });

                let itemsHtml = groupedData[dept].items.map((item, idx) => {
                    let isMatching = String(item.actualQty) === String(item.originalQty);
                    let statusText = isMatching ? "✅ 相符" : "⚠️ 已修改";
                    let statusClass = isMatching ? "text-green-600 font-bold ml-3 text-base" : "text-red-500 font-bold ml-3 text-base";
                    
                    return `
                    <div class="border-b border-gray-100 py-4 last:border-0">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-black text-2xl text-gray-800">${item.itemName}</span>
                            <div class="text-right">
                                <span class="text-xs text-gray-400 block">盤點出貨</span>
                                <span class="font-bold text-2xl text-gray-400">${item.originalQty}</span>
                            </div>
                        </div>
                        ${item.auntNote ? `<div class="text-base text-orange-700 bg-orange-100 p-3 rounded-lg mb-3 font-bold border border-orange-200">📝 飯店備註: ${item.auntNote}</div>` : ''}
                        
                        <div class="bg-blue-50 p-3 rounded-lg border ${isMatching ? 'border-transparent' : 'border-red-300'}">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-blue-900">實收(請款)量：</span>
                                <div class="flex items-center">
                                    <input type="number" oninput="handleQtyChange('${dept}', ${idx}, this.value)" value="${item.actualQty}" 
                                           class="w-20 p-1 text-right font-black text-2xl outline-none rounded ${isCompleted ? 'bg-transparent text-gray-600 pr-0' : 'bg-white border-b-2 border-blue-500 text-blue-700 shadow-sm'}" 
                                           ${isCompleted ? 'disabled' : ''}>
                                    <span id="status-${dept}-${idx}" class="${statusClass}">${statusText}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `}).join('');

                let dropdownHtml = commonItems.map(val => 
                    `<div class="p-3 border-b border-gray-100 text-xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('${deptId}', '${val}')">${val}</div>`
                ).join('');

                let addItemHtml = "";
                if (!isCompleted) {
                    addItemHtml = `
                    <div class="mt-4 bg-indigo-50 p-4 rounded-xl border border-dashed border-indigo-300">
                        <h3 class="text-sm font-black mb-2 text-indigo-800">➕ 臨時新增出貨品項</h3>
                        <div class="flex gap-2 relative">
                            <div class="relative flex-1">
                                <input id="newItemInput-${deptId}" class="w-full h-full p-2 text-lg font-bold border border-indigo-200 rounded-lg outline-none focus:border-indigo-500 bg-white pr-10" placeholder="手打或選單 👉">
                                <button id="dropdownBtn-${deptId}" onclick="toggleDropdown('${deptId}', event)" class="absolute right-1 top-1/2 transform -translate-y-1/2 p-1 bg-indigo-100 text-indigo-800 rounded-md font-bold shadow-sm border border-indigo-300 active:bg-indigo-200 flex items-center justify-center h-8 w-8">
                                    <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
                                </button>
                                <div id="customDropdownMenu-${deptId}" class="hidden absolute z-[30000] w-full mt-1 max-h-60 overflow-y-auto bg-white border-2 border-indigo-300 rounded-xl shadow-2xl">
                                    ${dropdownHtml}
                                </div>
                            </div>
                            <button onclick="addNewItem('${deptId}', '${dept}')" class="px-4 bg-green-600 text-white rounded-lg font-bold text-lg shadow-md active:bg-green-700 whitespace-nowrap">新增</button>
                        </div>
                    </div>`;
                }

                html += `
                <div class="bg-white p-4 rounded-2xl shadow-md border border-gray-200 mb-6">
                    <div class="bg-gray-800 text-white p-3 -mx-4 -mt-4 mb-3 rounded-t-2xl">
                        <h2 class="text-xl font-black text-center">${dept}</h2>
                    </div>
                    ${itemsHtml}
                    ${addItemHtml}
                    ${actionButton}
                </div>`;
            }
            document.getElementById('departmentsContainer').innerHTML = html;
        }

        function setupCanvas(canvas, ctx) {
            canvas.isModified = false;
            canvas.isCleared = false; 

            function start(e) { 
                e.preventDefault(); 
                canvas.painting = true; 
                canvas.isCleared = false; 
                draw(e); 
            }
            function draw(e) {
                if(!canvas.painting) return; e.preventDefault();
                canvas.isModified = true; 
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
            }
            function stop(e) { e.preventDefault(); canvas.painting = false; ctx.beginPath(); }
            canvas.addEventListener('mousedown', start); canvas.addEventListener('touchstart', start, {passive: false});
            canvas.addEventListener('mousemove', draw); canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('mouseup', stop); canvas.addEventListener('touchend', stop);
        }
        setupCanvas(clientCanvas, clientCtx);
        setupCanvas(driverCanvas, driverCtx);

        function clearCanvas(ctx, canvas) { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            canvas.isModified = true; 
            canvas.isCleared = true; 
        }

        function openSignModal(deptName) {
            activeDeptKey = deptName;
            document.getElementById('modalDeptTitle').innerText = deptName;
            
            let existClient = groupedData[deptName].clientSig;
            let existDriver = groupedData[deptName].driverSig;

            document.getElementById('signModal').classList.remove('hidden');
            requestAnimationFrame(() => {
                [clientCanvas, driverCanvas].forEach(c => { 
                    c.width = c.offsetWidth; 
                    c.height = 160; 
                    c.isModified = false; 
                    c.isCleared = false; 
                });
                [clientCtx, driverCtx].forEach(ctx => { 
                    ctx.lineWidth = 4; 
                    ctx.lineCap = 'round'; 
                    ctx.strokeStyle = '#000'; 
                    ctx.clearRect(0, 0, 500, 200); 
                });
                
                if(existClient) { let img = new Image(); img.onload = ()=> clientCtx.drawImage(img,0,0); img.src = existClient; }
                if(existDriver) { let img = new Image(); img.onload = ()=> driverCtx.drawImage(img,0,0); img.src = existDriver; }
            });
        }
        
        function closeSignModal() { document.getElementById('signModal').classList.add('hidden'); }

        async function submitVerify() {
            let existClient = groupedData[activeDeptKey].clientSig;
            let existDriver = groupedData[activeDeptKey].driverSig;

            let cBase64 = existClient || ""; 
            if (clientCanvas.isModified) {
                if (clientCanvas.isCleared) {
                    cBase64 = ""; 
                } else {
                    cBase64 = clientCanvas.toDataURL('image/png'); 
                }
            }

            let dBase64 = existDriver || "";
            if (driverCanvas.isModified) {
                if (driverCanvas.isCleared) {
                    dBase64 = ""; 
                } else {
                    dBase64 = driverCanvas.toDataURL('image/png'); 
                }
            }

            if (!cBase64 && !dBase64) {
                 return alert("請至少一方完成簽名！(司機或飯店)");
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = "傳送中..."; btn.disabled = true;

            let isNewDriverSig = driverCanvas.isModified && !driverCanvas.isCleared && dBase64 !== ""; 
            let payloads = [];
            let syncDepts = [];

            let safeItemsForDatabase = groupedData[activeDeptKey].items.map(item => ({
                deptName: item.deptName,
                itemName: item.itemName,
                originalQty: item.originalQty,
                auntNote: item.auntNote,
                actualQty: item.actualQty, 
                driverNote: item.driverNote
            }));

            payloads.push({
                date: currentDate,
                hotelKeyword: currentHotel,
                deptName: activeDeptKey,
                items: safeItemsForDatabase,
                clientSig: cBase64,
                driverSig: dBase64
            });

            if (isNewDriverSig) {
                for (let dept in groupedData) {
                    if (dept !== activeDeptKey) {
                        let existOtherDriver = groupedData[dept].driverSig;
                        if (!existOtherDriver) {
                            let deptItemsSafe = groupedData[dept].items.map(item => ({
                                deptName: item.deptName,
                                itemName: item.itemName,
                                originalQty: item.originalQty,
                                auntNote: item.auntNote,
                                actualQty: item.actualQty,
                                driverNote: item.driverNote
                            }));
                            payloads.push({
                                date: currentDate,
                                hotelKeyword: currentHotel,
                                deptName: dept,
                                items: deptItemsSafe,
                                clientSig: groupedData[dept].clientSig || "", 
                                driverSig: dBase64 
                            });
                            syncDepts.push(dept);
                        }
                    }
                }
            }

            try {
                const savePromises = payloads.map(p => {
                    const docId = `${p.date}_${p.hotelKeyword}_${p.deptName}`;
                    const docRef = doc(db, 'logistics_records', docId);

                    addDoc(collection(db, 'history_logs'), {
                        logDate: getLocalDateString(new Date()),
                        timestamp: Date.now(),
                        timeString: getExactTimeString(),
                        operator: "🚚 物流點收系統",
                        date: p.date,
                        hotel: `${p.hotelKeyword} ${p.deptName}`,
                        item: "物流點收單",
                        field: "點交狀態",
                        oldValue: "更新前",
                        newValue: "已更新簽收狀態"
                    });

                    return setDoc(docRef, {
                        date: p.date,
                        hotelKeyword: p.hotelKeyword,
                        deptName: p.deptName,
                        items: p.items,
                        clientSig: p.clientSig,
                        driverSig: p.driverSig,
                        timestamp: new Date().toLocaleString()
                    }, { merge: true });
                });

                await Promise.all(savePromises);

                btn.innerText = "確認送出"; btn.disabled = false;
                
                groupedData[activeDeptKey].clientSig = cBase64;
                groupedData[activeDeptKey].driverSig = dBase64;
                
                if (isNewDriverSig && syncDepts.length > 0) {
                    syncDepts.forEach(dept => {
                        groupedData[dept].driverSig = dBase64;
                    });
                }

                closeSignModal();
                fetchData(true);
                
                const toast = document.getElementById('toast');
                toast.innerText = (isNewDriverSig && syncDepts.length > 0)
                    ? `✅ 已點收，並同步簽名至 ${syncDepts.length} 個部門！` 
                    : "✅ 點收簽單已成功更新！";
                
                toast.classList.remove('opacity-0'); 
                setTimeout(() => toast.classList.add('opacity-0'), 3000);

            } catch (e) {
                console.error(e);
                btn.innerText = "確認送出"; btn.disabled = false;
                alert("網路傳送失敗，請確認網路！");
            }
        }

        init();
    </script>
</body>
