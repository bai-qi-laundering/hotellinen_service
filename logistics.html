<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ★ 強制瀏覽器每次都抓最新網頁 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>百麒物流 - 飯店點收簽單 (載入修正版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; touch-action: manipulation; }
        .main-container { max-width: 500px; margin: 0 auto; }
        
        input[type="date"]::-webkit-calendar-picker-indicator { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        
        .sign-canvas { display: block; width: 100%; height: 160px; background: #fff; border: 2px dashed #cbd5e1; border-radius: 0.5rem; touch-action: none; cursor: crosshair; }
    </style>
</head>
<body class="p-3 pb-32 relative">
    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 text-white px-6 py-3 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-[10000] font-bold text-center">
    </div>

    <div class="main-container">
        <!-- 頂部資訊區 -->
        <div class="bg-blue-800 text-white p-5 rounded-t-2xl shadow-md text-center relative">
            <h1 id="hotelTitle" class="text-3xl font-black mb-1 mt-2">載入中...</h1>
            <div class="flex justify-center items-center gap-3 mt-2">
                <p id="dateTitle" class="text-lg font-bold text-blue-200">出貨點收系統</p>
                <button onclick="fetchData(false, true)" class="bg-blue-700 text-white text-sm px-3 py-1 rounded-lg shadow active:bg-blue-600 border border-blue-600">
                    🔄 重新載入
                </button>
            </div>
            <span id="syncIndicator" class="text-xs text-green-300 font-bold opacity-0 transition-opacity duration-500 absolute top-4 right-4 tracking-widest">●即時同步中</span>
        </div>
        
        <!-- 日期選擇區 -->
        <div class="bg-white p-4 rounded-b-2xl shadow-md mb-6 flex flex-col gap-3 border-t border-blue-900">
            <div class="relative w-full bg-blue-50 rounded-lg h-14 flex items-center justify-center border border-blue-200">
                <span class="absolute left-4 text-xl">📅</span>
                <div id="dateDisplay" class="w-full text-center font-bold text-xl pointer-events-none text-blue-900">載入中...</div>
                <input type="date" id="datePicker" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="dateChanged()">
            </div>
            <p class="text-center text-sm text-gray-400 font-bold">點擊上方可回溯查詢歷史點交紀錄</p>
            <div class="text-center mt-1">
                <button onclick="resetCurrentDateData()" class="text-xs text-red-500 font-bold bg-red-50 px-3 py-1 rounded-full border border-red-200 active:bg-red-100">🛠️ 資料異常？點此重置本日紀錄</button>
            </div>
        </div>

        <!-- 點交清單區 -->
        <div id="departmentsContainer" class="space-y-6">
            <div class="text-center py-10 text-gray-500 font-bold text-lg">載入資料中...</div>
        </div>
    </div>

    <!-- 雙簽名視窗 -->
    <div id="signModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-[10000] overflow-y-auto">
        <div class="bg-white p-5 rounded-2xl w-full max-w-sm my-auto">
            <h2 id="modalDeptTitle" class="text-xl font-black text-center text-blue-800 mb-4 border-b pb-2">部門名稱</h2>
            
            <div class="mb-5">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold text-gray-800">1. 飯店端主管簽收</h2>
                    <button onclick="clearCanvas(clientCtx, clientCanvas)" class="text-sm text-red-500 font-bold px-2 py-1 rounded bg-red-50 shadow-sm active:bg-red-100">清除重簽</button>
                </div>
                <canvas id="clientCanvas" class="sign-canvas"></canvas>
            </div>

            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold text-gray-800">2. 百麒司機簽收</h2>
                    <button onclick="clearCanvas(driverCtx, driverCanvas)" class="text-sm text-red-500 font-bold px-2 py-1 rounded bg-red-50 shadow-sm active:bg-red-100">清除重簽</button>
                </div>
                <canvas id="driverCanvas" class="sign-canvas"></canvas>
                <div class="text-xs text-blue-600 font-bold mt-2 text-right">💡 司機簽名將自動同步至其他<span class="text-red-500">未簽名</span>的部門</div>
            </div>

            <div class="flex gap-3">
                <button onclick="closeSignModal()" class="flex-1 p-4 text-lg font-bold bg-gray-200 text-gray-700 rounded-xl active:bg-gray-300">取消</button>
                <button id="submitBtn" onclick="submitVerify()" class="flex-1 p-4 text-lg font-bold bg-blue-600 text-white rounded-xl shadow-md active:bg-blue-700">確認送出</button>
            </div>
        </div>
    </div>

    <script>
        window.signPageStarted = false;
        window.signBootTimer = setTimeout(function () {
            if (window.signPageStarted) return;
            const box = document.getElementById('departmentsContainer');
            box.textContent = '連線較慢，尚未完成載入。請確認網路，或按下方重試。';
            const button = document.createElement('button');
            button.textContent = '重新整理';
            button.style.cssText = 'display:block;margin:16px auto;padding:12px 24px;background:#2563eb;color:white;border-radius:8px';
            button.onclick = function () { location.reload(); };
            box.appendChild(button);
        }, 20000);
    </script>
    <script type="module">
        // 動態匯入可捕捉 SDK 下載失敗，避免永遠停在「載入中」。
        try {
        const [firebaseApp, firestoreSDK, storageSDK] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js"),
            import("https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js")
        ]);
        const { initializeApp } = firebaseApp;
        const { collection, query, where, getDocsFromServer, doc, setDoc,
            getDocFromServer, deleteDoc, runTransaction, initializeFirestore, memoryLocalCache } = firestoreSDK;
        const { getStorage, ref, uploadString, getDownloadURL } = storageSDK;

        const firebaseConfig = {
            apiKey: "AIzaSyBEXcnXOKRags29CvhM6TKe3N-zty-ela4",
            authDomain: "hotel-inventory-3a1ad.firebaseapp.com",
            projectId: "hotel-inventory-3a1ad",
            storageBucket: "hotel-inventory-3a1ad.firebasestorage.app",
            messagingSenderId: "363844184412",
            appId: "1:363844184412:web:66cdd6425d53bde75f3999",
            measurementId: "G-NM1W9JT70F"
        };

        const app = initializeApp(firebaseConfig);
        
        // 單據需確認伺服器資料，使用記憶體快取避免依賴手機 IndexedDB。
        const db = initializeFirestore(app, { localCache: memoryLocalCache() });

        const storage = getStorage(app);
        
        let currentHotel = "";
        let currentDate = "";
        let groupedData = {}; 
        let activeDeptKey = ""; 
        let masterTemplate = []; 
        let globalItemOrder = {};
        let signatureSaving = false;
        let fetchSequence = 0;
        let dataReady = false;
        let templatePromise;
        function withReadTimeout(promise, label, ms = 15000) {
            let timer;
            return Promise.race([promise, new Promise((_, reject) => {
                timer = setTimeout(() => reject(new Error(label + '逾時，請確認網路後按重新載入')), ms);
            })]).finally(() => clearTimeout(timer));
        }
        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function finishBoot() { window.signPageStarted = true; clearTimeout(window.signBootTimer); }
 

        const clientCanvas = document.getElementById('clientCanvas');
        const driverCanvas = document.getElementById('driverCanvas');
        const clientCtx = clientCanvas.getContext('2d');
        const driverCtx = driverCanvas.getContext('2d');

        window.clientCanvas = clientCanvas; window.driverCanvas = driverCanvas;
        window.clientCtx = clientCtx; window.driverCtx = driverCtx;

        window.dateChanged = dateChanged; window.clearCanvas = clearCanvas;
        window.openSignModal = openSignModal; window.closeSignModal = closeSignModal;
        window.submitVerify = submitVerify; window.handleQtyChange = handleQtyChange;
        window.toggleDropdown = toggleDropdown; window.selectOption = selectOption;
        window.addNewItem = addNewItem; window.fetchData = fetchData;

        async function uploadSignatureToStorage(base64Data, fileName) {
            if (!base64Data || base64Data.startsWith('http')) return base64Data;
            try {
                const storageRef = ref(storage, `signatures/${currentDate}/${fileName}.jpg`);
                await uploadString(storageRef, base64Data, 'data_url');
                const downloadUrl = await getDownloadURL(storageRef);
                return downloadUrl;
            } catch (error) {
                console.error("圖片上傳失敗:", error);
                throw new Error(error.message || "Storage 權限或設定異常");
            }
        }

        window.resetCurrentDateData = async function() {
            if (!dataReady || signatureSaving) return;
            if(!confirm(`⚠️ 警告：確定要重置 ${currentDate} 的點交紀錄嗎？\n這將會刪除當天的所有簽名與修改，並完全恢復為出貨原始數量！\n\n(僅建議在數量被系統異常覆蓋時使用)`)) return;

            if (!confirm('再次確認：此操作會永久刪除當天物流單據及簽名，無法由此頁面復原。確定繼續？')) return;
            try {
                showToastMsg("⏳ 正在還原原始資料中...");
                let deletePromises = [];
                for (let dept in groupedData) {
                    const docId = `${currentDate}_${currentHotel}_${dept}`;
                    deletePromises.push(deleteDoc(doc(db, 'logistics_records', docId)));
                }
                await Promise.all(deletePromises);
                showToastMsg("✅ 資料已成功還原！重新載入中...");
                fetchData(false, true); 
            } catch(e) {
                console.error(e);
                showToastMsg("⚠️ 重置失敗：" + e.message, true);
            }
        }

        function getTodayString() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getExactTimeString() {
            const now = new Date();
            const y = now.getFullYear(); const m = String(now.getMonth() + 1).padStart(2, '0'); const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0'); const min = String(now.getMinutes()).padStart(2, '0'); const s = String(now.getSeconds()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}:${s}`;
        }

        function updateDateDisplay() {
            currentDate = document.getElementById('datePicker').value;
            if(!currentDate) return;
            const parts = currentDate.split('-');
            if(parts.length === 3) {
                document.getElementById('dateDisplay').innerText = `${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日`;
            }
        }

        function dateChanged() {
            if (signatureSaving) { document.getElementById('datePicker').value = currentDate; return; }
            closeSignModal();
            updateDateDisplay(); 
            fetchData(false); 
        }

        function showToastMsg(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed top-10 left-1/2 transform -translate-x-1/2 text-white px-6 py-3 rounded-full shadow-lg transition-opacity duration-300 z-[10000] font-bold text-center w-[90%] max-w-sm ${isError ? 'bg-red-600' : 'bg-green-700'}`;
            toast.classList.remove('opacity-0'); 
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        window.forceSyncToFinance = async function(deptKey, clickEvent) {
            if (!dataReady || signatureSaving) return;
            const btn = clickEvent.currentTarget;
            const originalText = btn.innerText;
            btn.innerText = "傳送中..."; btn.disabled = true;

            try {
                showToastMsg("⏳ 正在強制同步至財務系統...");
                const docId = `${currentDate}_${currentHotel}_${deptKey}`;
                const docRef = doc(db, 'logistics_records', docId);

                let safeItemsForDatabase = groupedData[deptKey].items.map(item => ({
                    deptName: item.deptName, itemName: item.itemName, originalQty: item.originalQty,
                    auntNote: item.auntNote, actualQty: item.actualQty, driverNote: item.driverNote || "手動強制同步"
                }));

                await setDoc(docRef, {
                    date: currentDate, hotelKeyword: currentHotel, deptName: deptKey,
                    items: safeItemsForDatabase, timestamp: new Date().toLocaleString(), forcedSync: true
                }, { merge: true });

                groupedData[deptKey].isSynced = true;
                renderDepartments();
                showToastMsg("✅ 已成功強制同步至財務後台！");
            } catch(e) {
                console.error(e);
                showToastMsg("⚠️ 同步失敗：" + e.message, true);
                btn.innerText = originalText; btn.disabled = false;
            }
        }

        function checkIsLocked(dateStr) {
            if (!dateStr) return false;
            let parts = dateStr.split('-');
            if (parts.length !== 3) return false;
            let lockDate = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
            lockDate.setDate(lockDate.getDate() + 2);
            return new Date() >= lockDate;
        }

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            currentHotel = urlParams.get('hotel');
            let queryDate = urlParams.get('date'); 
            
            if (!currentHotel || currentHotel.trim() === "") {
                finishBoot();
                document.getElementById('hotelTitle').innerText = "連結錯誤";
                document.getElementById('departmentsContainer').innerHTML = `
                    <div class="text-center py-16 bg-red-50 rounded-2xl border-2 border-red-200">
                        <span class="text-4xl block mb-2">🚫</span>
                        <div class="text-red-600 font-black text-xl mb-2">無效的存取連結</div>
                        <div class="text-red-500 font-bold text-sm">請向物流單位索取您所屬飯店的專屬點交網址</div>
                    </div>`;
                return;
            }

            document.getElementById('hotelTitle').innerText = currentHotel + " 點交";
            
            let targetDate = getTodayString(); 
            if (queryDate && queryDate.match(/^\d{4}-\d{2}-\d{2}$/)) {
                targetDate = queryDate; 
            }

            document.getElementById('datePicker').value = targetDate;
            updateDateDisplay();

            // 排序設定與單據同時讀取；設定較慢不阻擋單據顯示。
            templatePromise = withReadTimeout(getDocFromServer(doc(db, 'inventory_config', 'master_template')), '品項設定', 8000)
                .then(templateDoc => {
                    if (templateDoc.exists() && Array.isArray(templateDoc.data().items)) {
                        masterTemplate = templateDoc.data().items;
                        masterTemplate.forEach((t, idx) => {
                            if (globalItemOrder[t.item] === undefined) globalItemOrder[t.item] = idx;
                        });
                    }
                }).catch(e => console.warn('品項排序設定未載入，使用現有順序', e));
            await fetchData(false);
        }

        function extractQty(obj) {
            if (!obj) return "0";
            if (obj.doubleCount !== undefined && obj.doubleCount !== null && obj.doubleCount !== "") return String(obj.doubleCount);
            if (obj.count !== undefined && obj.count !== null && obj.count !== "") return String(obj.count);
            if (obj.quantity !== undefined && obj.quantity !== null && obj.quantity !== "") return String(obj.quantity);
            if (obj.qty !== undefined && obj.qty !== null && obj.qty !== "") return String(obj.qty);
            if (obj.amount !== undefined && obj.amount !== null && obj.amount !== "") return String(obj.amount);
            return "0";
        }

        function isValidItemName(name) {
            if (!name) return false;
            let cleanName = String(name).trim();
            if (cleanName === "" || cleanName.toLowerCase() === "undefined" || cleanName.toLowerCase() === "null") return false;
            return true;
        }

        const loadingHtml = `
            <div class="flex flex-col items-center justify-center py-12 space-y-4">
                <svg class="animate-spin h-12 w-12 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <div id="loadingText" class="text-blue-700 font-black text-xl animate-pulse tracking-wide">正在確認雲端單據...</div>
            </div>`;

        async function fetchData(isBackground = false, forceServer = false) {
            if (signatureSaving) { showToastMsg('正在儲存簽名，請稍候'); return; }
            if (!currentHotel || !currentDate) return;
            dataReady = false;
            const fetchTargetDate = currentDate;
            const thisFetch = ++fetchSequence;

            if (!isBackground) {
                document.getElementById('departmentsContainer').innerHTML = loadingHtml;
            } else {
                const indicator = document.getElementById('syncIndicator');
                if(indicator) {
                    indicator.classList.remove('opacity-0');
                    setTimeout(() => indicator.classList.add('opacity-0'), 1500);
                }
            }

            try {
                let rawData = [];
                const invQ = query(collection(db, "inventory_records"), where("date", "==", fetchTargetDate));
                const logQ = query(collection(db, "logistics_records"), where("date", "==", fetchTargetDate), where("hotelKeyword", "==", currentHotel));
                
                // 原始資料有 hotel / hotelKeyword / hotelName 混用，保留日期查詢避免漏單。
                // 兩份資料皆確認伺服器版本，防止舊數量搭配新簽名。
                const fetchMethod = getDocsFromServer;
                if (forceServer) showToastMsg("🔄 正在強制從雲端抓取最新單據...");

                // 簽名狀態優先從伺服器確認，避免離線快取造成假性「未簽名」。
                const [invSnap, logSnap] = await Promise.all([withReadTimeout(fetchMethod(invQ), '出貨資料讀取'), withReadTimeout(getDocsFromServer(logQ), '簽收資料讀取')]);

                if (currentDate !== fetchTargetDate || thisFetch !== fetchSequence || signatureSaving) {
                    return; 
                }

                let inventoryMap = {}; 
                
                invSnap.forEach(docSnap => {
                    const d = docSnap.data();
                    const hotelStr = d.hotel || d.hotelKeyword || d.hotelName || "";
                    
                    if (hotelStr.includes(currentHotel)) {
                        let deptName = hotelStr.replace(currentHotel, "").trim();
                        if (deptName === "") deptName = "房務";

                        const processInvItem = (itemData) => {
                            let itemName = itemData.itemName || itemData.item || itemData.name;
                            if (isValidItemName(itemName)) {
                                let key = `${deptName}_${String(itemName).trim()}`;
                                inventoryMap[key] = {
                                    deptName: deptName, itemName: String(itemName).trim(),
                                    originalQty: extractQty(itemData), auntNote: itemData.note || itemData.auntNote || d.note || ""
                                };
                            }
                        };

                        if (Array.isArray(d.items)) {
                            d.items.forEach(processInvItem);
                        } else {
                            processInvItem(d);
                        }
                    }
                });

                let savedLogistics = {};
                logSnap.forEach(docSnap => {
                    const d = docSnap.data();
                    savedLogistics[d.deptName] = d;
                });

                for (let key in inventoryMap) {
                    let invItem = inventoryMap[key];
                    let actualQty = invItem.originalQty; 
                    let driverNote = ""; let clientSig = ""; let driverSig = "";

                    let savedDept = savedLogistics[invItem.deptName];
                    if (!savedDept) {
                        savedDept = Object.values(savedLogistics).find(s => 
                            (s.deptName && s.deptName.includes(invItem.deptName)) || 
                            (invItem.deptName && invItem.deptName.includes(s.deptName))
                        );
                    }

                    if (savedDept) {
                        clientSig = savedDept.clientSig || ""; driverSig = savedDept.driverSig || "";
                        if (savedDept.items) {
                            let savedItem = savedDept.items.find(i => i.itemName === invItem.itemName);
                            if (savedItem) {
                                if (savedItem.actualQty !== undefined && savedItem.actualQty !== "") actualQty = String(savedItem.actualQty);
                                driverNote = savedItem.driverNote || "";
                            }
                        }
                    }

                    rawData.push({
                        deptName: invItem.deptName, itemName: invItem.itemName,
                        originalQty: invItem.originalQty, auntNote: invItem.auntNote,
                        actualQty: actualQty, driverNote: driverNote,
                        clientSig: clientSig, driverSig: driverSig, isSynced: !!savedDept
                    });
                }

                for (let deptKey in savedLogistics) {
                    let savedDept = savedLogistics[deptKey];
                    if (savedDept.items) {
                        savedDept.items.forEach(savedItem => {
                            if (!isValidItemName(savedItem.itemName)) return;
                            let key = `${savedDept.deptName}_${savedItem.itemName}`;
                            if (!inventoryMap[key]) {
                                if (savedItem.driverNote === "司機臨時新增") {
                                    rawData.push({
                                        deptName: savedDept.deptName, itemName: savedItem.itemName, originalQty: "0", 
                                        auntNote: savedItem.auntNote || "", actualQty: savedItem.actualQty !== undefined ? savedItem.actualQty : "0",
                                        driverNote: savedItem.driverNote || "", clientSig: savedDept.clientSig || "", driverSig: savedDept.driverSig || "", isSynced: true
                                    });
                                }
                            }
                        });
                    }
                }

                dataReady = true;
                finishBoot();
                processAndRenderData(rawData);
            } catch (err) {
                if (thisFetch === fetchSequence) dataReady = false;
                console.error("Fetch Data Error:", err);
                if (!isBackground && thisFetch === fetchSequence && !signatureSaving) {
                    finishBoot();
                    document.getElementById('departmentsContainer').innerHTML = `
                    <div class="text-center py-10 bg-red-50 rounded-2xl border border-red-200 mt-6 mx-4">
                        <span class="text-4xl block mb-3">⚠️</span>
                        <div class="text-red-600 font-black text-xl mb-2">讀取失敗</div>
                        <div class="text-red-500 font-bold text-sm mb-4">請檢查網路連線或重新整理頁面</div>
                        <div class="text-xs text-left bg-white p-3 rounded text-red-400 mx-4 overflow-auto font-mono border border-red-100">
                            System Error:<br>${escapeHtml(err.message || 'Unknown Network Error')}
                        </div>
                        <button onclick="fetchData(false, true)" class="bg-blue-600 text-white px-5 py-3 rounded-lg mt-4">重新載入</button>
                    </div>`;
                }
            }
        }

        function processAndRenderData(rawData) {
            let uniqueDataMap = {};
            rawData.forEach(item => {
                let key = item.deptName.trim() + "_" + item.itemName.trim();
                uniqueDataMap[key] = item; 
            });
            const cleanData = Object.values(uniqueDataMap);

            if (cleanData.length === 0) {
                document.getElementById('departmentsContainer').innerHTML = '<div class="text-center py-16 text-gray-500 font-bold text-xl">此日期無待點交資料！<br><span class="text-sm">請點擊上方日曆切換查詢日期</span></div>';
                return;
            }

            groupedData = {};
            cleanData.forEach(item => {
                if (Number(item.originalQty || 0) === 0 && Number(item.actualQty || 0) === 0) return; 

                if (!groupedData[item.deptName]) {
                    groupedData[item.deptName] = { items: [], clientSig: "", driverSig: "", isSynced: item.isSynced };
                } else {
                    if (item.isSynced) groupedData[item.deptName].isSynced = true;
                }
                
                if (item.clientSig) groupedData[item.deptName].clientSig = item.clientSig;
                if (item.driverSig) groupedData[item.deptName].driverSig = item.driverSig;

                let finalActualQty = (item.actualQty !== undefined && item.actualQty !== "" && item.actualQty !== null) ? item.actualQty : item.originalQty;

                groupedData[item.deptName].items.push({
                    deptName: item.deptName, itemName: item.itemName, originalQty: item.originalQty,
                    auntNote: item.auntNote, actualQty: finalActualQty, driverNote: item.driverNote
                });
            });

            if (Object.keys(groupedData).length === 0) {
                document.getElementById('departmentsContainer').innerHTML = '<div class="text-center py-16 text-green-600 font-bold text-xl">🎉 此日期所有品項出貨量皆為 0，無須點交！</div>';
                return;
            }
            renderDepartments();
        }

        function handleQtyChange(dept, idx, inputEl) {
            let val = inputEl.value;
            if (val.length > 1 && val.startsWith('0')) {
                val = val.replace(/^0+/, ''); if (val === '') val = '0';
                inputEl.value = val;
            }
            groupedData[dept].items[idx].actualQty = val;
            const original = groupedData[dept].items[idx].originalQty;
            const statusSpan = document.getElementById(`status-${dept}-${idx}`);
            const container = inputEl.closest('.bg-blue-50');

            if (Number(val || 0) === Number(original || 0)) {
                statusSpan.innerHTML = "✅ 相符"; statusSpan.className = "text-green-600 font-bold ml-3 text-base";
                if (container) { container.classList.remove('border-red-300'); container.classList.add('border-transparent'); }
            } else {
                statusSpan.innerHTML = "⚠️ 已修改"; statusSpan.className = "text-red-500 font-bold ml-3 text-base";
                if (container) { container.classList.remove('border-transparent'); container.classList.add('border-red-300'); }
            }
        }

        function toggleDropdown(deptId, e) {
            e.stopPropagation();
            const menu = document.getElementById(`customDropdownMenu-${deptId}`);
            if (menu) menu.classList.toggle('hidden');
        }

        function selectOption(deptId, val) {
            document.getElementById(`newItemInput-${deptId}`).value = val;
            document.getElementById(`customDropdownMenu-${deptId}`).classList.add('hidden');
        }

        function addNewItem(deptId, deptName) {
            const inputEl = document.getElementById(`newItemInput-${deptId}`);
            const newItemName = inputEl.value.trim();
            if (!newItemName) { showToastMsg("⚠️ 請輸入要新增的品項名稱！", true); return; }
            let exists = groupedData[deptName].items.some(i => i.itemName === newItemName);
            if (exists) { showToastMsg("⚠️ 這個品項已經在上方列表裡面囉！", true); return; }

            groupedData[deptName].items.push({
                deptName: deptName, itemName: newItemName, originalQty: "0", auntNote: "", actualQty: "0", driverNote: "司機臨時新增"
            });
            inputEl.value = "";
            showToastMsg("✅ 已新增臨時品項！");
            renderDepartments(); 
        }

        document.addEventListener('click', function(e) {
            document.querySelectorAll('[id^="customDropdownMenu-"]').forEach(menu => {
                const deptId = menu.id.split('-')[1];
                const btn = document.getElementById(`dropdownBtn-${deptId}`);
                const input = document.getElementById(`newItemInput-${deptId}`);
                if (menu && !menu.classList.contains('hidden')) {
                    if (!menu.contains(e.target) && (!btn || !btn.contains(e.target)) && e.target !== input) {
                        menu.classList.add('hidden');
                    }
                }
            });
        });

        function renderDepartments() {
            let html = "";
            let deptIndex = 0;
            let autoSyncPromises = []; 
            const commonItems = ['方巾', '床墊', '枕頭', '床包', '羽毛被', '抱枕套', '置物墊', '嬰兒床圍組', '嬰兒床包/裙', '嬰兒被套', '嬰兒枕套', '嬰兒床圍', '桌裙', '親子床單', '親子被套', '涼被', '門簾'];
            let isSystemLocked = checkIsLocked(currentDate);

            for (let dept in groupedData) {
                deptIndex++;
                let deptId = `dept_${deptIndex}`;
                let isSynced = groupedData[dept].isSynced;
                let localItemOrder = {};
                if (masterTemplate && masterTemplate.length > 0) {
                    let matchedItems = masterTemplate.filter(t => 
                        (t.baseName === currentHotel || (t.hotel && t.hotel.includes(currentHotel))) && 
                        ((t.deptName || "房務") === dept || (t.deptName === "" && dept === "房務") || (t.hotel && t.hotel.includes(dept)))
                    );
                    if (matchedItems.length === 0) matchedItems = masterTemplate.filter(t => t.baseName === currentHotel || (t.hotel && t.hotel.includes(currentHotel)));
                    matchedItems.forEach((t, idx) => { if (localItemOrder[t.item] === undefined) localItemOrder[t.item] = idx; });
                }

                let hasClientSig = groupedData[dept].clientSig ? true : false;
                let hasDriverSig = groupedData[dept].driverSig ? true : false;
                let isCompleted = hasClientSig && hasDriverSig;
                let inputDisabled = isCompleted || isSystemLocked;
                let actionButton = "";

                if (isCompleted) {
                    actionButton = `<div class="w-full mt-2 py-4 text-green-700 font-black text-2xl text-center bg-green-50 rounded-xl border-2 border-green-200 shadow-sm flex flex-col items-center justify-center gap-2">
                        <div class="flex items-center justify-center gap-2"><span>✅ 已點收完畢</span><button onclick="openSignModal('${dept}')" class="text-sm bg-white text-green-700 border border-green-300 px-3 py-1 rounded shadow-sm active:bg-green-100 ml-2">查看簽名</button></div>
                        <button onclick="forceSyncToFinance('${dept}', event)" class="mt-1 text-xs bg-green-200 text-green-800 border border-green-300 px-3 py-1 rounded shadow-sm active:bg-green-300">🔄 重新手持同步至財務系統</button>
                    </div>`;
                } else if (isSystemLocked) {
                    if (!isSynced) {
                        actionButton = `<div class="w-full mt-4 py-4 text-red-700 font-black text-xl text-center bg-red-50 rounded-xl border-2 border-red-300 shadow-sm flex flex-col items-center justify-center gap-2">
                            <span>⚠️ 逾期未簽收，且尚未進入財務系統</span><span class="text-sm text-red-500 font-bold">目前財務後台看不到這筆帳單</span>
                            <button onclick="forceSyncToFinance('${dept}', event)" class="mt-2 text-base bg-red-600 text-white font-bold px-6 py-2 rounded-lg shadow-md active:bg-red-700 animate-pulse">🔄 立即強制同步至財務系統</button>
                        </div>`;
                        // 不在「渲染畫面」時寫入資料庫：離線快取可能誤判未同步，
                        // 舊版自動結單會把實際已簽收的簽名改寫成空字串。請由人工核對後再同步。
                    } else {
                        actionButton = `<div class="w-full mt-4 py-4 text-gray-500 font-black text-xl text-center bg-gray-200 rounded-xl border-2 border-gray-300 shadow-sm flex flex-col items-center justify-center gap-2">
                            <span>🔒 逾期系統已自動結單</span><span class="text-sm text-gray-500 font-bold">數量已鎖定並連動財務，飯店無法再修改</span>
                            <button onclick="forceSyncToFinance('${dept}', event)" class="mt-1 text-xs bg-gray-300 text-gray-700 border border-gray-400 px-3 py-1 rounded shadow-sm active:bg-gray-400">🔄 重新手動同步至財務</button>
                        </div>`;
                    }
                } else if (hasClientSig && !hasDriverSig) {
                    actionButton = `<button onclick="openSignModal('${dept}')" class="w-full mt-4 p-4 bg-orange-500 text-white rounded-xl font-bold text-lg shadow-md animate-pulse">🚚 等待司機簽名確認</button>`;
                } else if (!hasClientSig && hasDriverSig) {
                    actionButton = `<button onclick="openSignModal('${dept}')" class="w-full mt-4 p-4 bg-orange-500 text-white rounded-xl font-bold text-lg shadow-md animate-pulse">🏨 等待飯店確認簽名</button>`;
                } else {
                    actionButton = `<button onclick="openSignModal('${dept}')" class="w-full mt-4 p-4 bg-blue-600 text-white rounded-xl font-bold text-lg shadow-md">📝 進行點交與簽名</button>`;
                }

                groupedData[dept].items.sort((a, b) => {
                    let idxA = localItemOrder[a.itemName] !== undefined ? localItemOrder[a.itemName] : 9999;
                    let idxB = localItemOrder[b.itemName] !== undefined ? localItemOrder[b.itemName] : 9999;
                    return idxA - idxB;
                });

                let itemsHtml = groupedData[dept].items.map((item, idx) => {
                    let isMatching = Number(item.actualQty || 0) === Number(item.originalQty || 0);
                    let statusText = isMatching ? "✅ 相符" : "⚠️ 已修改";
                    let statusClass = isMatching ? "text-green-600 font-bold ml-3 text-base" : "text-red-500 font-bold ml-3 text-base";
                    
                    return `
                    <div class="border-b border-gray-100 py-4 last:border-0">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-black text-2xl text-gray-800">${item.itemName}</span>
                            <div class="text-right">
                                <span class="text-xs text-gray-400 block">盤點出貨</span>
                                <span class="font-bold text-2xl text-gray-400">${item.originalQty}</span>
                            </div>
                        </div>
                        ${item.auntNote ? `<div class="text-base text-orange-700 bg-orange-100 p-3 rounded-lg mb-3 font-bold border border-orange-200">📝 飯店備註: ${item.auntNote}</div>` : ''}
                        <div class="bg-blue-50 p-3 rounded-lg border ${isMatching ? 'border-transparent' : 'border-red-300'}">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-blue-900">實收(請款)量：</span>
                                <div class="flex items-center">
                                    <input type="number" oninput="handleQtyChange('${dept}', ${idx}, this)" value="${item.actualQty}" 
                                           class="w-20 p-1 text-right font-black text-2xl outline-none rounded ${inputDisabled ? 'bg-transparent text-gray-600 pr-0' : 'bg-white border-b-2 border-blue-500 text-blue-700 shadow-sm'}" 
                                           ${inputDisabled ? 'disabled' : ''}>
                                    <span id="status-${dept}-${idx}" class="${statusClass}">${statusText}</span>
                                </div>
                            </div>
                        </div>
                    </div>`}).join('');

                let dropdownHtml = commonItems.map(val => `<div class="p-3 border-b border-gray-100 text-xl font-black text-gray-700 active:bg-blue-50 cursor-pointer" onclick="selectOption('${deptId}', '${val}')">${val}</div>`).join('');

                let addItemHtml = "";
                if (!inputDisabled) {
                    addItemHtml = `
                    <div class="mt-4 bg-indigo-50 p-4 rounded-xl border border-dashed border-indigo-300">
                        <h3 class="text-sm font-black mb-2 text-indigo-800">➕ 臨時新增出貨品項</h3>
                        <div class="flex gap-2 relative">
                            <div class="relative flex-1">
                                <input id="newItemInput-${deptId}" class="w-full h-full p-2 text-lg font-bold border border-indigo-200 rounded-lg outline-none focus:border-indigo-500 bg-white pr-10" placeholder="手打或選單 👉">
                                <button id="dropdownBtn-${deptId}" onclick="toggleDropdown('${deptId}', event)" class="absolute right-1 top-1/2 transform -translate-y-1/2 p-1 bg-indigo-100 text-indigo-800 rounded-md font-bold shadow-sm border border-indigo-300 active:bg-indigo-200 flex items-center justify-center h-8 w-8">
                                    <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
                                </button>
                                <div id="customDropdownMenu-${deptId}" class="hidden absolute z-[30000] w-full mt-1 max-h-60 overflow-y-auto bg-white border-2 border-indigo-300 rounded-xl shadow-2xl">${dropdownHtml}</div>
                            </div>
                            <button onclick="addNewItem('${deptId}', '${dept}')" class="px-4 bg-green-600 text-white rounded-lg font-bold text-lg shadow-md active:bg-green-700 whitespace-nowrap">新增</button>
                        </div>
                    </div>`;
                }

                html += `
                <div class="bg-white p-4 rounded-2xl shadow-md border border-gray-200 mb-6">
                    <div class="bg-gray-800 text-white p-3 -mx-4 -mt-4 mb-3 rounded-t-2xl"><h2 class="text-xl font-black text-center">${dept}</h2></div>
                    ${itemsHtml}${addItemHtml}${actionButton}
                </div>`;
            }
            
            document.getElementById('departmentsContainer').innerHTML = html;
            if(autoSyncPromises.length > 0) {
                Promise.all(autoSyncPromises).then(() => {
                    showToastMsg("🔄 系統已自動將幽靈單據補傳送至財務後台！");
                    setTimeout(renderDepartments, 1200); 
                }).catch(err => console.error(err));
            }
        }

        function setupCanvas(canvas, ctx) {
            canvas.isModified = false; canvas.isCleared = false; 

            function fillWhite() {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            function start(e) { 
                e.preventDefault(); canvas.painting = true; canvas.isCleared = false; draw(e); 
            }
            function draw(e) {
                if(!canvas.painting) return; e.preventDefault();
                canvas.isModified = true; 
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
            }
            function stop(e) { e.preventDefault(); canvas.painting = false; ctx.beginPath(); }
            canvas.addEventListener('mousedown', start); canvas.addEventListener('touchstart', start, {passive: false});
            canvas.addEventListener('mousemove', draw); canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('mouseup', stop); canvas.addEventListener('touchend', stop);
            canvas.fillWhite = fillWhite;
        }
        setupCanvas(clientCanvas, clientCtx);
        setupCanvas(driverCanvas, driverCtx);

        function clearCanvas(ctx, canvas) { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            canvas.fillWhite();
            canvas.isModified = true; canvas.isCleared = true; 
        }

        function openSignModal(deptName) {
            if (!dataReady || signatureSaving || !groupedData[deptName]) return;
            activeDeptKey = deptName;
            document.getElementById('modalDeptTitle').innerText = deptName;
            let existClient = groupedData[deptName].clientSig;
            let existDriver = groupedData[deptName].driverSig;

            document.getElementById('signModal').classList.remove('hidden');
            requestAnimationFrame(() => {
                [clientCanvas, driverCanvas].forEach(c => { 
                    c.width = c.offsetWidth; c.height = 160; c.isModified = false; c.isCleared = false; 
                });
                [clientCtx, driverCtx].forEach(ctx => { 
                    ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#000'; 
                    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 500, 200);
                });
                
                if(existClient) { 
                    let img = new Image(); 
                    img.crossOrigin = "anonymous";
                    img.onload = ()=> clientCtx.drawImage(img,0,0); 
                    img.src = existClient; 
                }
                if(existDriver) { 
                    let img = new Image(); 
                    img.crossOrigin = "anonymous";
                    img.onload = ()=> driverCtx.drawImage(img,0,0); 
                    img.src = existDriver; 
                }
            });
        }
        
        function closeSignModal() { if (signatureSaving) return; document.getElementById('signModal').classList.add('hidden'); }

        async function submitVerify() {
            if (signatureSaving || !dataReady) return;
            const dept = activeDeptKey;
            const group = groupedData[dept];
            if (!group) return;
            const signingDate = currentDate;
            const signingHotel = currentHotel;
            const cNew = clientCanvas.isModified && !clientCanvas.isCleared;
            const dNew = driverCanvas.isModified && !driverCanvas.isCleared;
            // 「清除重簽」代表放棄畫布內容，不是刪除已存的簽名。
            if (!cNew && !dNew) {
                showToastMsg('沒有新的簽名需要儲存，原有簽名未變更。', true);
                return;
            }
            if (!group.clientSig && !cNew && !group.driverSig && !dNew) {
                showToastMsg('請先完成簽名', true); return;
            }
            const button = document.getElementById('submitBtn');
            signatureSaving = true;
            document.getElementById('datePicker').disabled = true;
            button.disabled = true;
            button.textContent = '⏳ 正在確認雲端儲存...';
            // 使儲存前的背景請求不能反向覆蓋新簽名畫面。
            ++fetchSequence;
            try {
                const clientBlob = cNew ? clientCanvas.toDataURL('image/jpeg',0.7) : null;
                const driverBlob = dNew ? driverCanvas.toDataURL('image/jpeg',0.7) : null;
                // 只上傳本次實際重新簽名的圖片；不得重寫原有 URL。
                const clientUrl = clientBlob ? await uploadSignatureToStorage(clientBlob,`${signingHotel}_${dept}_client_${Date.now()}`) : null;
                const driverUrl = driverBlob ? await uploadSignatureToStorage(driverBlob,`${signingHotel}_driver_${Date.now()}`) : null;
                const saveDept = async (targetDept, main) => {
                    const refDoc = doc(db,'logistics_records',`${signingDate}_${signingHotel}_${targetDept}`);
                    const items = groupedData[targetDept]?.items.map(i=>({
                        deptName:i.deptName,itemName:i.itemName,originalQty:i.originalQty,
                        auntNote:i.auntNote,actualQty:i.actualQty,driverNote:i.driverNote||''
                    })) || [];
                    await runTransaction(db, async tx => {
                        const old = await tx.get(refDoc);
                        const prior = old.exists() ? old.data() : {};
                        const update = {date:signingDate,hotelKeyword:signingHotel,deptName:targetDept,
                            timestamp:getExactTimeString(),signatureSavedAt:Date.now()};
                        if (main) {
                            update.items=items;
                            if(clientUrl) update.clientSig=clientUrl;
                            if(driverUrl) update.driverSig=driverUrl;
                        } else {
                            // 將司機簽名帶到尚無司機簽名的部門，不動飯店簽名及數量。
                            if (!prior.driverSig && driverUrl) update.driverSig=driverUrl;
                            else return;
                        }
                        tx.set(refDoc,update,{merge:true});
                    });
                };
                await saveDept(dept,true);
                const synced = [];
                if (driverUrl) {
                    for (const other of Object.keys(groupedData)) {
                        if(other===dept || groupedData[other].driverSig) continue;
                        try { await saveDept(other,false); synced.push(other); }
                        catch(err) { console.warn('其他部門簽名同步失敗',other,err); }
                    }
                }
                // 再從伺服器讀取簽名，確定 Firestore 已保存才提示完成。
                const verified = await getDocFromServer(doc(db,'logistics_records',`${signingDate}_${signingHotel}_${dept}`));
                if (!verified.exists() || (clientUrl && verified.data().clientSig!==clientUrl) ||
                    (driverUrl && verified.data().driverSig!==driverUrl)) {
                    throw new Error('簽名寫入後驗證失敗，請重新載入確認');
                }
                const saved = verified.data();
                group.clientSig=saved.clientSig||'';
                group.driverSig=saved.driverSig||'';
                group.isSynced=true;
                synced.forEach(k=>{if(groupedData[k] && !groupedData[k].driverSig)groupedData[k].driverSig=driverUrl;});
                document.getElementById('signModal').classList.add('hidden');
                showToastMsg('✅ 已由雲端確認簽名儲存成功');
                renderDepartments();
            } catch(err) {
                console.error('簽名儲存失敗',err);
                showToastMsg('❌ 簽名尚未確認儲存，請勿離開：'+err.message,true);
                alert('簽名未完成雲端確認。請檢查網路後重新送出，勿當成已簽收。\n'+err.message);
            } finally {
                signatureSaving=false;
                document.getElementById('datePicker').disabled = false;
                button.disabled=false;
                button.textContent='確認送出';
            }
        }

        // 啟動系統
        await init();
        } catch (err) {
            console.error('簽收頁啟動失敗', err);
            window.signPageStarted = true;
            clearTimeout(window.signBootTimer);
            document.getElementById('hotelTitle').textContent = '載入未完成';
            const box = document.getElementById('departmentsContainer');
            box.textContent = '無法啟動簽收單，請確認網路後重新整理。錯誤：' + (err.message || err);
            const button = document.createElement('button');
            button.textContent = '重新整理';
            button.onclick = () => location.reload();
            box.appendChild(button);
        }
    </script>
