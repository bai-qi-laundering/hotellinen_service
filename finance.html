<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百麒物流 - 財務月結對帳單</title>
    <!-- 引入 Excel 匯出套件 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        /* 專業 Excel 風格 */
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f8; color: #000; padding: 20px; font-size: 14px; }
        
        /* 頂部控制面板設計 */
        .control-panel { border: 1px solid #aaa; padding: 20px; margin-bottom: 25px; background-color: #fff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-radius: 8px;}
        .panel-title { margin-top: 0; color: #1f2937; font-size: 24px; border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 20px; }
        
        .flex-row { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .date-input { padding: 6px 10px; border: 1px solid #ccc; font-size: 15px; border-radius: 4px; font-weight: bold; }
        
        button { padding: 8px 16px; border: 1px solid #555; background-color: #e0e0e0; cursor: pointer; font-weight: bold; border-radius: 6px; transition: 0.2s;}
        button:hover { background-color: #ccc; }
        .btn-25 { background-color: #f59e0b; color: white; border-color: #d97706; }
        .btn-25:hover { background-color: #d97706; }
        .btn-end { background-color: #8b5cf6; color: white; border-color: #7c3aed; }
        .btn-end:hover { background-color: #7c3aed; }
        .btn-select-all { background-color: #3b82f6; color: white; border-color: #2563eb; }
        .btn-select-all:hover { background-color: #2563eb; }
        
        .btn-excel { background-color: #107c41; color: white; border-color: #0b5e31; font-size: 16px; padding: 10px 20px;}
        .btn-excel:hover { background-color: #0c6132; }
        .btn-load { background-color: #1e3a8a; color: white; border-color: #1e3a8a; font-size: 16px; padding: 10px 20px;}
        .btn-load:hover { background-color: #1e40af; }

        /* 核取方塊清單設計 */
        .search-box { padding: 8px 12px; border: 2px solid #3b82f6; font-size: 15px; border-radius: 6px; width: 250px; outline: none; }
        .search-box:focus { border-color: #1e40af; }
        .checkbox-container { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; 
            margin-top: 15px; max-height: 250px; overflow-y: auto; border: 1px solid #ddd; padding: 15px; background: #f9f9f9; border-radius: 6px;
        }
        .cb-label { display: inline-flex; align-items: center; background: #fff; border: 1px solid #ccc; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; user-select: none; font-weight: bold; color: #444;}
        .cb-label:hover { background: #eef2ff; border-color: #93c5fd; }
        .cb-label input { margin-right: 8px; transform: scale(1.3); cursor: pointer;}
        
        /* 區塊標題設計 */
        .dept-title { font-size: 20px; font-weight: 900; margin-top: 40px; margin-bottom: 10px; color: #1e3a8a; border-bottom: 3px solid #1e3a8a; padding-bottom: 5px; }
        .summary-title { font-size: 16px; font-weight: bold; margin-top: 15px; margin-bottom: 10px; color: #0b5e31; display: flex; align-items: center; }
        .summary-title::before { content: "📊"; margin-right: 8px; }

        .excel-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background-color: #fff; }
        .excel-table th, .excel-table td { border: 1px solid #000; padding: 8px 10px; text-align: left; vertical-align: middle; }
        .excel-table th { background-color: #e2efda; font-weight: bold; text-align: center; } 
        .summary-table th { background-color: #fff2cc; } 
        
        /* 欄寬設定 */
        .col-date { width: 100px; text-align: center; }
        .col-dept { width: auto; white-space: nowrap; }
        .col-item { width: 150px; }
        .col-qty-readonly { width: 80px; text-align: right; color: #666; background-color: #f9f9f9; }
        .col-qty-edit { width: 90px; text-align: right; }
        .col-price { width: 80px; text-align: right; }
        .col-amount { width: 110px; text-align: right; font-weight: bold; }
        .col-note { width: 180px; }

        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .text-bold { font-weight: bold; }
        
        .edit-input { width: 100%; border: 2px solid #90caf9; padding: 6px; box-sizing: border-box; background-color: #e3f2fd; font-weight: bold; font-family: inherit; font-size: 15px;}
        .edit-input:focus { outline: none; border-color: #1976d2; background-color: #fff; }
        .qty-input { text-align: right; }

        .subtotal-row td { font-weight: bold; background-color: #fce4d6; font-size: 15px;}
        .grand-total-section { margin-top: 50px; border: 3px double #000; background-color: #fff; padding: 20px;}
        .grand-total-row td { font-weight: 900; background-color: #ffffcc; font-size: 18px;} 
        .tax-row td { font-weight: 900; background-color: #ddebf7; font-size: 18px; color: #c00000;}

        .msg-box { padding: 20px; text-align: center; font-weight: bold; border: 1px solid #aaa; margin-top: 20px; background-color: #fff;}

        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background-color: #fff;}
            .dept-title { margin-top: 30px; page-break-after: avoid; }
            .excel-table { page-break-inside: avoid; }
            .excel-table th, .excel-table td { border: 1px solid #000 !important; }
            .excel-table th { background-color: #e2efda !important; -webkit-print-color-adjust: exact; }
            .summary-table th { background-color: #fff2cc !important; -webkit-print-color-adjust: exact; }
            .subtotal-row td { background-color: #fce4d6 !important; -webkit-print-color-adjust: exact; }
            .grand-total-section { border: 2px solid #000 !important; }
            .grand-total-row td { background-color: #ffffcc !important; -webkit-print-color-adjust: exact; }
            .tax-row td { background-color: #ddebf7 !important; -webkit-print-color-adjust: exact; }
            
            .edit-input { border: none !important; background: transparent !important; padding: 0 !important; }
            .edit-input::-webkit-outer-spin-button, .edit-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
            .edit-input[type=number] { -moz-appearance: textfield; }
        }
    </style>
</head>
<body>

    <div class="no-print control-panel">
        <h2 class="panel-title">百麒物流 💼 財務多維結帳系統 (極速版)</h2>
        
        <div class="flex-row">
            <span style="font-weight: bold; font-size: 16px;">結帳區間設定：</span>
            <label>起始：</label><input type="date" id="startDatePicker" class="date-input">
            <label>結束：</label><input type="date" id="endDatePicker" class="date-input">
        </div>
        
        <div style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px;">
            <div class="flex-row" style="background: #fdf6e3; padding: 10px; border-radius: 8px;">
                <label style="font-size: 16px; font-weight: bold; color: #b45309;">1. 快速載入群組名單：</label>
                <button class="btn-25" onclick="checkGroup('25')">☑️ 一鍵全選 25號結帳飯店</button>
                <button class="btn-end" onclick="checkGroup('end')">☑️ 一鍵全選 月底結帳飯店</button>
                <button onclick="clearChecks()">🔲 清空所有勾選</button>
            </div>
            
            <div class="flex-row" style="background: #eff6ff; padding: 10px; border-radius: 8px; margin-top: 10px;">
                <label style="font-size: 16px; font-weight: bold; color: #1d4ed8;">2. 關鍵字過濾 (自訂選單)：</label>
                <input type="text" id="cbSearch" class="search-box" oninput="filterCheckboxes()" placeholder="例如打『文』或『文旅』...">
                <button class="btn-select-all" onclick="selectAllVisible()">☑️ 全選下方目前顯示的飯店</button>
            </div>
        </div>

        <div id="checkboxContainer" class="checkbox-container">
            <span style="color: #2563eb; font-weight: bold; font-size: 16px;">🔄 正在從後台同步最新飯店名單...</span>
        </div>

        <div style="margin-top: 20px; border-top: 2px solid #1f2937; padding-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn-load" onclick="fetchData()">⬇️ 載入報表 (計算勾選的名單)</button>
            <button class="btn-excel" onclick="exportToExcel()">📊 匯出 Excel</button>
            <button onclick="window.print()" style="font-size: 16px; padding: 10px 20px;">🖨️ 列印 / 匯出 PDF</button>
            
            <!-- ★ 新增：專屬的物流舊資料吸取按鈕 -->
            <button id="syncLogisticsBtn" onclick="syncLogisticsFromGoogleSheet()" style="background-color: #fef08a; color: #854d0e; border-color: #fde047; font-size: 16px; padding: 10px 20px; margin-left: auto;">
                📥 補救：吸取舊版物流與簽名 (從試算表)
            </button>
        </div>
    </div>

    <div id="printHeader" style="text-align: center; margin-bottom: 15px;">
        <h2 style="font-size: 24px; margin-bottom: 5px;">百麒物流 - 飯店點交請款明細表</h2>
        <p id="printInfo" style="margin: 0; font-weight: bold; color: #555; font-size: 16px;"></p>
    </div>

    <div id="resultsContainer">
        <div class="msg-box no-print text-gray-500">請設定區間、勾選上方飯店後，點擊「載入報表」按鈕</div>
    </div>

    <!-- ★ 引入 Firebase 模組 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        // ★ 加入 writeBatch 模組用於大量寫入
        import { getFirestore, collection, query, where, getDocs, doc, getDoc, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        // ★ 您的 Firebase 金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyBEXcnXOKRags29CvhM6TKe3N-zty-ela4",
            authDomain: "hotel-inventory-3a1ad.firebaseapp.com",
            projectId: "hotel-inventory-3a1ad",
            storageBucket: "hotel-inventory-3a1ad.firebasestorage.app",
            messagingSenderId: "363844184412",
            appId: "1:363844184412:web:66cdd6425d53bde75f3999",
            measurementId: "G-NM1W9JT70F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 試算表仍作為單價來源，也作為這次舊資料吸取來源
        const API_URL = "https://script.google.com/macros/s/AKfycbyPrkLoz1QNrynxKK09CWgMNbuePWCmQdtmx8Iqwq9l90xk0ZGZSOc-N-bkTePyXb4RVA/exec";

        // ==========================================
        // 🏨 內建專屬的兩大結帳群組名單
        // ==========================================
        const group25 = [
            "良一", "良西", "良站前", "英迪格", "富野", "富汽", "富野制服",
            "然一-房務", "然一-餐廳", "H2O-行政", "H2O-房務", "H2O-西餐", "H2O-中餐",
            "花季-C館", "花季-A館", "花季-裸湯", "花季-餐廳", "花季-制服", "H2O-客衣",
            "洲際-房務", "天子閣", "洲際-餐廳", "驛館-房務", "承億", "承億餐廳", "承億休閒",
            "承億制服", "驛館-法餐", "承億健身房", "承億25F日料", "然一-制服", "然一-客衣",
            "萊特薇庭", "驛館-餐酒館", "帕鉑", "承億27F BAR KAO", "承億22F仕女樓",
            "候工所", "然一-護膚", "承億B1F中餐廳", "驛館-制服", "驛館-客衣"
        ];

        const groupEnd = [
            "捷站前", "捷中正", "歐遊", "鈞怡", "宮賞", "家和", "秝二", "秝芯", "比歐",
            "駱駝", "喜達絲", "泊思行旅", "癮室", "媚力泊", "巨蛋", "老新", "永心",
            "雅樂", "福客來", "林森", "建工", "鴨點棧", "高廬", "頭等艙", "河畔",
            "好地方", "好地方-六合館", "文旅", "文旅-七賢館", "文旅-一心館", "禾鮨",
            "日航", "日航-休閒中心", "日航-餐廳", "日航-制服", "鼎王-富國店",
            "鼎王-七賢店", "無老鍋", "禾寓", "雅樂十刻"
        ];

        let currentReportData = [];
        let globalItemOrder = {}; 

        // 綁定到全域以便 HTML 呼叫
        window.checkGroup = checkGroup;
        window.clearChecks = clearChecks;
        window.filterCheckboxes = filterCheckboxes;
        window.selectAllVisible = selectAllVisible;
        window.fetchData = fetchData;
        window.exportToExcel = exportToExcel;
        window.updateQty = updateQty;
        window.updateNote = updateNote;
        window.syncLogisticsFromGoogleSheet = syncLogisticsFromGoogleSheet; // ★ 綁定新功能

        function formatMoney(num) {
            return Number(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        window.onload = async function() {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            
            document.getElementById('startDatePicker').value = firstDay.toISOString().split('T')[0];
            document.getElementById('endDatePicker').value = today.toISOString().split('T')[0];
            document.getElementById('printHeader').style.display = 'none'; 
            
            await loadTemplateCheckboxes();
        };

        // ★ 極速版：從 Firebase 載入名單
        async function loadTemplateCheckboxes() {
            const container = document.getElementById('checkboxContainer');
            try {
                const templateDoc = await getDoc(doc(db, 'inventory_config', 'master_template'));
                let template = [];
                if (templateDoc.exists() && templateDoc.data().items) {
                    template = templateDoc.data().items;
                }

                globalItemOrder = {};
                let uniqueHotels = new Set();

                template.forEach((t, idx) => {
                    if (globalItemOrder[t.item] === undefined) {
                        globalItemOrder[t.item] = idx;
                    }
                    uniqueHotels.add(t.hotel); // 例如 "H2O 房務"
                });

                let html = "";
                Array.from(uniqueHotels).sort().forEach(h => {
                    html += `<label class="cb-label"><input type="checkbox" class="hotel-cb" value="${h}"> ${h}</label>`;
                });
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = "<span style='color:red;'>無法載入飯店清單，請檢查網路連線</span>";
            }
        }

        function filterCheckboxes() {
            const keyword = document.getElementById('cbSearch').value.toLowerCase().replace(/\s+/g, '');
            const labels = document.querySelectorAll('.cb-label');
            labels.forEach(label => {
                const val = label.innerText.toLowerCase().replace(/\s+/g, '');
                if (val.includes(keyword)) {
                    label.style.display = 'inline-flex';
                } else {
                    label.style.display = 'none';
                }
            });
        }

        function clearChecks() {
            document.querySelectorAll('.hotel-cb').forEach(cb => cb.checked = false);
            document.getElementById('cbSearch').value = '';
            filterCheckboxes();
        }

        function selectAllVisible() {
            document.querySelectorAll('.cb-label').forEach(label => {
                if (label.style.display !== 'none') {
                    label.querySelector('.hotel-cb').checked = true;
                }
            });
        }

        function checkGroup(type) {
            clearChecks(); 
            const listToMatch = type === '25' ? group25 : groupEnd;
            const cbs = document.querySelectorAll('.hotel-cb');

            cbs.forEach(cb => {
                let val = cb.value.replace(/\s+/g, '').replace(/-/g, '');
                
                let shouldCheck = listToMatch.some(item => {
                    let normalizedItem = item.replace(/\s+/g, '').replace(/-/g, '');
                    return val === normalizedItem || val.includes(normalizedItem);
                });
                if (shouldCheck) cb.checked = true;
            });
        }

        // ==========================================
        // ★ 補救機制：從 Google 試算表強制把舊的物流簽名吸進 Firebase
        // ==========================================
        async function syncLogisticsFromGoogleSheet() {
            const startDate = document.getElementById('startDatePicker').value;
            const endDate = document.getElementById('endDatePicker').value;
            const selectedHotelsArray = Array.from(document.querySelectorAll('.hotel-cb:checked')).map(cb => cb.value);

            if (selectedHotelsArray.length === 0) {
                alert("⚠️ 錯誤：請先勾選您想吸取舊資料的飯店！\n（💡 建議：一次勾選少數幾間就好，或者系統會自動分批幫您抓！）");
                return;
            }

            const btn = document.getElementById('syncLogisticsBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ 正在跨海吸取中... (資料龐大請稍候)";
            btn.disabled = true;

            try {
                let allRecords = [];
                const chunkSize = 5; // ★ 防當機機制：每次只向 Google 要 5 間飯店的資料

                // 分批去 Google 試算表抓舊的結帳資料
                for (let i = 0; i < selectedHotelsArray.length; i += chunkSize) {
                    const batchHotels = selectedHotelsArray.slice(i, i + chunkSize).join(',');
                    btn.innerHTML = `⏳ 正在吸取第 ${Math.floor(i/chunkSize)+1} 批資料...`;
                    
                    const res = await fetch(`${API_URL}?action=getFinanceData&startDate=${startDate}&endDate=${endDate}&hotel=${encodeURIComponent(batchHotels)}&t=${new Date().getTime()}`);
                    const data = await res.json();

                    if (data.status === "error" || data.error) {
                        throw new Error(data.message || data.error || "Google 試算表端發生未知錯誤");
                    }
                    if (data.records) {
                        allRecords = allRecords.concat(data.records);
                    }
                }

                if (allRecords.length > 0) {
                    const chunkArray = (arr, size) => arr.length ? [arr.slice(0, size), ...chunkArray(arr.slice(size), size)] : [];
                    const recordChunks = chunkArray(allRecords, 450);

                    let totalImported = 0;

                    // 一批一批寫入 Firebase 的 logistics_records
                    for (let i = 0; i < recordChunks.length; i++) {
                        const batch = writeBatch(db);
                        recordChunks[i].forEach(r => {
                            if (!r.clientSig && !r.driverSig) return; 

                            let dateStr = r.date || "";
                            let deptStr = r.dept || r.deptName || "";
                            let hotelKw = r.hotelKeyword || deptStr.split(/[ -]/)[0] || deptStr;
                            let items = [];
                            try { items = JSON.parse(r.verifyJson); } catch(e) { }

                            // 清除斜線等非法字元防當機
                            const docId = `${dateStr}_${hotelKw}_${deptStr}`.replace(/[\/\\?%*:|"<>]/g, '-');
                            const docRef = doc(db, 'logistics_records', docId);

                            batch.set(docRef, {
                                date: dateStr,
                                hotelKeyword: hotelKw,
                                deptName: deptStr,
                                items: items,
                                clientSig: r.clientSig || "",
                                driverSig: r.driverSig || "",
                                timestamp: new Date().toLocaleString()
                            }, { merge: true });
                            
                            totalImported++;
                        });
                        await batch.commit();
                    }
                    
                    alert(`✅ 搬家大成功！\n成功將 ${totalImported} 筆「舊物流簽名與點收紀錄」吸入 Firebase 極速資料庫！\n\n現在請點擊藍色的「載入報表」，您就會看到以前的單據通通回來了！`);
                } else {
                    alert("⚠️ 試算表中沒有符合此區間與飯店的舊物流簽名資料喔！");
                }
            } catch (error) {
                console.error(error);
                alert("❌ 吸取失敗，原因：\n" + error.message + "\n\n💡 建議測試：請重新整理網頁，先試著『只勾選 1 間飯店』按吸取看看！");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // ★ 極速版：從 Firebase 抓物流結帳紀錄，單價依然從 Google 試算表抓
        async function fetchData() {
            const startDate = document.getElementById('startDatePicker').value;
            const endDate = document.getElementById('endDatePicker').value;
            const selectedHotels = Array.from(document.querySelectorAll('.hotel-cb:checked')).map(cb => cb.value);
            
            if (selectedHotels.length === 0) {
                if(!confirm("⚠️ 您尚未勾選任何飯店！\n\n按下「確定」將載入【全部】飯店資料（如果單量很多，這可能需要一點時間）。\n按下「取消」返回先勾選飯店。")) return;
            }

            const container = document.getElementById('resultsContainer');
            document.getElementById('printHeader').style.display = 'block';
            document.getElementById('printInfo').innerText = `結算區間：${startDate} 至 ${endDate}`;
            container.innerHTML = `<div class="msg-box no-print" style="color: #2563eb;">⚙️ 正在跨部門極速抓取資料與計算中... 請稍候</div>`;
            
            try {
                // 1. 從 Firebase 抓取當月單據
                const logQ = query(collection(db, "logistics_records"), 
                                   where("date", ">=", startDate), 
                                   where("date", "<=", endDate));
                const logSnap = await getDocs(logQ);

                let fbRecords = [];
                logSnap.forEach(docSnap => {
                    let d = docSnap.data();
                    
                    // 必須雙方簽章才算結帳單
                    if (!d.clientSig || !d.driverSig) return;
                    
                    // 重組名稱使其與「價格總表」一致
                    let deptStr = d.hotelKeyword === d.deptName ? d.hotelKeyword : `${d.hotelKeyword} ${d.deptName}`;
                    if(d.deptName && d.deptName.includes(d.hotelKeyword)) deptStr = d.deptName;

                    // 過濾所選飯店
                    if (selectedHotels.length > 0) {
                        let match = selectedHotels.some(h => deptStr.includes(h) || h.includes(deptStr) || d.hotelKeyword.includes(h));
                        if (!match) return;
                    }

                    fbRecords.push({
                        verifyJson: JSON.stringify(d.items || []),
                        clientSig: d.clientSig,
                        driverSig: d.driverSig,
                        date: d.date,
                        dept: deptStr
                    });
                });

                if(fbRecords.length === 0) {
                    container.innerHTML = `<div class="msg-box no-print" style="color: red;">此條件下找不到任何已雙方簽收的點交紀錄。<br>如果您確定之前有點交過，請點擊上方的「📥 吸取舊版物流與簽名」按鈕來補救舊資料！</div>`;
                    return;
                }

                // 2. 向 Google Apps Script 抓取「價格總表」 (確保單價隨時是最新)
                let combinedPrices = {};
                let targetHotels = selectedHotels.length > 0 ? selectedHotels : ["全部"];
                const chunkSize = 5; // ★ 防當機機制：分批向 Google 抓取價格表

                for (let i = 0; i < targetHotels.length; i += chunkSize) {
                    const batchHotels = targetHotels.slice(i, i + chunkSize).join(',');
                    const res = await fetch(`${API_URL}?action=getFinanceData&startDate=${startDate}&endDate=${endDate}&hotel=${encodeURIComponent(batchHotels)}&t=${new Date().getTime()}`);
                    const data = await res.json();
                    if (data.prices) {
                        Object.assign(combinedPrices, data.prices);
                    }
                }
                
                processData(fbRecords, combinedPrices);

            } catch(err) {
                console.error(err);
                container.innerHTML = `<div class="msg-box no-print" style="color: red;">讀取失敗：請檢查網路連線或減少勾選的飯店數量再試一次。</div>`;
            }
        }

        function processData(records, priceMap) {
            currentReportData = [];
            
            records.forEach((record) => {
                let items = [];
                try { items = JSON.parse(record.verifyJson); } catch(e) { return; }
                
                let dateStr = record.date || "";
                let deptStr = record.dept || record.deptName || "";

                items.forEach((item) => {
                    // Firebase 存進來的 actualQty 即為物流結帳數量
                    let actualQty = parseInt(item.actualQty) || 0;
                    if (actualQty === 0) return; 

                    let itemName = item.itemName || "";
                    let unitPrice = priceMap[deptStr + "_" + itemName] !== undefined ? priceMap[deptStr + "_" + itemName] : (priceMap[itemName] || 0);

                    currentReportData.push({
                        date: dateStr,
                        dept: deptStr,
                        item: itemName,
                        originalQty: actualQty,
                        qty: actualQty,         
                        price: Number(unitPrice) || 0,
                        note: item.auntNote || item.driverNote || ""
                    });
                });
            });

            if (currentReportData.length === 0) {
                document.getElementById('resultsContainer').innerHTML = `<div class="msg-box no-print">該區間內尚無有效且已簽章的請款項目。</div>`;
                return;
            }

            currentReportData.sort((a, b) => {
                let deptCmp = a.dept.localeCompare(b.dept);
                if (deptCmp !== 0) return deptCmp;

                let dateCmp = a.date.localeCompare(b.date);
                if (dateCmp !== 0) return dateCmp;

                let idxA = globalItemOrder[a.item] !== undefined ? globalItemOrder[a.item] : 9999;
                let idxB = globalItemOrder[b.item] !== undefined ? globalItemOrder[b.item] : 9999;
                return idxA - idxB;
            });
            
            currentReportData.forEach((row, idx) => { row.globalIndex = idx; });

            renderReport();
        }

        function updateQty(globalIndex, val) {
            currentReportData[globalIndex].qty = parseInt(val) || 0;
            renderReport(); 
        }

        function updateNote(globalIndex, val) {
            currentReportData[globalIndex].note = val;
        }

        function renderReport() {
            let html = "";
            let grandTotalAmount = 0;

            let depts = [...new Set(currentReportData.map(r => r.dept))];

            depts.forEach(dept => {
                let deptData = currentReportData.filter(r => r.dept === dept);

                html += `<div class="dept-title">🏨 【${dept}】每日明細</div>`;
                html += `
                    <table class="excel-table">
                        <thead>
                            <tr>
                                <th class="col-date">點交日期</th>
                                <th class="col-item">品項名稱</th>
                                <th class="col-qty-readonly" title="司機當初點交確認的數量">物流點交量</th>
                                <th class="col-qty-edit" title="財務可修改此數量來調整請款">請款數量📝</th>
                                <th class="col-price">單價</th>
                                <th class="col-amount">金額</th>
                                <th class="col-note">財務備註📝</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                deptData.forEach((row) => {
                    let subtotal = row.qty * row.price;
                    html += `
                    <tr>
                        <td class="col-date">${row.date}</td>
                        <td class="col-item text-bold">${row.item}</td>
                        <td class="col-qty-readonly">${row.originalQty}</td>
                        <td class="col-qty-edit">
                            <input type="number" class="edit-input qty-input" value="${row.qty}" onchange="updateQty(${row.globalIndex}, this.value)">
                        </td>
                        <td class="col-price">${formatMoney(row.price)}</td>
                        <td class="col-amount">${formatMoney(subtotal)}</td>
                        <td class="col-note">
                            <input type="text" class="edit-input" value="${row.note}" onchange="updateNote(${row.globalIndex}, this.value)" placeholder="可備註扣款原因">
                        </td>
                    </tr>
                    `;
                });
                html += `</tbody></table>`;

                html += `<div class="summary-title">【${dept}】布品彙整</div>`;
                html += `
                    <table class="excel-table summary-table" style="width: 70%; margin-left: 0;">
                        <thead>
                            <tr>
                                <th class="col-item">品項名稱</th>
                                <th class="col-qty-edit">請款總數量</th>
                                <th class="col-price">單價</th>
                                <th class="col-amount">總金額 (未稅)</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                let summaryMap = {};
                deptData.forEach(row => {
                    if (!summaryMap[row.item]) {
                        summaryMap[row.item] = { item: row.item, qty: 0, price: row.price, amount: 0 };
                    }
                    summaryMap[row.item].qty += row.qty;
                    summaryMap[row.item].amount += (row.qty * row.price);
                });

                let deptSubtotalAmount = 0;
                
                Object.values(summaryMap).sort((a, b) => {
                    let idxA = globalItemOrder[a.item] !== undefined ? globalItemOrder[a.item] : 9999;
                    let idxB = globalItemOrder[b.item] !== undefined ? globalItemOrder[b.item] : 9999;
                    return idxA - idxB;
                }).forEach(row => {
                    html += `
                    <tr>
                        <td class="col-item text-bold">${row.item}</td>
                        <td class="text-right">${row.qty}</td>
                        <td class="col-price">${formatMoney(row.price)}</td>
                        <td class="col-amount">${formatMoney(row.amount)}</td>
                    </tr>
                    `;
                    deptSubtotalAmount += row.amount;
                });

                grandTotalAmount += deptSubtotalAmount;

                html += `
                        <tr class="subtotal-row">
                            <td colspan="2" class="text-right">【${dept}】 彙整小計：</td>
                            <td></td>
                            <td class="text-right col-amount">${formatMoney(deptSubtotalAmount)}</td>
                        </tr>
                        </tbody>
                    </table>
                `;
            });

            let taxAmount = grandTotalAmount * 0.05;
            let totalWithTax = grandTotalAmount + taxAmount;

            html += `
                <div class="grand-total-section">
                    <h2 style="margin-top: 0; color: #b91c1c; text-align: center;">💰 結算大彙整</h2>
                    <table class="excel-table" style="width: 60%; margin: 0 auto;">
                        <tr class="grand-total-row">
                            <td class="text-right">各部門總計金額 (未稅)：</td>
                            <td class="text-right col-amount">NT$ ${formatMoney(grandTotalAmount)}</td>
                        </tr>
                        <tr class="tax-row">
                            <td class="text-right">各部門總計金額 (含稅 5%)：</td>
                            <td class="text-right col-amount">NT$ ${formatMoney(totalWithTax)}</td>
                        </tr>
                    </table>
                </div>
            `;

            document.getElementById('resultsContainer').innerHTML = html;
        }

        function exportToExcel() {
            if (currentReportData.length === 0) {
                alert("請先載入報表再匯出！");
                return;
            }

            const startDate = document.getElementById('startDatePicker').value;
            const endDate = document.getElementById('endDatePicker').value;

            let wb = XLSX.utils.book_new();
            let exportData = [];

            exportData.push(["百麒物流 - 飯店點交請款明細與彙整表"]);
            exportData.push(["結算區間:", `${startDate} ~ ${endDate}`]);
            exportData.push([]); 

            let depts = [...new Set(currentReportData.map(r => r.dept))];
            let grandTotalAmount = 0;

            depts.forEach(dept => {
                let deptData = currentReportData.filter(r => r.dept === dept);

                exportData.push([`🏨 【${dept}】每日明細`]);
                exportData.push(["點交日期", "品項名稱", "物流點交量", "請款數量", "單價", "金額", "財務備註"]);
                
                deptData.forEach(row => {
                    let rawAmount = row.qty * row.price; 
                    exportData.push([row.date, row.item, row.originalQty, row.qty, row.price, rawAmount, row.note]);
                });

                exportData.push([]); 

                exportData.push([`📊 【${dept}】布品彙整`]);
                exportData.push(["品項名稱", "請款總數量", "單價", "總金額 (未稅)"]);

                let summaryMap = {};
                deptData.forEach(row => {
                    if (!summaryMap[row.item]) {
                        summaryMap[row.item] = { item: row.item, qty: 0, price: row.price, amount: 0 };
                    }
                    summaryMap[row.item].qty += row.qty;
                    summaryMap[row.item].amount += (row.qty * row.price);
                });

                let deptSubtotalAmount = 0;
                
                Object.values(summaryMap).sort((a, b) => {
                    let idxA = globalItemOrder[a.item] !== undefined ? globalItemOrder[a.item] : 9999;
                    let idxB = globalItemOrder[b.item] !== undefined ? globalItemOrder[b.item] : 9999;
                    return idxA - idxB;
                }).forEach(row => {
                    exportData.push([row.item, row.qty, row.price, row.amount]);
                    deptSubtotalAmount += row.amount;
                });

                exportData.push(["", `【${dept}】 彙整小計：`, "", deptSubtotalAmount]);
                exportData.push([]); 
                exportData.push([]); 

                grandTotalAmount += deptSubtotalAmount;
            });

            let taxAmount = Math.round(grandTotalAmount * 0.05 * 100) / 100;
            let totalWithTax = grandTotalAmount + taxAmount;

            exportData.push(["💰 結算大彙整"]);
            exportData.push(["", "", "各部門總計金額 (未稅)：", grandTotalAmount]);
            exportData.push(["", "", "各部門總計金額 (含稅 5%)：", totalWithTax]);

            let ws = XLSX.utils.aoa_to_sheet(exportData);
            XLSX.utils.book_append_sheet(wb, ws, "財務報表");
            XLSX.writeFile(wb, `百麒財務報表_${startDate}_至_${endDate}.xlsx`);
        }
    </script>
</body>
</html>
