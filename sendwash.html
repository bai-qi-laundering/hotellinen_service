<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>飯店送洗對點單</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;background:#f3f4f6;color:#1f2937;margin:0;padding:20px;font-size:20px;line-height:1.6}

section{background:white;border-radius:16px;padding:20px;margin:20px 0}

#items input{font-size:30px;font-weight:700;min-height:68px}
#items input::placeholder{font-size:18px;font-weight:400;color:#64748b;opacity:1}

.muted{color:#475569;font-size:18px;line-height:1.6}
#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#92400e;font-size:20px;font-weight:600}
#target{font-size:22px;font-weight:700;color:#1d4ed8;overflow-wrap:anywhere}
#outletTabs{display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding:4px 0 10px;scrollbar-width:thin}
#outletTabs[hidden],[hidden]{display:none !important}
.extra-items{border:2px dashed #a5b4fc;background:#eef2ff}
.extra-items h2{font-size:22px;color:#3730a3;margin:0 0 12px}
.extra-controls{display:flex;gap:10px;align-items:center}
.extra-controls input{flex:1;margin:0}
.extra-controls button{width:auto;flex:none;margin:0;background:#16a34a;padding:14px 20px;min-height:60px}
.extra-items .muted{margin-bottom:0}
#outletTabs button{flex:0 0 auto;width:auto;min-height:56px;white-space:nowrap;scroll-snap-align:start;background:#e8eef7;color:#244068;margin:0;padding:12px 18px}
#outletTabs button[aria-selected="true"]{background:#2563eb;color:white}
input:focus-visible,select:focus-visible,button:focus-visible,a.button:focus-visible{outline:3px solid #1d4ed8;outline-offset:3px}

.mode-switch{display:flex;gap:10px;margin:16px 0}
.mode-switch button{flex:1;margin:0;min-height:58px;font-size:20px;padding:12px 10px;background:#e2e8f0;color:#334155;border-radius:12px}
.mode-switch button[aria-selected="true"]{background:#1d4ed8;color:white;box-shadow:0 4px 10px rgba(29,78,216,.25)}
.mode-switch button.highlight-dingwang:not([aria-selected="true"]){background:#fef3c7;color:#92400e;border:2px solid #f59e0b}
.date-range-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.date-range-grid label{margin:8px 0;font-size:20px}
.quick-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.quick-btns button{width:auto;flex:1;min-height:48px;font-size:18px;padding:8px 12px;margin:0;background:#f1f5f9;color:#1e293b;border:1px solid #cbd5e1}
.quick-btns button:hover{background:#e2e8f0}
.recon-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.recon-actions button{flex:1;margin:0;min-height:56px;font-size:19px;padding:12px 14px}
.btn-export{background:#059669}
.btn-print{background:#475569}
.recon-summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.recon-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px;text-align:center}
.recon-card .num{font-size:28px;font-weight:800;color:#1d4ed8;line-height:1.2;margin-top:4px}
.recon-card .lbl{font-size:16px;color:#475569;font-weight:600}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #cbd5e1;border-radius:12px;margin-top:14px;background:white}
table.recon-table{width:100%;border-collapse:collapse;font-size:18px;min-width:480px}
table.recon-table th,table.recon-table td{padding:12px 10px;border-bottom:1px solid #e2e8f0;border-right:1px solid #e2e8f0;text-align:right;white-space:nowrap}
table.recon-table th:first-child,table.recon-table td:first-child{text-align:left;position:sticky;left:0;background:white;z-index:1;font-weight:700;border-right:2px solid #cbd5e1}
table.recon-table thead th{background:#f1f5f9;color:#1e293b;font-weight:800;text-align:center}
table.recon-table thead th:first-child{text-align:left;background:#f1f5f9;z-index:2}
table.recon-table tbody tr:nth-child(even) td{background:#f8fafc}
table.recon-table tbody tr:nth-child(even) td:first-child{background:#f8fafc}
table.recon-table tfoot th,table.recon-table tfoot td{background:#eff6ff;font-weight:800;color:#1e3a8a;border-top:2px solid #93c5fd}
table.recon-table tfoot th:first-child{background:#eff6ff}
.col-total{background:#fef9c3 !important;font-weight:800;color:#854d0e}
.zero-cell{color:#cbd5e1;font-weight:400}
.badge-nosend{display:inline-block;font-size:13px;padding:2px 6px;border-radius:6px;background:#f1f5f9;color:#64748b;font-weight:600}
.daily-list{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.daily-item{border:1px solid #cbd5e1;border-radius:12px;padding:14px 16px;background:#f8fafc}
.daily-item-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:1px solid #e2e8f0;padding-bottom:8px;margin-bottom:10px}
.daily-item-date{font-size:21px;font-weight:800;color:#1e3a8a}
.daily-item-meta{font-size:15px;color:#475569}
.daily-chips{display:flex;flex-wrap:wrap;gap:8px}
.daily-chip{background:white;border:1px solid #cbd5e1;border-radius:8px;padding:6px 12px;font-size:18px;font-weight:700;color:#1f2937}
.daily-chip span{color:#2563eb;margin-left:4px;font-size:20px}

@media(max-width:480px){
 body{padding:16px}section{padding:16px}h1{font-size:28px}
 .date-range-grid{grid-template-columns:1fr}
}
@media print{
 body{background:white;padding:0;font-size:14px}
 main,main.wide-mode{max-width:100%}
 #back,.mode-switch,#reconcileControls,.recon-actions{display:none !important}
 section{box-shadow:none;border:1px solid #cbd5e1;padding:12px;margin:10px 0}
 .table-wrap{overflow:visible;border:none}
 table.recon-table{font-size:13px;min-width:0}
 table.recon-table th,table.recon-table td{padding:6px 8px}
}
</style></head>
<body><main id="mainContainer"><h1 id="title">送洗對點單</h1><p id="subtitle" class="muted">只填本次有送洗的品項，其他可留白；整張空白也能送出。</p><a id="back" class="button" style="background:#475569">返回簽收單</a>

<div class="mode-switch" role="tablist" aria-label="功能模式切換">
 <button id="tabEntry" type="button" role="tab" aria-selected="true">📝 填寫送洗對點單</button>
 <button id="tabReconcile" type="button" role="tab" aria-selected="false">📊 結帳對帳查詢</button>
</div>

<!-- 填單與對帳共用的部門與基礎設定區 -->
<section id="topConfigSection">
 <label>部門<select id="department" disabled></select></label>
 <div id="entryDateBox">
  <label>飯店送洗日期<input id="sourceDate" type="date" disabled></label>
  <p id="target"></p>
 </div>
 <div id="reconcileControls" hidden>
  <div class="date-range-grid">
   <label>開始送洗日期<input id="reconStartDate" type="date"></label>
   <label>結束送洗日期<input id="reconEndDate" type="date"></label>
  </div>
  <div class="quick-btns">
   <button type="button" id="btnThisMonth">本月迄今</button>
   <button type="button" id="btnLastMonth">上個月份</button>
   <button type="button" id="btnLast7Days">最近 7 天</button>
  </div>
  <button type="button" id="btnRunReconcile" style="margin-top:16px;background:#1d4ed8">🔍 拉出填寫紀錄對帳</button>
 </div>
</section>

<nav id="outletTabs" aria-label="選擇餐廳" hidden></nav>

<!-- 原本的填單區塊 -->
<form id="form">
 <section id="items">正在讀取對點設定…</section>
 <section id="extraItemPanel" class="extra-items" hidden>
  <h2>＋ 臨時新增送洗品項</h2>
  <div class="extra-controls">
   <input id="extraItemName" list="extraItemOptions" aria-label="臨時新增品項名稱" placeholder="手打或選單 👉" maxlength="80" autocomplete="off">
   <datalist id="extraItemOptions"></datalist>
   <button id="addExtraItem" type="button" disabled>新增</button>
  </div>
  <p class="muted">新增後請填數量，會隨本張對點單一起送出。</p>
 </section>
 <p id="message" role="status"></p>
 <button id="submit" disabled>送出送洗對點單</button>
</form>

<!-- 新增：結帳對帳結果區塊 -->
<section id="reconcileSection" hidden>
 <h2 id="reconTitle" style="margin:0 0 8px;font-size:24px;color:#1e3a8a">結帳對帳明細</h2>
 <p id="reconStatus" class="muted" style="margin-top:0">請選擇飯店送洗日期區間後點選「拉出填寫紀錄對帳」。</p>
 <div id="reconActions" class="recon-actions" hidden>
  <button type="button" id="btnExportCsv" class="btn-export">📥 匯出對帳單 (Excel CSV)</button>
  <button type="button" id="btnPrint" class="btn-print">🖨️ 列印 / 存成 PDF</button>
 </div>
 <div id="reconResult"></div>
</section>
</main>

<script src="sendwash-core.js?v=20261020-cheng-recheck"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import {getFirestore,doc,getDoc as getDocFromServer,runTransaction} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-lite.js';
const db=getFirestore(initializeApp({apiKey:'AIzaSyBEXcnXOKRags29CvhM6TKe3N-zty-ela4',authDomain:'hotel-inventory-3a1ad.firebaseapp.com',projectId:'hotel-inventory-3a1ad',storageBucket:'hotel-inventory-3a1ad.firebasestorage.app',messagingSenderId:'363844184412',appId:'1:363844184412:web:66cdd6425d53bde75f3999'}));
const core=window.SendwashCore,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),hotel=params.get('hotel');
let config,settings,rows=[],current=null,busy=false,sequence=0,activeOutlet='',currentMode='entry',lastReconData=null;
const batchDrafts=new Map();let shownBatchId=null,activeBatchId='';
const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(new Date());
$('sourceDate').value=today; // The receipt date is an outbound date, never an inbound default.

// 預設對帳區間：本月 1 號 ～ 今天
const [tYear,tMonth]=today.split('-');
$('reconStartDate').value=`${tYear}-${tMonth}-01`;
$('reconEndDate').value=today;

const back=new URL('logistics.html',location.href); if(hotel) back.searchParams.set('hotel',hotel); if(params.get('date')) back.searchParams.set('date',params.get('date')); $('back').href=back;
function disable(value){$('department').disabled=value;$('sourceDate').disabled=value;$('submit').disabled=value;for(const id of ['extraItemName','addExtraItem'])$(id).disabled=value||locked(current)||!rows.length;}
function showError(error){$('message').textContent=error.message || String(error);}
function outletsFor(dept){return [...new Set(settings.filter(r=>r.department===dept).map(r=>r.outlet || ''))];}
const locked=record=>Boolean(record?.acceptedAt || Object.keys(record?.receivedItems || {}).length);
const batchRows=list=>list.filter(r=>core.normalize(r.hotel)==='洲際'&&r.outlet&&core.department(r.department)!=='制服');
const batchEnabled=dept=>batchRows(settings).some(r=>r.department===dept);
function batchGroups(list,sourceDate){
 const groups=new Map();
 batchRows(list).forEach(row=>{const id=core.submissionId(hotel,row.department,sourceDate,row.outlet);if(!groups.has(id))groups.set(id,{id,department:row.department,outlet:row.outlet,sourceDate,rows:[]});groups.get(id).rows.push(row);});
 return [...groups.values()].map(group=>({...group,rows:core.displayRows(group.rows)}));
}
function rememberBatch(){
 const draft=batchDrafts.get(shownBatchId);if(!draft||locked(draft.current))return;
 draft.values=draft.rows.map((_,i)=>$(`qty${i}`)?.value ?? draft.values[i]);
}
// Temporary rows live on this source document, never in the spreadsheet template.
function supplementalRows(base,record){
 const result=[...base];
 for(const item of record?.items || []){
  if(result.some(row=>core.normalize(row.item)===core.normalize(item.item))||core.retiredOutletItem({...base[0],item:item.item}))continue;
  result.push({...base[0],item:item.item,unit:item.unit || '件',defaultQuantity:''});
 }
 return result;
}
function renderInputs(draft){
 $('items').replaceChildren();
 draft.rows.forEach((row,i)=>{const label=document.createElement('label');label.textContent=`${row.item}（${row.unit}）`;const input=document.createElement('input');input.id=`qty${i}`;input.type='number';input.min='0';input.step='1';input.inputMode='numeric';input.required=false;input.placeholder='本次未送洗，可留白';input.value=draft.values[i] ?? '';input.disabled=locked(draft.current);input.oninput=()=>{draft.values[i]=input.value;};label.append(input);$('items').append(label);});
 $('extraItemPanel').hidden=false;$('extraItemName').value='';
 const options=$('extraItemOptions');options.replaceChildren();
 const source=draft.rows[0];
 const choices=core.displayRows(config.items.filter(item=>item.baseName===hotel&&core.department(item.deptName || '房務')===core.department(source.department)).map(item=>({...source,item:item.item,unit:'件',defaultQuantity:''})));
 const seen=new Set(draft.rows.map(row=>core.normalize(row.item)));
 for(const row of choices){const key=core.normalize(row.item);if(seen.has(key)||core.retiredOutletItem(row))continue;seen.add(key);const opt=document.createElement('option');opt.value=row.item;options.append(opt);}
}
function addExtraItem(){
 if(busy||$('addExtraItem').disabled||locked(current))return;
 try{
  const item=String($('extraItemName').value || '').normalize('NFKC').trim();
  if(!item)throw new Error('請輸入或選擇品項名稱');
  if(item.length>80||/["'<>&\\/\u2028\u2029\x00-\x1f\x7f【】]/.test(item)||item==='_MANUAL_BORDER_')throw new Error('品項名稱不可包含引號、斜線、括號標記或換行');
  if(rows.some(row=>core.normalize(row.item)===core.normalize(item)))throw new Error('這個品項已在列表裡，請直接填寫數量');
  const first=rows[0];if(core.retiredOutletItem({...first,item}))throw new Error('湛露口布請分別填寫「黃口布」及「白口布」');
  rememberBatch();const draft=batchDrafts.get(shownBatchId);if(!draft)throw new Error('單據尚未讀取完成，請稍後再試');
  const configured=config.items.find(row=>row.baseName===hotel&&core.department(row.deptName || '房務')===core.department(first.department)&&core.normalize(row.item)===core.normalize(item));
  const setting=settings.find(row=>row.department===first.department&&core.normalize(row.item)===core.normalize(item));
  draft.rows.push({...first,item:configured?.item || item,unit:setting?.unit || '件',defaultQuantity:''});draft.values.push('');rows=draft.rows;
  renderInputs(draft);disable(false);$('message').textContent=`已新增「${item}」，請填寫數量後隨整張單送出。`;
 }catch(error){showError(error);}
}
$('addExtraItem').onclick=addExtraItem;
$('extraItemName').onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();addExtraItem();}};
async function loadBatch(request,dept,sourceDate){
 const groups=batchGroups(settings,sourceDate);
 const missing=groups.filter(group=>!batchDrafts.has(group.id));
 const loaded=await Promise.all(missing.map(async group=>{const snap=await getDocFromServer(doc(db,'sendwash_records',group.id)),record=snap.exists()?snap.data():null;const original=settings.filter(row=>row.department===group.department&&row.outlet===group.outlet),display=core.displayRows(original);const complete=supplementalRows(display,record);return {...group,rows:complete,current:record,values:complete.map(row=>record?(record.items.find(item=>item.item===row.item)?.quantity ?? ''):row.defaultQuantity)};}));
 if(request!==sequence)return;
 loaded.forEach(group=>batchDrafts.set(group.id,group));
 if(!groups.some(group=>group.id===activeBatchId))activeBatchId=(groups.find(group=>group.department===dept)||groups[0]).id;
 const selected=batchDrafts.get(activeBatchId),nav=$('outletTabs'),scroll=nav.scrollLeft;nav.replaceChildren();nav.hidden=false;
 groups.forEach(group=>{const button=document.createElement('button'),entry=batchDrafts.get(group.id),duplicate=groups.some(other=>other.department!==group.department&&other.outlet===group.outlet);button.type='button';button.textContent=(duplicate?`${group.department}／`:'')+group.outlet+(locked(entry.current)?' ✓ 已點收':'');button.setAttribute('aria-selected',String(group.id===activeBatchId));button.onclick=()=>{if(busy)return;activeBatchId=group.id;if(currentMode==='reconcile'){activeOutlet=group.outlet;loadReconcile();}else{load();}};nav.append(button);});nav.scrollLeft=scroll;
 rows=selected.rows;current=selected.current;shownBatchId=selected.id;
 const target=core.targetDate(hotel,selected.department,sourceDate,config.deliverySchedules);
 $('target').textContent=`共 ${groups.length} 個餐廳，切換填寫後一次送出。\n${selected.outlet} 預計送回：${target}`;
 renderInputs(selected);
 disable(false);$('submit').textContent='一次送出全部餐廳';$('submit').disabled=groups.every(group=>locked(batchDrafts.get(group.id).current));
 $('message').textContent=locked(current)?'這個餐廳已開始點收，原單保留；其他尚未點收的餐廳仍可填寫後一起送出。':'左右切換餐廳會保留已填數量，全部填完後按一次送出即可。';
}
async function submitBatch(){
 rememberBatch();rows.forEach((_,i)=>{if($(`qty${i}`))$(`qty${i}`).disabled=true;});const sourceDate=$('sourceDate').value,groups=batchGroups(settings,sourceDate);
 if(!groups.length||groups.some(group=>!batchDrafts.has(group.id)))throw new Error('餐廳單據尚未讀取完成，請重新載入');
 const template=await getDocFromServer(doc(db,'inventory_config','master_template'));if(!template.exists())throw new Error('找不到設定');
 const latest=template.data(),latestSettings=core.settings(latest.sendwashSettings || [],latest.items).filter(r=>r.hotel===hotel);
 if(JSON.stringify(batchRows(settings))!==JSON.stringify(batchRows(latestSettings)))throw new Error('餐廳對點設定已更新，請重新整理後填寫');
 const plans=groups.filter(group=>!locked(batchDrafts.get(group.id).current)).map(group=>{
  const draft=batchDrafts.get(group.id),targetDate=core.targetDate(hotel,group.department,sourceDate,latest.deliverySchedules);
  if(targetDate!==core.targetDate(hotel,group.department,sourceDate,config.deliverySchedules))throw new Error('收送日設定已更新，請重新整理後確認日期');
  // Preserve historical unsplit quantities without offering the retired input.
  const retained=(draft.current?.items || []).filter(item=>core.retiredOutletItem({hotel,department:group.department,outlet:group.outlet,item:item.item}));

 if(!plans.length)throw new Error('全部餐廳已開始點收，原單已鎖定');

  const snapshots=[];for(const plan of plans)snapshots.push(await tx.get(doc(db,'sendwash_records',plan.id)));
  const receiptIds=[...new Set(plans.map(plan=>`${plan.targetDate}_${hotel}_${plan.department}`))],receipts=[];for(const id of receiptIds)receipts.push(await tx.get(doc(db,'logistics_records',id)));
  if(receipts.some(snap=>snap.exists()&&(snap.data().driverSig||snap.data().clientSig)))throw new Error('餐廳總單已簽收，本次全部尚未送出');
  const updates=plans.map((plan,i)=>{const old=snapshots[i].exists()?snapshots[i].data():{};if(locked(old))throw new Error(`${plan.outlet} 已開始點收，本次全部尚未送出，請重新載入確認`);if((old.revision || 0)!==plan.expected)throw new Error(`${plan.outlet} 已由其他人更新，本次全部尚未送出，請重新載入確認`);return {hotel,department:plan.department,inventoryHotel:plan.rows[0].inventoryHotel,outlet:plan.outlet,sourceDate,targetDate:plan.targetDate,items:plan.items,notes:old.notes || {},noSendwash:plan.items.length===0,revision:plan.expected+1,submittedAt:new Date().toISOString()};});
  plans.forEach((plan,i)=>tx.set(doc(db,'sendwash_records',plan.id),updates[i]));
 });

function renderOutlets(dept){
 const outlets=outletsFor(dept),nav=$('outletTabs'),scroll=nav.scrollLeft;nav.replaceChildren();nav.hidden=outlets.length<=1&&outlets[0]==='';
 if(!outlets.includes(activeOutlet))activeOutlet=outlets[0] || '';
 outlets.forEach(outlet=>{const button=document.createElement('button');button.type='button';button.textContent=outlet || '原本品項';button.setAttribute('aria-selected',String(outlet===activeOutlet));button.onclick=()=>{if(busy)return;activeOutlet=outlet;if(currentMode==='reconcile')loadReconcile();else load();};nav.append(button);});nav.scrollLeft=scroll;
}
async function load(){
 rememberBatch();shownBatchId=null;
 const request=++sequence; disable(true); $('items').textContent='正在確認雲端單據…'; $('message').textContent='';
 try{
  const dept=$('department').value,sourceDate=$('sourceDate').value;
  if(batchEnabled(dept)){await loadBatch(request,dept,sourceDate);return;}
  $('submit').textContent='送出送洗對點單';
  renderOutlets(dept);rows=settings.filter(r=>r.hotel===hotel&&r.department===dept&&(r.outlet || '')===activeOutlet);
  const target=core.targetDate(hotel,dept,sourceDate,config.deliverySchedules);
  const id=core.submissionId(hotel,dept,sourceDate,activeOutlet),snap=await getDocFromServer(doc(db,'sendwash_records',id));
  if(request!==sequence)return;
  current=snap.exists()?snap.data():null;
  $('target').textContent=`預計送回／寫入登記單：${target}`;
  let draft=batchDrafts.get(id);
  if(!draft||locked(current)||(draft.current?.revision || 0)!==(current?.revision || 0)){
   const complete=supplementalRows(rows,current);draft={id,rows:complete,current,values:complete.map(row=>current?(current.items.find(item=>item.item===row.item)?.quantity ?? ''):row.defaultQuantity)};batchDrafts.set(id,draft);
  }
  draft.current=current;rows=draft.rows;shownBatchId=id;renderInputs(draft);
  disable(false);
  if(current?.acceptedAt || Object.keys(current?.receivedItems || {}).length){$('submit').disabled=true;$('message').textContent='場內已開始逐項點收並簽名，這張單已鎖定。';}
  else if(current){$('message').textContent=current.noSendwash ? '已登記本次無送洗。如之後有送洗，可填入數量再送出。' : '本次已填寫。再次送出會更新同一張單，不會重複加總。';}
 }catch(e){showError(e);$('items').textContent='無法載入；請確認設定後重試。';$('department').disabled=false;$('sourceDate').disabled=false;}
}

/* =========================================================
   新增：結帳對帳查詢邏輯（依飯店送洗日期 sourceDate 區間）
   ========================================================= */
function buildDateRange(startStr,endStr){
 const start=core.date ? new Date(startStr+'T12:00:00') : new Date(startStr+'T12:00:00');
 const end=new Date(endStr+'T12:00:00');
 if(isNaN(start)||isNaN(end))throw new Error('請選擇完整的開始與結束日期');
 if(start>end)throw new Error('開始日期不能晚於結束日期');
 const days=[];
 const cur=new Date(start);
 while(cur<=end){
  const y=cur.getFullYear(),m=String(cur.getMonth()+1).padStart(2,'0'),d=String(cur.getDate()).padStart(2,'0');
  days.push(`${y}-${m}-${d}`);
  cur.setDate(cur.getDate()+1);
  if(days.length>95)throw new Error('單次查詢區間請勿超過 95 天，以免讀取過久');
 }
 return days;
}

function formatSubmitTime(iso){
 if(!iso)return '';
 try{
  const d=new Date(iso);
  return new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
 }catch{return '';}
}

async function loadReconcile(){
 if(busy)return;
 const dept=$('department').value;
 renderOutlets(dept);
 const outlet=activeOutlet || '';
 const startStr=$('reconStartDate').value,endStr=$('reconEndDate').value;
 $('reconActions').hidden=true;
 $('reconResult').replaceChildren();
 try{
  const dateList=buildDateRange(startStr,endStr);
  busy=true;$('btnRunReconcile').disabled=true;$('department').disabled=true;
  $('reconStatus').textContent=`正在從雲端拉取 ${startStr} ～ ${endStr}（共 ${dateList.length} 天）的填寫紀錄…`;

  // 依據 submissionId 規則平行讀取該區間所有單據（不需複合索引）
  const baseRows=core.displayRows(settings.filter(r=>r.hotel===hotel&&r.department===dept&&(r.outlet || '')===outlet));
  const snaps=await Promise.all(dateList.map(d=>getDocFromServer(doc(db,'sendwash_records',core.submissionId(hotel,dept,d,outlet)))));
  
  const records=[];
  snaps.forEach((snap,idx)=>{
   if(snap.exists()){
    const data=snap.data();
    records.push({...data,sourceDate:data.sourceDate || dateList[idx]});
   }
  });

  // 整理所有出現過的品項（保留原本設定順序 + 期間內臨時新增品項）
  const itemMap=new Map();
  baseRows.forEach(r=>itemMap.set(r.item,{item:r.item,unit:r.unit || '件'}));
  records.forEach(rec=>{
   (rec.items || []).forEach(it=>{
    if(!itemMap.has(it.item))itemMap.set(it.item,{item:it.item,unit:it.unit || '件'});
   });
  });
  const allItems=[...itemMap.values()];

  const outletTitle=outlet ? `（${outlet}）` : '';
  $('reconTitle').textContent=`${hotel}｜${dept}${outletTitle} 結帳對帳單`;

  if(!records.length){
   $('reconStatus').textContent=`${startStr} ～ ${endStr} 期間內尚無任何飯店填寫紀錄。`;
   lastReconData=null;
   return;
  }

  // 計算每個品項在各送洗日的填寫數量與總計
  const filledDates=records.map(r=>r.sourceDate);
  const recordByDate=new Map(records.map(r=>[r.sourceDate,r]));
  let grandTotalQty=0,activeRecordCount=0;
  const itemStats=allItems.map(info=>{
   const byDate={};
   let sum=0;
   filledDates.forEach(d=>{
    const rec=recordByDate.get(d);
    const found=(rec?.items || []).find(x=>x.item===info.item);
    const q=found ? Number(found.quantity || 0) : 0;
    byDate[d]=found ? q : null;
    sum+=q;
   });
   grandTotalQty+=sum;
   return {...info,byDate,total:sum};
  });
  records.forEach(r=>{if(!r.noSendwash && (r.items || []).length>0)activeRecordCount++;});

  lastReconData={hotel,dept,outlet,startStr,endStr,filledDates,recordByDate,itemStats,grandTotalQty};
  $('reconStatus').textContent=`送洗日期區間：${startStr} ～ ${endStr}（共找到 ${records.length} 筆填單紀錄）`;
  $('reconActions').hidden=false;

  const container=$('reconResult');
  container.replaceChildren();

  // 1. 頂部統計摘要小卡
  const cards=document.createElement('div');
  cards.className='recon-summary-cards';
  cards.innerHTML=`
   <div class="recon-card"><div class="lbl">已填單天數</div><div class="num">${records.length} 天</div></div>
   <div class="recon-card"><div class="lbl">有送洗天數</div><div class="num">${activeRecordCount} 天</div></div>
   <div class="recon-card"><div class="lbl">區間總送洗件數</div><div class="num">${grandTotalQty.toLocaleString()}</div></div>
  `;
  container.append(cards);

  // 2. 品項 × 送洗日期 對帳總表
  const wrap=document.createElement('div');
  wrap.className='table-wrap';
  const tbl=document.createElement('table');
  tbl.className='recon-table';

  const thead=document.createElement('thead');
  const hRow=document.createElement('tr');
  const thItem=document.createElement('th');
  thItem.textContent='品項（單位）';
  hRow.append(thItem);
  const thSum=document.createElement('th');
  thSum.textContent='區間總計';
  thSum.className='col-total';
  hRow.append(thSum);
  filledDates.forEach(d=>{
   const th=document.createElement('th');
   th.textContent=d.slice(5).replace('-','/');
   th.title=`飯店送洗日期：${d}`;
   hRow.append(th);
  });
  thead.append(hRow);
  tbl.append(thead);

  const tbody=document.createElement('tbody');
  itemStats.forEach(st=>{
   const tr=document.createElement('tr');
   const tdName=document.createElement('td');
   tdName.textContent=`${st.item}（${st.unit}）`;
   tr.append(tdName);

   const tdTotal=document.createElement('td');
   tdTotal.className='col-total';
   tdTotal.textContent=st.total>0 ? st.total.toLocaleString() : '0';
   tr.append(tdTotal);

   filledDates.forEach(d=>{
    const td=document.createElement('td');
    const val=st.byDate[d];
    if(val===null || val===0){
     td.className='zero-cell';
     td.textContent=val===0 ? '0' : '—';
    }else{
     td.textContent=val.toLocaleString();
     td.style.fontWeight='700';
    }
    tr.append(td);
   });
   tbody.append(tr);
  });
  tbl.append(tbody);

  // 表尾：單日合計與填寫狀態
  const tfoot=document.createElement('tfoot');
  const fRow=document.createElement('tr');
  const tfLabel=document.createElement('th');
  tfLabel.textContent='單日件數小計';
  fRow.append(tfLabel);
  const tfGrand=document.createElement('td');
  tfGrand.className='col-total';
  tfGrand.textContent=grandTotalQty.toLocaleString();
  fRow.append(tfGrand);
  filledDates.forEach(d=>{
   const td=document.createElement('td');
   const rec=recordByDate.get(d);
   const daySum=(rec?.items || []).reduce((acc,x)=>acc+Number(x.quantity || 0),0);
   if(rec?.noSendwash || daySum===0){
    td.innerHTML='<span class="badge-nosend">無送洗</span>';
   }else{
    td.textContent=daySum.toLocaleString();
   }
   fRow.append(td);
  });
  tfoot.append(fRow);
  tbl.append(tfoot);
  wrap.append(tbl);
  container.append(wrap);

  // 3. 逐日填寫紀錄卡片明細（清楚顯示每次填單內容與送出時間）
  const listTitle=document.createElement('h3');
  listTitle.style.cssText='margin:24px 0 10px;font-size:21px;color:#1e3a8a';
  listTitle.textContent='📅 每日填寫原始紀錄明細';
  container.append(listTitle);

  const dailyList=document.createElement('div');
  dailyList.className='daily-list';
  records.forEach(rec=>{
   const box=document.createElement('div');
   box.className='daily-item';
   const head=document.createElement('div');
   head.className='daily-item-header';
   const dTitle=document.createElement('div');
   dTitle.className='daily-item-date';
   dTitle.textContent=`送洗日：${rec.sourceDate}`;
   const dMeta=document.createElement('div');
   dMeta.className='daily-item-meta';
   const subTime=formatSubmitTime(rec.submittedAt);
   dMeta.textContent=`預計送回：${rec.targetDate || '—'}`+(subTime?` ｜ 飯店填寫時間：${subTime}`:'');
   head.append(dTitle,dMeta);
   box.append(head);

   const chips=document.createElement('div');
   chips.className='daily-chips';
   if(rec.noSendwash || !(rec.items || []).length){
    const empty=document.createElement('span');
    empty.className='muted';
    empty.textContent='當日登記「本次無送洗」';
    chips.append(empty);
   }else{
    rec.items.forEach(it=>{
     const chip=document.createElement('div');
     chip.className='daily-chip';
     chip.innerHTML=`${it.item}<span>${it.quantity}</span> ${it.unit || '件'}`;
     chips.append(chip);
    });
   }
   box.append(chips);
   dailyList.append(box);
  });
  container.append(dailyList);

 }catch(e){
  $('reconStatus').textContent=e.message || String(e);
 }finally{
  busy=false;$('btnRunReconcile').disabled=false;$('department').disabled=false;
 }
}

function exportReconcileCsv(){
 if(!lastReconData)return;
 const {hotel,dept,outlet,startStr,endStr,filledDates,recordByDate,itemStats,grandTotalQty}=lastReconData;
 const esc=v=>{const s=String(v ?? '');return /[",\r\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
 const lines=[];
 lines.push([esc(`${hotel} - ${dept}${outlet?` (${outlet})`:''} 送洗對點結帳明細`)].join(','));
 lines.push([esc(`飯店送洗日期區間：${startStr} 至 ${endStr}`)].join(','));
 lines.push([]);
 lines.push(['品項','單位','區間總計',...filledDates].map(esc).join(','));
 itemStats.forEach(st=>{
  const row=[st.item,st.unit,st.total,...filledDates.map(d=>st.byDate[d] ?? '')];
  lines.push(row.map(esc).join(','));
 });
 const footerSum=['單日合計','',grandTotalQty,...filledDates.map(d=>{
  const rec=recordByDate.get(d);
  return (rec?.items || []).reduce((acc,x)=>acc+Number(x.quantity || 0),0);
 })];
 lines.push(footerSum.map(esc).join(','));
 const footerTime=['飯店最後送出時間','','',...filledDates.map(d=>formatSubmitTime(recordByDate.get(d)?.submittedAt))];
 lines.push(footerTime.map(esc).join(','));

 const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download=`${hotel}_${dept}${outlet?`_${outlet}`:''}_對帳單_${startStr}_${endStr}.csv`;
 document.body.append(a);a.click();a.remove();
 URL.revokeObjectURL(url);
}

// 模式切換控制
function switchMode(mode){
 if(busy)return;
 currentMode=mode;
 const isRecon=mode==='reconcile';
 $('tabEntry').setAttribute('aria-selected',String(!isRecon));
 $('tabReconcile').setAttribute('aria-selected',String(isRecon));
 $('mainContainer').classList.toggle('wide-mode',isRecon);
 $('entryDateBox').hidden=isRecon;
 $('reconcileControls').hidden=!isRecon;
 $('form').hidden=isRecon;
 $('reconcileSection').hidden=!isRecon;
 $('subtitle').textContent=isRecon
  ? '依「飯店送洗日期」拉出飯店當時填寫的原始對點數量與總計，供結帳核對。'
  : '只填本次有送洗的品項，其他可留白；整張空白也能送出。';
 if(isRecon){
  loadReconcile();
 }else{
  load();
 }
}

$('tabEntry').onclick=()=>switchMode('entry');
$('tabReconcile').onclick=()=>switchMode('reconcile');
$('btnRunReconcile').onclick=loadReconcile;
$('btnExportCsv').onclick=exportReconcileCsv;
$('btnPrint').onclick=()=>window.print();

 try{

  const originalRows=settings.filter(r=>r.hotel===hotel&&r.department===dept&&(r.outlet || '')===outlet);

  const target=core.targetDate(hotel,dept,sourceDate,latest.deliverySchedules);
  if($('target').textContent!==`預計送回／寫入登記單：${target}`)throw new Error('收送日設定已更新，請重新整理後確認日期');
  const id=core.submissionId(hotel,dept,sourceDate,outlet);
  const ref=doc(db,'sendwash_records',id);
  const expected=current?.revision || 0;
  await runTransaction(db,async tx=>{const snap=await tx.get(ref),signed=outlet?await tx.get(doc(db,'logistics_records',`${target}_${hotel}_${dept}`)):null;const old=snap.exists()?snap.data():{};if(signed?.exists()&&(signed.data().driverSig||signed.data().clientSig))throw new Error('餐廳總單已簽收，不能新增或修改送洗數量');if(old.acceptedAt || Object.keys(old.receivedItems || {}).length)throw new Error('場內已確認，不能修改');if((old.revision || 0)!==expected)throw new Error('其他人已更新本次對點單，請重新載入');tx.set(ref,{hotel,department:dept,inventoryHotel:rows[0].inventoryHotel,...(outlet?{outlet}:{}),sourceDate,targetDate:target,items,notes:old.notes || {},noSendwash:items.length===0,revision:expected+1,submittedAt:new Date().toISOString()});});
  shownBatchId=null;batchDrafts.delete(id);await load(); $('message').textContent=items.length ? '已送出！場內只會確認有填數量的品項。' : '已送出，已登記本次無送洗；之後有送洗可再填寫。';
 }catch(e){showError(e);disable(false);rows.forEach((_,i)=>{if($(`qty${i}`))$(`qty${i}`).disabled=locked(current);});}finally{busy=false;}
};
try{
