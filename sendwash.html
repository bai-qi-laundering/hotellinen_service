<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>飯店送洗對點單</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;background:#f3f4f6;color:#1f2937;margin:0;padding:20px;font-size:20px;line-height:1.6}
main{max-width:640px;margin:auto}
section{background:white;border-radius:16px;padding:20px;margin:20px 0}
h1{font-size:30px;line-height:1.35;overflow-wrap:anywhere}
label{display:block;margin:20px 0;font-size:22px;font-weight:700;overflow-wrap:anywhere}
input,select{font:inherit;font-size:22px;line-height:1.4;padding:14px;border:1px solid #94a3b8;border-radius:8px;width:100%;max-width:100%;min-width:0;min-height:60px;margin-top:10px;background:white;color:#1f2937}
#items input{font-size:30px;font-weight:700;min-height:68px}
#items input::placeholder{font-size:18px;font-weight:400;color:#64748b;opacity:1}
input:disabled,select:disabled{opacity:1;-webkit-text-fill-color:#475569;background:#f1f5f9}
button,a.button{font:inherit;font-size:22px;line-height:1.4;display:block;border:0;border-radius:10px;padding:18px 14px;background:#2563eb;color:white;width:100%;min-height:64px;font-weight:700;text-align:center;text-decoration:none;margin:16px 0}
button:disabled{opacity:.5}
.muted{color:#475569;font-size:18px;line-height:1.6}
#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#92400e;font-size:20px;font-weight:600}
#target{font-size:22px;font-weight:700;color:#1d4ed8;overflow-wrap:anywhere}
input:focus-visible,select:focus-visible,button:focus-visible,a.button:focus-visible{outline:3px solid #1d4ed8;outline-offset:3px}
@media(max-width:480px){body{padding:16px}section{padding:16px}h1{font-size:28px}}
</style></head>
<body><main><h1 id="title">送洗對點單</h1><p class="muted">只填本次有送洗的品項，其他可留白；整張空白也能送出。</p><a id="back" class="button" style="background:#475569">返回簽收單</a><section><label>部門<select id="department" disabled></select></label><label>飯店送洗日期<input id="sourceDate" type="date" disabled></label><p id="target"></p></section><form id="form"><section id="items">正在讀取對點設定…</section><p id="message" role="status"></p><button id="submit" disabled>送出送洗對點單</button></form></main>
<script src="sendwash-core.js?v=20261012-optional"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import {initializeFirestore,memoryLocalCache,doc,getDocFromServer,runTransaction} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
const db=initializeFirestore(initializeApp({apiKey:'AIzaSyBEXcnXOKRags29CvhM6TKe3N-zty-ela4',authDomain:'hotel-inventory-3a1ad.firebaseapp.com',projectId:'hotel-inventory-3a1ad',storageBucket:'hotel-inventory-3a1ad.firebasestorage.app',messagingSenderId:'363844184412',appId:'1:363844184412:web:66cdd6425d53bde75f3999'}),{localCache:memoryLocalCache()});
const core=window.SendwashCore,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),hotel=params.get('hotel');
let config,settings,rows=[],current=null,busy=false,sequence=0;
const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(new Date());
$('sourceDate').value=today; // The receipt date is an outbound date, never an inbound default.
const back=new URL('logistics.html',location.href); if(hotel) back.searchParams.set('hotel',hotel); if(params.get('date')) back.searchParams.set('date',params.get('date')); $('back').href=back;
function disable(value){$('department').disabled=value;$('sourceDate').disabled=value;$('submit').disabled=value;}
function showError(error){$('message').textContent=error.message || String(error);}
async function load(){
 const request=++sequence; disable(true); $('items').textContent='正在確認雲端單據…'; $('message').textContent='';
 try{
  const dept=$('department').value,sourceDate=$('sourceDate').value;
  rows=settings.filter(r=>r.hotel===hotel&&r.department===dept);
  const target=core.targetDate(hotel,dept,sourceDate,config.deliverySchedules);
  const id=core.submissionId(hotel,dept,sourceDate),snap=await getDocFromServer(doc(db,'sendwash_records',id));
  if(request!==sequence)return;
  current=snap.exists()?snap.data():null;
  $('target').textContent=`預計送回／寫入登記單：${target}`;
  $('items').replaceChildren();
  rows.forEach((r,i)=>{const label=document.createElement('label');label.textContent=`${r.item}（${r.unit}）`;const input=document.createElement('input');input.id=`qty${i}`;input.type='number';input.min='0';input.step='1';input.inputMode='numeric';input.required=false;input.placeholder='本次未送洗，可留白';input.value=current ? (current.items.find(x=>x.item===r.item)?.quantity ?? '') : r.defaultQuantity;input.disabled=Boolean(current?.acceptedAt || Object.keys(current?.receivedItems || {}).length);label.append(input);$('items').append(label);});
  disable(false);
  if(current?.acceptedAt || Object.keys(current?.receivedItems || {}).length){$('submit').disabled=true;$('message').textContent='場內已開始逐項點收並簽名，這張單已鎖定。';}
  else if(current){$('message').textContent=current.noSendwash ? '已登記本次無送洗。如之後有送洗，可填入數量再送出。' : '本次已填寫。再次送出會更新同一張單，不會重複加總。';}
 }catch(e){showError(e);$('items').textContent='無法載入；請確認設定後重試。';$('department').disabled=false;$('sourceDate').disabled=false;}
}
$('department').onchange=load;$('sourceDate').onchange=load;
$('form').onsubmit=async e=>{
 e.preventDefault(); if(busy)return; busy=true; disable(true); $('message').textContent='正在送出…';
 try{
  const dept=$('department').value,sourceDate=$('sourceDate').value,items=core.submissionItems(rows,rows.map((_,i)=>$(`qty${i}`).value));
  const template=await getDocFromServer(doc(db,'inventory_config','master_template'));
  if(!template.exists())throw new Error('找不到設定');
  const latest=template.data(),latestRows=core.settings(latest.sendwashSettings || [],latest.items).filter(r=>r.hotel===hotel&&r.department===dept);
  if(JSON.stringify(rows)!==JSON.stringify(latestRows))throw new Error('對點設定已更新，請重新整理後填寫');
  const target=core.targetDate(hotel,dept,sourceDate,latest.deliverySchedules);
  if($('target').textContent!==`預計送回／寫入登記單：${target}`)throw new Error('收送日設定已更新，請重新整理後確認日期');
  const id=core.submissionId(hotel,dept,sourceDate);
  const ref=doc(db,'sendwash_records',id);
  const expected=current?.revision || 0;
  await runTransaction(db,async tx=>{const snap=await tx.get(ref);const old=snap.exists()?snap.data():{};if(old.acceptedAt || Object.keys(old.receivedItems || {}).length)throw new Error('場內已確認，不能修改');if((old.revision || 0)!==expected)throw new Error('其他人已更新本次對點單，請重新載入');tx.set(ref,{hotel,department:dept,inventoryHotel:rows[0].inventoryHotel,sourceDate,targetDate:target,items,notes:old.notes || {},noSendwash:items.length===0,revision:expected+1,submittedAt:new Date().toISOString()});});
  await load(); $('message').textContent=items.length ? '已送出！場內只會確認有填數量的品項。' : '已送出，已登記本次無送洗；之後有送洗可再填寫。';
 }catch(e){showError(e);disable(false);}finally{busy=false;}
};
try{
 if(!hotel)throw new Error('連結缺少飯店，請從原本簽收單進入');
 const snap=await getDocFromServer(doc(db,'inventory_config','master_template'));if(!snap.exists())throw new Error('找不到品項設定');config=snap.data();settings=core.settings(config.sendwashSettings || [],config.items).filter(r=>r.hotel===hotel);
 if(!settings.length)throw new Error('此飯店尚未設定送洗對點品項');
 $('title').textContent=`${hotel}｜送洗對點單`;
 [...new Set(settings.map(r=>r.department))].forEach(d=>{const opt=document.createElement('option');opt.value=d;opt.textContent=d;$('department').append(opt);});
 if(settings.some(r=>r.department===params.get('department')))$('department').value=params.get('department');
 await load();
}catch(e){showError(e);$('items').textContent='請由場內管理人員確認試算表對點設定。';}
</script></body></html>
