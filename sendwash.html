<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>飯店送洗對點單</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;background:#f3f4f6;color:#1f2937;margin:0;padding:20px;font-size:20px;line-height:1.6}
main{max-width:640px;margin:auto}
section{background:white;border-radius:16px;padding:20px;margin:20px 0}
h1{font-size:30px;line-height:1.35;overflow-wrap:anywhere}
label{display:block;margin:20px 0;font-size:22px;font-weight:700;overflow-wrap:anywhere}
input,select{font:inherit;font-size:22px;line-height:1.4;padding:14px;border:1px solid #94a3b8;border-radius:8px;width:100%;max-width:100%;min-width:0;min-height:60px;margin-top:10px;background:white;color:#1f2937}
#items input{font-size:30px;font-weight:700;min-height:68px}
#items input::placeholder{font-size:18px;font-weight:400;color:#64748b;opacity:1}
input:disabled,select:disabled{opacity:1;-webkit-text-fill-color:#475569;background:#f1f5f9}
button,a.button{font:inherit;font-size:22px;line-height:1.4;display:block;border:0;border-radius:10px;padding:18px 14px;background:#2563eb;color:white;width:100%;min-height:64px;font-weight:700;text-align:center;text-decoration:none;margin:16px 0}
button:disabled{opacity:.5}
.muted{color:#475569;font-size:18px;line-height:1.6}
#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#92400e;font-size:20px;font-weight:600}
#target{font-size:22px;font-weight:700;color:#1d4ed8;overflow-wrap:anywhere}
#outletTabs{display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding:4px 0 10px;scrollbar-width:thin}
#outletTabs[hidden]{display:none}
#outletTabs button{flex:0 0 auto;width:auto;min-height:56px;white-space:nowrap;scroll-snap-align:start;background:#e8eef7;color:#244068;margin:0;padding:12px 18px}
#outletTabs button[aria-selected="true"]{background:#2563eb;color:white}
input:focus-visible,select:focus-visible,button:focus-visible,a.button:focus-visible{outline:3px solid #1d4ed8;outline-offset:3px}
@media(max-width:480px){body{padding:16px}section{padding:16px}h1{font-size:28px}}
</style></head>
<body><main><h1 id="title">送洗對點單</h1><p class="muted">只填本次有送洗的品項，其他可留白；整張空白也能送出。</p><a id="back" class="button" style="background:#475569">返回簽收單</a><section><label>部門<select id="department" disabled></select></label><label>飯店送洗日期<input id="sourceDate" type="date" disabled></label><p id="target"></p></section><nav id="outletTabs" aria-label="選擇餐廳" hidden></nav><form id="form"><section id="items">正在讀取對點設定…</section><p id="message" role="status"></p><button id="submit" disabled>送出送洗對點單</button></form></main>
<script src="sendwash-core.js?v=20261018-club-square"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import {initializeFirestore,memoryLocalCache,doc,getDocFromServer,runTransaction} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
const db=initializeFirestore(initializeApp({apiKey:'AIzaSyBEXcnXOKRags29CvhM6TKe3N-zty-ela4',authDomain:'hotel-inventory-3a1ad.firebaseapp.com',projectId:'hotel-inventory-3a1ad',storageBucket:'hotel-inventory-3a1ad.firebasestorage.app',messagingSenderId:'363844184412',appId:'1:363844184412:web:66cdd6425d53bde75f3999'}),{localCache:memoryLocalCache()});
const core=window.SendwashCore,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),hotel=params.get('hotel');
let config,settings,rows=[],current=null,busy=false,sequence=0,activeOutlet='';
const batchDrafts=new Map();let shownBatchId=null,activeBatchId='';
const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(new Date());
$('sourceDate').value=today; // The receipt date is an outbound date, never an inbound default.
const back=new URL('logistics.html',location.href); if(hotel) back.searchParams.set('hotel',hotel); if(params.get('date')) back.searchParams.set('date',params.get('date')); $('back').href=back;
function disable(value){$('department').disabled=value;$('sourceDate').disabled=value;$('submit').disabled=value;}
function showError(error){$('message').textContent=error.message || String(error);}
function outletsFor(dept){return [...new Set(settings.filter(r=>r.department===dept).map(r=>r.outlet || ''))];}
const locked=record=>Boolean(record?.acceptedAt || Object.keys(record?.receivedItems || {}).length);
const batchRows=list=>list.filter(r=>core.normalize(r.hotel)==='洲際'&&r.outlet&&core.department(r.department)!=='制服');
const batchEnabled=dept=>batchRows(settings).some(r=>r.department===dept);
function batchGroups(list,sourceDate){
 const groups=new Map();
 batchRows(list).forEach(row=>{const id=core.submissionId(hotel,row.department,sourceDate,row.outlet);if(!groups.has(id))groups.set(id,{id,department:row.department,outlet:row.outlet,sourceDate,rows:[]});groups.get(id).rows.push(row);});
 return [...groups.values()].map(group=>({...group,rows:core.displayRows(group.rows)}));
}
function rememberBatch(){
 const draft=batchDrafts.get(shownBatchId);if(!draft||locked(draft.current))return;
 draft.values=draft.rows.map((_,i)=>$(`qty${i}`)?.value ?? draft.values[i]);
}
async function loadBatch(request,dept,sourceDate){
 const groups=batchGroups(settings,sourceDate);
 const missing=groups.filter(group=>!batchDrafts.has(group.id));
 const loaded=await Promise.all(missing.map(async group=>{const snap=await getDocFromServer(doc(db,'sendwash_records',group.id)),record=snap.exists()?snap.data():null;const original=settings.filter(row=>row.department===group.department&&row.outlet===group.outlet),display=core.displayRows(original);return {...group,rows:display,current:record,values:display.map(row=>record?(record.items.find(item=>item.item===row.item)?.quantity ?? ''):row.defaultQuantity)};}));
 if(request!==sequence)return;
 loaded.forEach(group=>batchDrafts.set(group.id,group));
 if(!groups.some(group=>group.id===activeBatchId))activeBatchId=(groups.find(group=>group.department===dept)||groups[0]).id;
 const selected=batchDrafts.get(activeBatchId),nav=$('outletTabs'),scroll=nav.scrollLeft;nav.replaceChildren();nav.hidden=false;
 groups.forEach(group=>{const button=document.createElement('button'),entry=batchDrafts.get(group.id),duplicate=groups.some(other=>other.department!==group.department&&other.outlet===group.outlet);button.type='button';button.textContent=(duplicate?`${group.department}／`:'')+group.outlet+(locked(entry.current)?' ✓ 已點收':'');button.setAttribute('aria-selected',String(group.id===activeBatchId));button.onclick=()=>{if(busy)return;activeBatchId=group.id;return load();};nav.append(button);});nav.scrollLeft=scroll;
 rows=selected.rows;current=selected.current;shownBatchId=selected.id;
 const target=core.targetDate(hotel,selected.department,sourceDate,config.deliverySchedules);
 $('target').textContent=`共 ${groups.length} 個餐廳，切換填寫後一次送出。\n${selected.outlet} 預計送回：${target}`;
 $('items').replaceChildren();
 rows.forEach((row,i)=>{const label=document.createElement('label');label.textContent=`${row.item}（${row.unit}）`;const input=document.createElement('input');input.id=`qty${i}`;input.type='number';input.min='0';input.step='1';input.inputMode='numeric';input.required=false;input.placeholder='本次未送洗，可留白';input.value=selected.values[i];input.disabled=locked(current);input.oninput=()=>{selected.values[i]=input.value;};label.append(input);$('items').append(label);});
 disable(false);$('submit').textContent='一次送出全部餐廳';$('submit').disabled=groups.every(group=>locked(batchDrafts.get(group.id).current));
 $('message').textContent=locked(current)?'這個餐廳已開始點收，原單保留；其他尚未點收的餐廳仍可填寫後一起送出。':'左右切換餐廳會保留已填數量，全部填完後按一次送出即可。';
}
async function submitBatch(){
 rememberBatch();rows.forEach((_,i)=>{if($(`qty${i}`))$(`qty${i}`).disabled=true;});const sourceDate=$('sourceDate').value,groups=batchGroups(settings,sourceDate);
 if(!groups.length||groups.some(group=>!batchDrafts.has(group.id)))throw new Error('餐廳單據尚未讀取完成，請重新載入');
 const template=await getDocFromServer(doc(db,'inventory_config','master_template'));if(!template.exists())throw new Error('找不到設定');
 const latest=template.data(),latestSettings=core.settings(latest.sendwashSettings || [],latest.items).filter(r=>r.hotel===hotel);
 if(JSON.stringify(batchRows(settings))!==JSON.stringify(batchRows(latestSettings)))throw new Error('餐廳對點設定已更新，請重新整理後填寫');
 const plans=groups.filter(group=>!locked(batchDrafts.get(group.id).current)).map(group=>{
  const draft=batchDrafts.get(group.id),targetDate=core.targetDate(hotel,group.department,sourceDate,latest.deliverySchedules);
  if(targetDate!==core.targetDate(hotel,group.department,sourceDate,config.deliverySchedules))throw new Error('收送日設定已更新，請重新整理後確認日期');
  // Preserve historical unsplit quantities without offering the retired input.
  const retained=(draft.current?.items || []).filter(item=>core.retiredOutletItem({hotel,department:group.department,outlet:group.outlet,item:item.item}));
  return {...group,items:[...retained,...core.submissionItems(draft.rows,draft.values)],expected:draft.current?.revision || 0,targetDate};
 });
 if(!plans.length)throw new Error('全部餐廳已開始點收，原單已鎖定');
 await runTransaction(db,async tx=>{
  const snapshots=[];for(const plan of plans)snapshots.push(await tx.get(doc(db,'sendwash_records',plan.id)));
  const receiptIds=[...new Set(plans.map(plan=>`${plan.targetDate}_${hotel}_${plan.department}`))],receipts=[];for(const id of receiptIds)receipts.push(await tx.get(doc(db,'logistics_records',id)));
  if(receipts.some(snap=>snap.exists()&&(snap.data().driverSig||snap.data().clientSig)))throw new Error('餐廳總單已簽收，本次全部尚未送出');
  const updates=plans.map((plan,i)=>{const old=snapshots[i].exists()?snapshots[i].data():{};if(locked(old))throw new Error(`${plan.outlet} 已開始點收，本次全部尚未送出，請重新載入確認`);if((old.revision || 0)!==plan.expected)throw new Error(`${plan.outlet} 已由其他人更新，本次全部尚未送出，請重新載入確認`);return {hotel,department:plan.department,inventoryHotel:plan.rows[0].inventoryHotel,outlet:plan.outlet,sourceDate,targetDate:plan.targetDate,items:plan.items,notes:old.notes || {},noSendwash:plan.items.length===0,revision:plan.expected+1,submittedAt:new Date().toISOString()};});
  plans.forEach((plan,i)=>tx.set(doc(db,'sendwash_records',plan.id),updates[i]));
 });
 shownBatchId=null;groups.forEach(group=>batchDrafts.delete(group.id));await load();$('message').textContent=`已一次送出 ${plans.length} 個餐廳！空白餐廳已登記本次無送洗，已點收的原單保留。`;
}
function renderOutlets(dept){
 const outlets=outletsFor(dept),nav=$('outletTabs'),scroll=nav.scrollLeft;nav.replaceChildren();nav.hidden=outlets.length<=1&&outlets[0]==='';
 if(!outlets.includes(activeOutlet))activeOutlet=outlets[0] || '';
 outlets.forEach(outlet=>{const button=document.createElement('button');button.type='button';button.textContent=outlet || '原本品項';button.setAttribute('aria-selected',String(outlet===activeOutlet));button.onclick=()=>{if(busy)return;activeOutlet=outlet;load();};nav.append(button);});nav.scrollLeft=scroll;
}
async function load(){
 rememberBatch();shownBatchId=null;
 const request=++sequence; disable(true); $('items').textContent='正在確認雲端單據…'; $('message').textContent='';
 try{
  const dept=$('department').value,sourceDate=$('sourceDate').value;
  if(batchEnabled(dept)){await loadBatch(request,dept,sourceDate);return;}
  $('submit').textContent='送出送洗對點單';
  renderOutlets(dept);rows=settings.filter(r=>r.hotel===hotel&&r.department===dept&&(r.outlet || '')===activeOutlet);
  const target=core.targetDate(hotel,dept,sourceDate,config.deliverySchedules);
  const id=core.submissionId(hotel,dept,sourceDate,activeOutlet),snap=await getDocFromServer(doc(db,'sendwash_records',id));
  if(request!==sequence)return;
  current=snap.exists()?snap.data():null;
  $('target').textContent=`預計送回／寫入登記單：${target}`;
  $('items').replaceChildren();
  rows.forEach((r,i)=>{const label=document.createElement('label');label.textContent=`${r.item}（${r.unit}）`;const input=document.createElement('input');input.id=`qty${i}`;input.type='number';input.min='0';input.step='1';input.inputMode='numeric';input.required=false;input.placeholder='本次未送洗，可留白';input.value=current ? (current.items.find(x=>x.item===r.item)?.quantity ?? '') : r.defaultQuantity;input.disabled=Boolean(current?.acceptedAt || Object.keys(current?.receivedItems || {}).length);label.append(input);$('items').append(label);});
  disable(false);
  if(current?.acceptedAt || Object.keys(current?.receivedItems || {}).length){$('submit').disabled=true;$('message').textContent='場內已開始逐項點收並簽名，這張單已鎖定。';}
  else if(current){$('message').textContent=current.noSendwash ? '已登記本次無送洗。如之後有送洗，可填入數量再送出。' : '本次已填寫。再次送出會更新同一張單，不會重複加總。';}
 }catch(e){showError(e);$('items').textContent='無法載入；請確認設定後重試。';$('department').disabled=false;$('sourceDate').disabled=false;}
}
$('department').onchange=()=>{activeOutlet='';load();};$('sourceDate').onchange=load;
$('form').onsubmit=async e=>{
 e.preventDefault(); if(busy)return; busy=true; disable(true); $('message').textContent='正在送出…';
 try{
  if(batchEnabled($('department').value)){await submitBatch();return;}
  const dept=$('department').value,sourceDate=$('sourceDate').value,outlet=activeOutlet,items=core.submissionItems(rows,rows.map((_,i)=>$(`qty${i}`).value));
  const template=await getDocFromServer(doc(db,'inventory_config','master_template'));
  if(!template.exists())throw new Error('找不到設定');
  const latest=template.data(),latestRows=core.settings(latest.sendwashSettings || [],latest.items).filter(r=>r.hotel===hotel&&r.department===dept&&(r.outlet || '')===outlet);
  if(JSON.stringify(rows)!==JSON.stringify(latestRows))throw new Error('對點設定已更新，請重新整理後填寫');
  const target=core.targetDate(hotel,dept,sourceDate,latest.deliverySchedules);
  if($('target').textContent!==`預計送回／寫入登記單：${target}`)throw new Error('收送日設定已更新，請重新整理後確認日期');
  const id=core.submissionId(hotel,dept,sourceDate,outlet);
  const ref=doc(db,'sendwash_records',id);
  const expected=current?.revision || 0;
  await runTransaction(db,async tx=>{const snap=await tx.get(ref),signed=outlet?await tx.get(doc(db,'logistics_records',`${target}_${hotel}_${dept}`)):null;const old=snap.exists()?snap.data():{};if(signed?.exists()&&(signed.data().driverSig||signed.data().clientSig))throw new Error('餐廳總單已簽收，不能新增或修改送洗數量');if(old.acceptedAt || Object.keys(old.receivedItems || {}).length)throw new Error('場內已確認，不能修改');if((old.revision || 0)!==expected)throw new Error('其他人已更新本次對點單，請重新載入');tx.set(ref,{hotel,department:dept,inventoryHotel:rows[0].inventoryHotel,...(outlet?{outlet}:{}),sourceDate,targetDate:target,items,notes:old.notes || {},noSendwash:items.length===0,revision:expected+1,submittedAt:new Date().toISOString()});});
  await load(); $('message').textContent=items.length ? '已送出！場內只會確認有填數量的品項。' : '已送出，已登記本次無送洗；之後有送洗可再填寫。';
 }catch(e){showError(e);disable(false);if(batchEnabled($('department').value))rows.forEach((_,i)=>{if($(`qty${i}`))$(`qty${i}`).disabled=locked(current);});}finally{busy=false;}
};
try{
 if(!hotel)throw new Error('連結缺少飯店，請從原本簽收單進入');
 const snap=await getDocFromServer(doc(db,'inventory_config','master_template'));if(!snap.exists())throw new Error('找不到品項設定');config=snap.data();settings=core.settings(config.sendwashSettings || [],config.items).filter(r=>r.hotel===hotel);
 if(!settings.length)throw new Error('此飯店尚未設定送洗對點品項');
 $('title').textContent=`${hotel}｜送洗對點單`;
 [...new Set(settings.map(r=>r.department))].forEach(d=>{const opt=document.createElement('option');opt.value=d;opt.textContent=d;$('department').append(opt);});
 if(settings.some(r=>r.department===params.get('department')))$('department').value=params.get('department');
 await load();
}catch(e){showError(e);$('items').textContent='請由場內管理人員確認試算表對點設定。';}
</script></body></html>
