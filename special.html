    <script type="module">
        import { FALLBACK_HOTELS, SPECIAL_MOCK_KEY, REWORK_REASONS } from './special-config.js?v=20261027-special';
        import { shipDateLabel } from './special-shipdate.js?v=20261027-special';
        import { signItem, reworkItem, sendSheet, updateOfficeName, foldCards, spreadCards, washSlips, officeSheets, searchableOfficeSheets, officeOutstanding, officeQtyFlags, foldedHandedQty, reworkBadge, reworkNote, signedMark, signPoolQty, signWashBatch, signSpreadItem, returnToWash, itemTrail, normalizeInFlight, departmentReadPlan, demoDepartmentDocs, newSpecialId } from './special-flow.js?v=20261127-rework-wash';
        import { inventoryCatalog, buildInventoryWrites, mergeOfficeInventoryRecord } from './special-inventory.js?v=20261126-partial-office';
        import { taipeiParts, taipeiToday, formatTaipeiStamp, formatMd } from './special-time.js?v=20261027-inventory';

        const pageParams = new URLSearchParams(location.search);
        const demo = pageParams.get('demo') === '1';
        const useMock = pageParams.get('mock') === '1' || demo;
        const dept = ['wash', 'spread', 'fold', 'office'].includes(pageParams.get('dept')) ? pageParams.get('dept') : 'fold';
        const RULE_HINT = '無法寫入特處資料（Firebase 權限不足）。請老闆在 Firestore 規則允許 special_items 讀寫。這筆沒有儲存。';
        const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxkUiqCGa85QiI8P91p4DEnd6exOuQ4VnBt4r-hrrQHImE-3Bg0KO3yVR3_EbG5yHovtA/exec';
        let db = null;
        let storage = null;
        let docs = [];
        let hotels = FALLBACK_HOTELS.slice();
        let schedules = [];
        let catalog = new Map();
        let catalogReady = false;
        let templateFingerprint = '';
        const mode = dept;
        let returnQty = 1;
        let officeChecked = new Set();
        let officeActual = {};
        let washActual = {};
        let popupSlip = null;
        const deptCopy = {
            wash: '同一家飯店、同一個日期一起簽名。退回的單掛在退回日，飯店送出日留在每一列。',
            spread: '床單、被套、枕套。一項簽一項，簽完到摺疊。可以退回洗滌。',
            fold: '一項簽一項，簽完到辦公室。可以退回洗滌。',
            office: '勾摺疊送出的每一項。實收和摺疊不同會留下數量不符，再簽名送出。',
        };
        let saving = false;
        let deferredDocs = null;
        let reopenAfter = 0;
        function startSaving() {
            saving = true;
            document.body.setAttribute('aria-busy', 'true');
            document.querySelectorAll('button, input').forEach(control => {
                if (control.disabled) return;
                control.dataset.saveDisabled = '1';
                control.disabled = true;
            });
            document.querySelectorAll('[data-action="confirm-sign"], [data-action="confirm-rework"], [data-action="confirm-office"]').forEach(button => {
                button.dataset.saveLabel = button.textContent;
                button.textContent = '儲存中，請稍候…';
            });
        }
        function finishSaving() {
            saving = false;
            document.body.removeAttribute('aria-busy');
            document.querySelectorAll('[data-save-disabled]').forEach(control => { control.disabled = false; delete control.dataset.saveDisabled; });
            document.querySelectorAll('[data-save-label]').forEach(button => { button.textContent = button.dataset.saveLabel; delete button.dataset.saveLabel; });
            if (deferredDocs === null) return;
            docs = deferredDocs;
            deferredDocs = null;
            render();
        }
        let popupId = null;
        let shipQty = 1;
        let reworkQty = 1;
        let reason = '';
        let officeIds = [];
        let foldPad = null;
        let officePad = null;

        const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        function toast(text) {
            const el = document.getElementById('toast');
            el.textContent = text;
            el.classList.remove('opacity-0');
            setTimeout(() => el.classList.add('opacity-0'), 2600);
        }
        function showBanner(text) {
            const el = document.getElementById('banner');
            el.textContent = text;
            el.classList.remove('hidden');
        }
        function permissionDenied(error) {
            const code = error?.code || '';
            const message = String(error?.message || error || '');
            return code === 'permission-denied' || /permission-denied|insufficient permissions|PERMISSION_DENIED/i.test(message);
        }
        function readMock() {
            try { return JSON.parse(localStorage.getItem(SPECIAL_MOCK_KEY) || '[]'); }
            catch { return []; }
        }
        function writeMock(next) {
            localStorage.setItem(SPECIAL_MOCK_KEY, JSON.stringify(next));
        }
        function firestoreShape(item) {
            const history = (item.history || []).map(event => {
                const row = { type: event.type, time: event.time, round: event.round || 1 };
                if (event.reason) row.reason = event.reason;
                if (event.qty != null) row.qty = event.qty;
                if (event.signature) row.signature = event.signature;
                if (event.previousQty != null) row.previousQty = event.previousQty;
                if (event.previousSignedAt) row.previousSignedAt = event.previousSignedAt;
                return row;
            });
            const snap = side => ({
                hotel: side?.hotel || '',
                item: side?.item || '',
                qty: side?.qty ?? 0,
                foldSignedAt: side?.foldSignedAt || '',
                foldSignature: side?.foldSignature || '',
            });
            return {
                hotel: item.hotel, receivedDate: item.receivedDate, item: item.item, qty: item.qty,
                source: item.source || 'manual', createdAt: item.createdAt || '', round: item.round || 1,
                status: item.status, history, foldSignature: item.foldSignature || '', foldSignedAt: item.foldSignedAt || '',
                shipDate: item.shipDate || '', shipRule: item.shipRule || '', officeName: item.officeName || item.item,
                officeSignature: item.officeSignature || '', sentAt: item.sentAt || '', unknown: !!item.unknown,
                expectedQty: Number.isInteger(item.expectedQty) ? item.expectedQty : (item.qty ?? 0),
                washSignature: item.washSignature || '', washSignedAt: item.washSignedAt || '',
                spreadSignature: item.spreadSignature || '', spreadSignedAt: item.spreadSignedAt || '',
                discrepancyOpen: !!item.discrepancyOpen, discrepancyAckAt: item.discrepancyAckAt || '',
                returnDate: item.returnDate || '', returnSignature: item.returnSignature || '', returnSignedAt: item.returnSignedAt || '',
                foldedQty: Number.isInteger(item.foldedQty) ? item.foldedQty : null,
                officeReceived: Number.isInteger(item.officeReceived) ? item.officeReceived : null,
                officeQtyFlag: !!item.officeQtyFlag, officeCheckedAt: item.officeCheckedAt || '',
                entryId: item.entryId || '', splitOf: item.splitOf || '', deleted: !!item.deleted, deletedAt: item.deletedAt || '',
                lineUserId: item.lineUserId || '', lineDisplayName: item.lineDisplayName || '', lineMessageId: item.lineMessageId || '',
                edits: (item.edits || []).map(edit => ({
                    time: edit.time || '',
                    before: snap(edit.before),
                    after: snap(edit.after),
                    clearedSignature: !!edit.clearedSignature,
                    deleted: !!edit.deleted,
                })),
            };
        }
        async function checkLatest(transaction, upserts) {
            const { doc } = window.__specialFs;
            const snapshots = await Promise.all(upserts.map(item => transaction.get(doc(db, 'special_items', item.id))));
            snapshots.forEach((snapshot, index) => {
                const expected = docs.find(item => item.id === upserts[index].id);
                if (Boolean(expected) !== snapshot.exists() || (expected && JSON.stringify(firestoreShape(expected)) !== JSON.stringify(firestoreShape(snapshot.data())))) {
                    throw new Error('這筆已被其他人更新，請重新開啟確認後再試；本次沒有覆寫');
                }
            });
        }
        const DEMO_STORE = 'special-demo-docs-v1';
        function readDemo() {
            try {
                const parsed = JSON.parse(sessionStorage.getItem(DEMO_STORE) || 'null');
                return Array.isArray(parsed) ? parsed : null;
            } catch { return null; }
        }
        async function persist(upserts) {
            if (useMock) {
                const base = demo ? docs : readMock();
                const map = new Map(base.map(item => [item.id, item]));
                upserts.forEach(item => map.set(item.id, item));
                const next = [...map.values()];
                if (demo) sessionStorage.setItem(DEMO_STORE, JSON.stringify(next));
                else writeMock(next);
                docs = next;
                return;
            }
            if (!db) throw new Error('尚未連上資料庫');
            try {
                const { doc, runTransaction } = window.__specialFs;
                await runTransaction(db, async transaction => {
                    await checkLatest(transaction, upserts);
                    upserts.forEach(item => transaction.set(doc(db, 'special_items', item.id), firestoreShape(item)));
                });
            } catch (error) {
                if (permissionDenied(error)) throw new Error(RULE_HINT);
                throw error;
            }
        }
        async function persistSent(specialUpserts, inventoryRecords) {
            if (useMock) {
                await persist(specialUpserts);
                return;
            }
            if (!db) throw new Error('尚未連上資料庫');
            const { doc, runTransaction } = window.__specialFs;
            try {
                await runTransaction(db, async transaction => {
                    await checkLatest(transaction, specialUpserts);
                    const refs = inventoryRecords.map(record => doc(db, 'inventory_records', record.id));
                    const existing = await Promise.all(refs.map(ref => transaction.get(ref)));
                    inventoryRecords.forEach((record, index) => {
                        const merged = mergeOfficeInventoryRecord(existing[index].exists() ? existing[index].data() : null, record);
                        const { id, ...fields } = merged;
                        transaction.set(refs[index], fields, { merge: true });
                    });
                    for (const item of specialUpserts) transaction.set(doc(db, 'special_items', item.id), firestoreShape(item));
                });
            } catch (error) {
                if (permissionDenied(error)) throw new Error('無法寫入盤點或特處（Firebase 權限不足）。這張出貨單沒有送出。');
                throw error;
            }
        }
        async function storeSignature(dataUrl, id, kind) {
            if (!dataUrl) return '';
            // Small folding signatures already have a supported inline representation.
            // Save them with the document, without two serial Storage round trips.
            if (kind === 'fold' || kind === 'rework' || kind === 'wash' || kind === 'spread' || kind === 'return' || useMock || !storage) return dataUrl;
            try {
                const { ref, uploadString, getDownloadURL } = window.__specialSt;
                const file = ref(storage, `special_signatures/${taipeiToday()}/${id}_${kind}_${Date.now()}.jpg`);
                await uploadString(file, dataUrl, 'data_url');
                return await getDownloadURL(file);
            } catch (error) {
                console.warn(error);
                toast('雲端圖片空間無法上傳，簽名已改存在單據裡');
                return dataUrl;
            }
        }

        function setupPad(canvas) {
            const ctx = canvas.getContext('2d');
            const paint = () => {
                const width = Math.min(640, Math.max(280, Math.floor(canvas.clientWidth || 300)));
                canvas.width = width;
                canvas.height = 160;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#111827';
            };
            paint();
            let drawing = false;
            const point = event => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return { x: (event.clientX - rect.left) * scaleX, y: (event.clientY - rect.top) * scaleY };
            };
            canvas.onpointerdown = event => {
                if (saving) return;
                event.preventDefault();
                drawing = true;
                canvas.setPointerCapture?.(event.pointerId);
                const p = point(event);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            };
            canvas.onpointermove = event => {
                if (!drawing) return;
                event.preventDefault();
                const p = point(event);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            };
            const stop = () => { drawing = false; ctx.beginPath(); };
            canvas.onpointerup = stop;
            canvas.onpointercancel = stop;
            return {
                clear: paint,
                hasInk() {
                    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                    for (let i = 0; i < data.length; i += 4) {
                        if (data[i] < 250 || data[i + 1] < 250 || data[i + 2] < 250) return true;
                    }
                    return false;
                },
                dataUrl: () => canvas.toDataURL('image/jpeg', 0.5),
            };
        }

        function deptHref(name) {
            const next = new URLSearchParams(location.search);
            next.set('dept', name);
            return `special.html?${next}`;
        }
        function renderTabs() {
            const office = mode === 'office';
            document.getElementById('foldPane').classList.toggle('hidden', office);
            document.getElementById('officePane').classList.toggle('hidden', !office);
            document.getElementById('sentRange').classList.toggle('hidden', !office);
            document.getElementById('deptHint').textContent = deptCopy[mode] || '';
            document.title = `百麒特處 - ${{ wash: '洗滌', spread: '撐開', fold: '摺疊', office: '辦公室' }[mode]}`;
            for (const name of ['wash', 'spread', 'fold', 'office']) {
                const link = document.getElementById(`tab${name[0].toUpperCase()}${name.slice(1)}`);
                link.href = deptHref(name);
                link.className = `dept-link py-3 rounded-t-xl font-black text-center ${mode === name ? 'bg-blue-700 text-white' : 'bg-white text-slate-600 border'}`;
                if (mode === name) link.setAttribute('aria-current', 'page');
                else link.removeAttribute('aria-current');
            }
        }
        function lineTrail(line) {
            const note = reworkNote(line);
            const trail = itemTrail(line);
            const bits = [];
            if (line.returnDate && line.receivedDate) bits.push(`飯店送出 ${formatMd(line.receivedDate)}`);
            if (note) bits.push(note);
            if (trail.steps.length) bits.push(trail.steps.join(' · '));
            return bits.length ? `<span class="block text-sm font-bold text-slate-600">${esc(bits.join(' · '))}</span>` : '';
        }
        function renderWash() {
            const cards = washSlips(docs, document.getElementById('foldSearch').value, { hotels, catalog });
            const host = document.getElementById('cardScroller');
            if (!cards.length) {
                host.innerHTML = '<p class="text-gray-500 font-bold py-10 text-center w-full">目前沒有待洗滌的特處</p>';
                return;
            }
            host.innerHTML = cards.map(card => {
                const groups = card.slips.map(slip => {
                    const lines = slip.lines.map(line => `<div class="py-3 border-b border-slate-100"><span class="block text-lg font-black">${esc(line.item)} × ${line.qty}</span>${lineTrail(line)}</div>`).join('');
                    const slipTitle = slip.returned ? `${slip.hotel}・退回` : slip.hotel;
                    return `<h3 class="text-xl font-black text-slate-800 mt-3">${esc(slipTitle)}</h3>${lines}<button type="button" data-action="open-wash" data-slip="${esc(slip.key)}" class="w-full my-3 py-4 rounded-xl bg-green-700 text-white font-black text-lg">簽名收下</button>`;
                }).join('');
                const title = card.label;
                return `<article class="day-card bg-white rounded-2xl shadow border border-slate-200 p-4"><h2 class="text-3xl font-black text-blue-950">${esc(title)}</h2>${groups}</article>`;
            }).join('');
        }
        function renderCards() {
            const cards = (mode === 'spread' ? spreadCards : foldCards)(docs, document.getElementById('foldSearch').value, { hotels, catalog });
            const host = document.getElementById('cardScroller');
            if (!cards.length) {
                host.innerHTML = '<p class="text-gray-500 font-bold py-10 text-center w-full">目前沒有待處理的特處</p>';
                return;
            }
            host.innerHTML = cards.map(card => {
                const groups = card.hotels.map(group => {
                    const lines = group.lines.map(line => {
                        const done = line.status === '已簽名' || line.status === '已送出';
                        const badge = reworkBadge(line);
                        const mark = signedMark(line);
                        const unknown = line.unknown ? '（新品項？）' : '';
                        return `<button type="button" data-action="open-item" data-id="${esc(line.id)}" class="w-full text-left py-2 flex gap-3 items-start active:bg-slate-50 rounded-xl">

                docs = applied.docs;
                render();
                showItemSaved('已退回洗滌重工，保留飯店送出日期與重工標示');
                toast('已退回洗滌重工');
            } catch (error) {
                toast(error.message || '重工沒有存好');
                if (/權限不足/.test(error.message || '')) showBanner(error.message);
            } finally {
                finishSaving();
            }
        }
        function slipLines(key) {
            return docs.filter(item => !item.deleted && item.status === '待洗滌' && `${item.hotel}|${item.returnDate || item.receivedDate}` === key);
        }
        function openWash(key) {
            if (saving || Date.now() < reopenAfter) return;
            const lines = slipLines(key);
            if (!lines.length) return;
            popupSlip = key;
            popupId = null;
            washActual = {};
            for (const line of lines) washActual[line.id] = line.qty;
            document.getElementById('popupTitle').textContent = `${lines[0].hotel}・一起收下`;
            document.getElementById('popupDate').textContent = lines[0].returnDate ? `退回日 ${formatMd(lines[0].returnDate)}` : `飯店送出 ${formatMd(lines[0].receivedDate)}`;
            document.getElementById('popupBadge').textContent = '';
            document.getElementById('popupHistory').textContent = '';
            paintWash(lines);
            document.querySelector('[data-action="close-popup"]').textContent = '取消';
            document.getElementById('itemPopup').classList.remove('hidden');
        }
        function stepWash(id, dir) {
            const line = docs.find(item => item.id === id);
            if (!line) return;
            const next = Math.max(0, (washActual[id] ?? line.qty) + dir);
            washActual[id] = next;
            const label = document.querySelector(`[data-wash-qty="${CSS.escape(id)}"]`);
            if (label) label.textContent = String(next);
        }
        async function confirmWash() {
            if (saving || !popupSlip) return;
            if (!foldPad?.hasInk()) return toast('請先簽名');
            const lines = slipLines(popupSlip);
            try {
                startSaving();
                const time = new Date().toISOString();
                const signature = await storeSignature(foldPad.dataUrl(), lines[0].id, 'wash');
                const applied = signWashBatch(docs, lines.map(item => item.id), { signature, time, actuals: washActual });
                await persist(applied.upserts);
                docs = applied.docs;
                render();
                const flagged = applied.upserts.filter(item => item.discrepancyOpen).map(item => item.item);
                showItemSaved(flagged.length ? `已收下，數量不符已標給辦公室：${flagged.join('、')}` : '已收下', applied.docs.find(item => item.id === lines[0].id));
                toast(flagged.length ? '已收下，並通知辦公室數量不符' : '已收下');
            } catch (error) {
                toast(error.message || '簽名沒有存好');
            } finally { finishSaving(); }
        }
        async function confirmSpread() {
            const doc = currentPopupDoc();
            if (!doc || saving) return;
            if (!foldPad?.hasInk()) return toast('請先簽名');
            try {
                startSaving();
                const time = new Date().toISOString();
                const signature = await storeSignature(foldPad.dataUrl(), doc.id, 'spread');
                const applied = signSpreadItem(docs, doc.id, { signature, time });
                await persist(applied.upserts);
                docs = applied.docs;
                render();
                showItemSaved('已送到摺疊');
                toast('已送到摺疊');
            } catch (error) {
                toast(error.message || '簽名沒有存好');
            } finally { finishSaving(); }
        }
        async function confirmReturn() {
            const doc = currentPopupDoc();
            if (!doc || saving) return;
            if (!foldPad?.hasInk()) return toast('請先簽名');
            try {
                startSaving();
                const time = new Date().toISOString();
                const signature = await storeSignature(foldPad.dataUrl(), doc.id, 'return');
                const applied = returnToWash(docs, doc.id, { qty: returnQty, reason: chosenReason(), signature, time, idFactory: newSpecialId, returnDate: taipeiToday() });
                await persist(applied.upserts);
                docs = applied.docs;
                render();
                showItemSaved('已退回洗滌。飯店送出日不變，洗滌頁掛在今天。');
                toast('已退回洗滌');
            } catch (error) {
                toast(error.message || '沒有退回');
            } finally { finishSaving(); }
        }
        function toggleOfficeCheck(id) {
            if (officeChecked.has(id)) officeChecked.delete(id);
            else officeChecked.add(id);
            renderSheets();
        }
        function stepOffice(id, dir) {
            const doc = docs.find(item => item.id === id);
            if (!doc) return;
            const current = officeActual[id] ?? foldedHandedQty(doc);
            officeActual[id] = Math.max(0, current + dir);
            renderSheets();
        }
        function openOffice(index) {
            const sheets = officeSheets(docs, { hotels, catalog });
            const sheet = sheets[index];
            if (!sheet || sheet.sent) return;
            officeIds = sheet.items.map(item => item.id).filter(id => officeChecked.has(id));
            if (!officeIds.length) return toast('請勾選這次要送出的品項');
            document.getElementById('officePopup').classList.remove('hidden');
            requestAnimationFrame(() => { officePad = setupPad(document.getElementById('officeCanvas')); });
        }
        function sheetLines(ids) {
            return ids.map(id => docs.find(item => item.id === id)).filter(Boolean);
        }
        async function confirmOffice() {
            if (saving) return;
            if (!officePad?.hasInk()) return toast('請先簽名');
            try {
                startSaving();
                await flushOfficeNames();
                await loadConfig(true);
                if (!catalogReady) return toast('盤點品項還沒載入，請稍後再試');
                const lines = sheetLines(officeIds);
                const hotel = lines[0]?.hotel || '';
                const bad = lines.filter(item => !nameMatches(hotel, item.officeName));
                if (bad.length) {
                    document.getElementById('officePopup').classList.add('hidden');
                    officePad = null;
                    document.querySelectorAll('[data-office-for]').forEach(paintOfficeInput);
                    showNameAlert(bad);
                    return;
                }
                const signature = await storeSignature(officePad.dataUrl(), officeIds[0] || 'sheet', 'office');
                const time = new Date().toISOString();
                const received = {};
                for (const item of lines) received[item.id] = officeActual[item.id] ?? foldedHandedQty(item);
                if (!lines.length || lines.some(item => !officeChecked.has(item.id))) return toast('請重新勾選這次要送出的品項');
                const applied = sendSheet(docs, officeIds, { signature, time, schedules, received });
                const records = buildInventoryWrites(applied.upserts.filter(item => Number(item.qty) > 0), catalog.get(hotel), {
                    signature,
                    timestamp: new Date().toLocaleString(),
                });
                await persistSent(applied.upserts, records);
                docs = applied.docs;
                officeIds.forEach(id => { officeChecked.delete(id); delete officeActual[id]; });
                document.getElementById('officePopup').classList.add('hidden');
                officePad = null;
                render();
                toast('已送出，並寫進盤點');
            } catch (error) {
                if (error?.ids) {
                    document.getElementById('officePopup').classList.add('hidden');
                    officePad = null;
                    document.querySelectorAll('[data-office-for]').forEach(paintOfficeInput);
                    showNameAlert(sheetLines(error.ids));
                    return;
                }
                toast(error.message || '沒有送出');
                if (/權限不足/.test(error.message || '')) showBanner(error.message);
            } finally {
                finishSaving();
            }
        }
        document.body.addEventListener('click', event => {
            const button = event.target.closest('[data-action]');
            if (!button || saving) return;
            const action = button.dataset.action;
            if (action === 'open-item') openItem(button.dataset.id);
            else if (action === 'close-popup') closeItem();
            else if (action === 'clear-fold') foldPad?.clear();
            else if (action === 'confirm-sign') confirmSign();
            else if (action === 'confirm-spread') confirmSpread();
            else if (action === 'confirm-wash') confirmWash();
            else if (action === 'confirm-return') confirmReturn();
            else if (action === 'open-wash') openWash(button.dataset.slip);
            else if (action === 'wash-step') stepWash(button.dataset.id, Number(button.dataset.dir));
            else if (action === 'office-check') toggleOfficeCheck(button.dataset.id);
            else if (action === 'office-step') stepOffice(button.dataset.id, Number(button.dataset.dir));
            else if (action === 'confirm-rework') confirmRework();
            else if (action === 'pick-reason') { reason = button.dataset.reason; paintReason(); }
            else if (action === 'step') {
                const doc = currentPopupDoc();
                if (!doc) return;
                const dir = Number(button.dataset.dir);
                const pool = signPoolQty(docs, doc);
                if (button.dataset.which === 'ship') shipQty = Math.min(pool, Math.max(1, shipQty + dir));
                else if (button.dataset.which === 'return') returnQty = Math.min(doc.qty, Math.max(1, returnQty + dir));
                else reworkQty = Math.min(doc.qty, Math.max(1, reworkQty + dir));
                const shipLabel = document.getElementById('shipQtyLabel');
                const reworkLabel = document.getElementById('reworkQtyLabel');
                const returnLabel = document.getElementById('returnQtyLabel');
                if (shipLabel) shipLabel.textContent = String(shipQty);
                if (reworkLabel) reworkLabel.textContent = String(reworkQty);
                if (returnLabel) returnLabel.textContent = String(returnQty);
                paintReason();
            } else if (action === 'close-name-alert') {
                document.getElementById('nameAlert').classList.add('hidden');
            } else if (action === 'open-office') {
                startSaving();
                flushOfficeNames().then(async () => {
                    await syncOfficeTemplateFromSheet();
                    if (!catalogReady) return toast('盤點品項還沒載入，請稍後再試');
                    const sheet = officeSheets(docs, { hotels, catalog })[Number(button.dataset.sheet)];
                    const lines = (sheet?.items || []).filter(item => officeChecked.has(item.id));
                    if (!lines.length) return toast('請勾選這次要送出的品項');
                    const bad = lines.filter(item => !nameMatches(sheet.hotel, item.officeName));
                    document.querySelectorAll('[data-office-for]').forEach(paintOfficeInput);
                    if (bad.length) return showNameAlert(bad);
                    openOffice(Number(button.dataset.sheet));
                }).catch(error => toast(error.message || '品名設定沒有同步')).finally(finishSaving);
            } else if (action === 'close-office') {
                document.getElementById('officePopup').classList.add('hidden');
            } else if (action === 'clear-office') officePad?.clear();
            else if (action === 'confirm-office') confirmOffice();
        });
        let searchTimer, readGeneration=0, specialUnsubscribers=[];
        const dateOffset = days => { const d=new Date(taipeiToday()+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10); };
        document.getElementById('sentStart').value=dateOffset(-7);
        document.getElementById('sentEnd').value=dateOffset(60);
        document.getElementById('foldSearch').addEventListener('input', () => render());
        for(const id of ['sentStart','sentEnd'])document.getElementById(id).addEventListener('change',()=>subscribeSpecial());
        function subscribeSpecial() {
            if(useMock){render();return;}
            if(!db)return;
            const api=window.__specialFs, generation=++readGeneration;
            specialUnsubscribers.forEach(stop=>stop()); specialUnsubscribers=[];
            const plan=departmentReadPlan(mode);
            const plans=[];
            document.getElementById('cardScroller').textContent='查詢中…';
            document.getElementById('sheetList').textContent='查詢中…';
            if(plan.statuses.length===1) plans.push(api.query(api.collection(db,'special_items'),api.where('status','==',plan.statuses[0])));
            else if(plan.statuses.length) plans.push(api.query(api.collection(db,'special_items'),api.where('status','in',plan.statuses)));
            if(plan.upstream?.length) plans.push(api.query(api.collection(db,'special_items'),api.where('status','in',plan.upstream)));
            if(plan.discrepancy) plans.push(api.query(api.collection(db,'special_items'),api.where('discrepancyOpen','==',true)));
            if(plan.sentByShipDate){
                const start=document.getElementById('sentStart').value,end=document.getElementById('sentEnd').value;
                if(!start||!end||start>end){showBanner('請確認已送出出貨日區間');return;}
                const days=ScopedReads.dates(start,end).filter(date=>/^\d{4}-\d{2}-\d{2}$/.test(date));
                for(const group of ScopedReads.chunks(days,30))plans.push(api.query(api.collection(db,'special_items'),api.where('shipDate','in',group)));
            }
            if(!plans.length){render();return;}
            const buckets=new Map();
            plans.forEach((plan,index)=>specialUnsubscribers.push(api.onSnapshot(plan,snap=>{
                if(generation!==readGeneration)return;
                buckets.set(index,snap.docs);
                if(buckets.size!==plans.length)return;
                const merged=new Map();
                const revision=row=>[row.sentAt,row.foldSignedAt,row.createdAt,...(row.history||[]).map(event=>event.time)].filter(Boolean).map(String).sort().pop()||'';
                for(const snapshot of [...buckets.values()].flat()){
                    const row={history:[],...snapshot.data(),id:snapshot.id},old=merged.get(snapshot.id);
                    if(!old||revision(row)>=revision(old))merged.set(snapshot.id,row);
                }
                const nextDocs=[...merged.values()].map(normalizeInFlight);
                if(saving){deferredDocs=nextDocs;return;}
                docs=nextDocs;render();
            },error=>{if(generation===readGeneration)showBanner('特處查詢失敗：'+error.message);}))); 
        }

        async function loadConfig(fromServer = false) {
            if (demo) return;
            if (!db) {
                document.getElementById('configStatus').textContent = `離線清單 ${hotels.length} 間`;
                return;
            }
            const { doc, getDoc, getDocFromServer } = window.__specialFs;
            const snap = await (fromServer ? getDocFromServer : getDoc)(doc(db, 'inventory_config', 'master_template'));
            if (!snap.exists()) throw new Error('沒有飯店清單');
            const data = snap.data();
            const template = Array.isArray(data.items) ? data.items : [];
            const names = template.map(row => String(row.baseName || '').trim()).filter(Boolean);
            const fromSchedules = (data.deliverySchedules || []).map(row => String(row.hotel || '').trim()).filter(Boolean);
            const liveHotels = [...new Set([...names, ...fromSchedules])];
            if (liveHotels.length) hotels = liveHotels;
            catalog = inventoryCatalog(template);
            catalogReady = true;
            templateFingerprint = JSON.stringify(template);
            schedules = Array.isArray(data.deliverySchedules) ? data.deliverySchedules : [];
            document.getElementById('configStatus').textContent = `飯店 ${hotels.length} 間`;
        }
        async function syncOfficeTemplateFromSheet() {
            if (demo || useMock) return;
            if (!db) throw new Error('無法連上資料庫，試算表品名沒有同步');
            const response = await fetch(`${SHEET_URL}?action=getInventoryData&t=${Date.now()}`, { cache: 'no-store' });
            if (!response.ok) throw new Error('試算表讀取失敗，請稍後再試');
            const data = await response.json();
            const rows = data.template;
            if (!Array.isArray(rows) || !rows.length || !rows.every(row => row && row.baseName && row.hotel && row.item)) {
                throw new Error(data.error || '試算表品項不完整，沒有更新盤點設定');
            }
            if (JSON.stringify(rows) !== templateFingerprint) {
                const { doc, setDoc } = window.__specialFs;
                await setDoc(doc(db, 'inventory_config', 'master_template'), { items: rows }, { merge: true });
                await loadConfig(true);
            }
        }
        async function boot() {
            if (demo) {
                docs = readDemo() || demoDepartmentDocs();
                hotels = [...new Set(docs.map(item => item.hotel))];
                catalog = inventoryCatalog(docs.map(item => ({
                    baseName: item.hotel,
                    hotel: `${item.hotel} 特處`,
                    item: item.officeName || item.item,
                    deptName: '特處',
                })));
                catalogReady = true;
                schedules = [{ hotel: '驛館', department: '特處', days: '二四六日', rule: '收件後的下一個收送日' }];
                document.getElementById('configStatus').textContent = `飯店 ${hotels.length} 間`;
                document.getElementById('mockBanner').classList.remove('hidden');
                document.getElementById('mockBanner').textContent = '示範資料：只在這個畫面，不會寫進資料庫。';
                render();
                return;
            }
            if (useMock) document.getElementById('mockBanner').classList.remove('hidden');
            docs = useMock ? readMock() : [];
            render();
            try {
                const appMod = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js');
                const fsMod = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js');
                const stMod = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js');
                window.__specialFs = fsMod;
                window.__specialSt = stMod;
                const app = appMod.initializeApp({
                    apiKey: 'AIzaSyBEXcnXOKRags29CvhM6TKe3N-zty-ela4',
                    authDomain: 'hotel-inventory-3a1ad.firebaseapp.com',
                    projectId: 'hotel-inventory-3a1ad',
                    storageBucket: 'hotel-inventory-3a1ad.firebasestorage.app',
                    messagingSenderId: '363844184412',
                    appId: '1:363844184412:web:66cdd6425d53bde75f3999',
                });
                db = fsMod.initializeFirestore(app, { localCache: fsMod.memoryLocalCache(), experimentalForceLongPolling: true });
                storage = stMod.getStorage(app);
                await loadConfig();
                if (!useMock) {
                    subscribeSpecial();
                }
            } catch (error) {
                console.warn(error);
                document.getElementById('configStatus').textContent = `離線清單 ${hotels.length} 間`;
                if (!useMock) showBanner('連不上資料庫。可以先看畫面；正式寫入需要網路與 Firebase 權限。');
            }
            render();
        }
        boot();
    </script>
