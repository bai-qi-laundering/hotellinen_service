<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>百麒｜財務管理系統</title>
<style>
:root{color-scheme:light;--green:#315e4c;--line:#dfe7e0;--bg:#f4f6f2}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#25362f;background:var(--bg)}body{display:flex;flex-direction:column}.header{background:#fff;border-bottom:1px solid var(--line);padding:12px max(16px,calc((100vw - 1400px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:800;font-size:17px;letter-spacing:.03em}.sub{font-size:11px;color:#738278;margin-top:3px}.tabs{display:flex;gap:6px;background:#eef2ed;padding:4px;border-radius:12px}.tab{border:0;border-radius:9px;background:transparent;color:#456052;font-size:14px;font-weight:750;padding:10px 15px;cursor:pointer}.tab[aria-selected=true]{background:var(--green);color:#fff;box-shadow:0 2px 6px #0001}.notice{background:#e7f2ea;color:#1f5b3a;border-bottom:1px solid #d5e6d8;font-size:12px;padding:9px 16px;text-align:center}.panels{position:relative;flex:1;min-height:0}.panel{position:absolute;inset:0;display:none}.panel.active{display:block}iframe{width:100%;height:100%;border:0;background:#fff}.help{font-size:12px;color:#718077;text-decoration:none}@media(max-width:600px){.header{padding:10px 12px}.brand{font-size:15px}.tabs{width:100%}.tab{flex:1}.notice{font-size:11px;text-align:left}}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;border-radius:0;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:white;border-top:1px solid var(--line)}body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}.tab{flex:1;max-width:380px}@media(max-width:600px){.tab{padding:10px 5px;font-size:13px}}
</style></head><body>
<div class="header"><div><div class="brand">百麒｜財務管理系統</div><div class="sub">結帳 · 送件 · 貨款登記</div></div><nav class="tabs" role="tablist" aria-label="功能切換"><button class="tab" id="tab-finance" role="tab" aria-selected="true" aria-controls="panel-finance">結帳戰情系統</button><button class="tab" id="tab-dispatch" role="tab" aria-selected="false" aria-controls="panel-dispatch">對帳單送件中心</button><button class="tab" id="tab-payments" role="tab" aria-selected="false" aria-controls="panel-payments">貨款登記</button></nav></div>
<div class="notice">產生對帳單後會出現在送件中心。請核對、取得 Excel 或 PDF，再用 LINE 傳給客戶。傳完按「我已寄出」登記。系統不會自動傳 LINE。</div>
<main class="panels"><section class="panel active" id="panel-finance" role="tabpanel" aria-labelledby="tab-finance"><iframe title="結帳戰情系統" src="./finance.html?v=20261030-manual-dispatch-fix" loading="eager"></iframe></section><section class="panel" id="panel-dispatch" role="tabpanel" aria-labelledby="tab-dispatch"><iframe title="對帳單送件中心" src="./statement-dispatch.html?v=20261031b-ledger" loading="lazy"></iframe></section><section class="panel" id="panel-payments" role="tabpanel" aria-labelledby="tab-payments"><iframe title="貨款登記" src="./receivables.html?v=20261031b" loading="lazy"></iframe></section></main>
<script>
const tabs=[['finance','panel-finance'],['dispatch','panel-dispatch'],['payments','panel-payments']];
function activate(which){for(const [id,panel] of tabs){const active=id===which;document.getElementById('tab-'+id).setAttribute('aria-selected',String(active));document.getElementById(panel).classList.toggle('active',active)}if(which==='dispatch'||which==='payments'){const frame=document.querySelector('#panel-'+which+' iframe');try{frame.contentWindow?.postMessage({type:'baiqi-refresh-statements'},location.origin)}catch(err){}}history.replaceState(null,'','#'+which)}
for(const [id] of tabs)document.getElementById('tab-'+id).addEventListener('click',()=>activate(id));
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;if(event.data?.type==='baiqi-statement-published'){const frame=document.querySelector('#panel-dispatch iframe');try{frame.contentWindow?.postMessage({type:'baiqi-refresh-statements'},location.origin)}catch(err){}}});
activate(['dispatch','payments'].includes(location.hash.slice(1))?location.hash.slice(1):'finance');
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='baiqi-ledger-updated'){for(const id of ['dispatch','payments'])document.querySelector('#panel-'+id+' iframe').contentWindow?.postMessage({type:'baiqi-ledger-updated'},location.origin);}});
</script></body></html>
