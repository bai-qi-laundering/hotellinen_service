<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>百麒｜財務管理系統</title>
<style>
:root{color-scheme:light;--green:#315e4c;--line:#dfe7e0;--bg:#f4f6f2}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#25362f;background:var(--bg)}body{display:flex;flex-direction:column}.header{background:#fff;border-bottom:1px solid var(--line);padding:12px max(16px,calc((100vw - 1400px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:800;font-size:17px;letter-spacing:.03em}.sub{font-size:11px;color:#738278;margin-top:3px}.tabs{display:flex;gap:6px;background:#eef2ed;padding:4px;border-radius:12px}.tab{border:0;border-radius:9px;background:transparent;color:#456052;font-size:14px;font-weight:750;padding:10px 15px;cursor:pointer}.tab[aria-selected=true]{background:var(--green);color:#fff;box-shadow:0 2px 6px #0001}.notice{background:#fff7e8;color:#8b632d;border-bottom:1px solid #f1e3c9;font-size:12px;padding:9px 16px;text-align:center}.panels{position:relative;flex:1;min-height:0}.panel{position:absolute;inset:0;display:none}.panel.active{display:block}iframe{width:100%;height:100%;border:0;background:#fff}.help{font-size:12px;color:#718077;text-decoration:none}@media(max-width:600px){.header{padding:10px 12px}.brand{font-size:15px}.tabs{width:100%}.tab{flex:1}.notice{font-size:11px;text-align:left}}
</style></head><body>
<div class="header"><div><div class="brand">百麒｜財務管理系統</div><div class="sub">兩個功能，同一個網頁切換</div></div><nav class="tabs" role="tablist" aria-label="功能切換"><button class="tab" id="tab-finance" role="tab" aria-selected="true" aria-controls="panel-finance">結帳戰情系統</button><button class="tab" id="tab-dispatch" role="tab" aria-selected="false" aria-controls="panel-dispatch">對帳單送件中心</button></nav></div>
<div class="notice">正式財務入口：結帳功能連接現有資料；送件中心目前僅為示範，尚不能實際寄送。</div>
<main class="panels"><section class="panel active" id="panel-finance" role="tabpanel" aria-labelledby="tab-finance"><iframe title="結帳戰情系統" src="./finance.html?v=20261030-logistics-cache-fallback" loading="eager"></iframe></section><section class="panel" id="panel-dispatch" role="tabpanel" aria-labelledby="tab-dispatch"><iframe title="對帳單送件中心" src="./statement-dispatch.html" loading="lazy"></iframe></section></main>
<script>
const tabs=[['finance','panel-finance'],['dispatch','panel-dispatch']];
function activate(which){for(const [id,panel] of tabs){const active=id===which;document.getElementById('tab-'+id).setAttribute('aria-selected',String(active));document.getElementById(panel).classList.toggle('active',active)}history.replaceState(null,'','#'+which)}
for(const [id] of tabs)document.getElementById('tab-'+id).addEventListener('click',()=>activate(id));
activate(location.hash==='#dispatch'?'dispatch':'finance');
</script></body></html>
