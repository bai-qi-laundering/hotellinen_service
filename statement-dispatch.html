<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>百麒｜對帳單送件中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{--bg:#f5f6f2;--ink:#24332f;--muted:#74827a;--line:#e1e7df;--green:#315e4c;--warm:#b78b55;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
button,select,input{font:inherit}
button{cursor:pointer}
header{background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:auto;padding:24px}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--green);font-weight:700}
h1{font-family:"Noto Serif TC",serif;font-size:30px;margin:8px 0}
p{line-height:1.6}
.muted{color:var(--muted)}
.live{border:1px solid #b7d4c3;background:#e7f2ea;color:#1f5b3a;padding:9px 12px;border-radius:9px;font-size:12px;font-weight:700}
.intro{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.filter{background:white;border:1px solid var(--line);padding:10px 15px;border-radius:100px;color:var(--ink)}
.filter.active{background:var(--green);color:white}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 5px 22px #203b2b08}
.top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.hotel{font-size:21px;font-weight:750}
.period{color:var(--muted);font-size:13px;margin-top:7px}
.status{font-size:12px;background:#f0f3f0;padding:7px 10px;border-radius:20px;white-space:nowrap}
.status.warn{background:#fbf1df;color:#95651f}
.status.ok{background:#e8f4eb;color:#286245}
.amount{font-size:28px;font-weight:750;letter-spacing:-.02em;margin:20px 0 17px}
.meta{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px;font-size:13px}
.meta-row{display:flex;justify-content:space-between;gap:14px}
.meta-row span:first-child{color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.btn.wide{grid-column:1 / -1}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px 8px;font-weight:700;color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:white}
.btn:disabled{opacity:.55;cursor:not-allowed}
.note{font-size:12px;color:var(--muted);margin-top:13px}
.banner{background:#fff7e8;color:#8b632d;border:1px solid #f1e3c9;border-radius:12px;padding:12px 14px;margin-top:16px;font-size:14px;font-weight:700}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center}
.overlay{position:fixed;inset:0;background:#17251bb3;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.dialog{background:white;width:min(100%,480px);border-radius:19px;padding:24px;max-height:90vh;overflow:auto}
.dialog h2{margin:0 0 9px;font-size:22px}
.dialog select,.dialog input,.dialog textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:white;margin:10px 0 16px}
.dialog textarea{min-height:72px;resize:vertical}
.subtle{font-size:13px;color:var(--muted)}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.modal-actions .btn{flex:1}
.preview{position:fixed;inset:0;background:#edf0ed;z-index:20;display:none;flex-direction:column}
.preview.show{display:flex}
.preview-head{background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px}
.preview-head button{background:transparent;border:0;font-size:15px;font-weight:700;color:var(--green);min-height:44px}
.scroll{overflow:auto;flex:1;-webkit-overflow-scrolling:touch;container-type:inline-size}
.foot{font-size:12px;color:#88948a;text-align:center;padding:8px 0 20px}
@font-face{font-family:'BaiqiGeorgiaDigits';src:local('Georgia');unicode-range:U+0030-0039}
/* 預覽與列印沿用結帳系統舊版對帳單的版面，不再用較窄的 13px 表格。 */
.paper{box-sizing:border-box;width:210mm;max-width:none;margin:22px auto;padding:12mm;background:#fffefa;color:#293d38;box-shadow:0 8px 35px #0001}
.paper .report-page{box-sizing:border-box;width:100%;padding:0;background:#fffefa;color:#293d38;font-family:'BaiqiGeorgiaDigits','Noto Serif TC','Source Han Serif TC','思源宋體','PMingLiU',serif;font-size:15px;font-weight:700;line-height:1.48}
.paper .report-page,.paper .report-page *{font-family:'BaiqiGeorgiaDigits','Noto Serif TC','Source Han Serif TC','思源宋體','PMingLiU',serif;font-variant-numeric:lining-nums;text-rendering:optimizeLegibility}
.paper .report-overview .invoice-header{margin-bottom:10px;padding-bottom:8px}
.paper .report-overview .info-boxes{margin-bottom:8px;gap:10px}
.paper .report-overview .info-box-title{padding:5px 10px}
.paper .report-overview .info-table td{padding:4px 8px;font-size:14px;line-height:1.25}
.paper .report-overview .report-section-title{padding:6px 10px;margin:9px 0 6px}
.paper .report-overview .data-table{margin-bottom:10px}
.paper .report-overview .report-totals{margin-top:10px;width:330px}
.paper .report-overview .report-totals > div{font-size:15px}
.paper .report-overview .report-totals .report-grand{font-size:20px}
.paper .report-overview .data-table th{padding:7px 8px;font-size:16px}
.paper .report-overview .data-table td{padding:6px 8px;font-size:16px;line-height:1.25}
.paper .invoice-header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2.5px solid #b69b68;padding:0 0 13px;margin:0 0 19px}
.paper .invoice-title{font-size:27px;line-height:1.25;font-weight:900;letter-spacing:1.1px;color:#173c36}
.paper .report-heading{font-size:22px;line-height:1.3;font-weight:900;letter-spacing:1px;color:#173c36;white-space:nowrap}
.paper .report-dept-meta{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:0 0 17px;color:#50645d;font-size:15px}
.paper .report-dept-meta b{font-size:20px;color:#173c36;font-weight:900}
.paper .report-section-title{font-size:19px;line-height:1.35;letter-spacing:.5px;font-weight:900;color:#173c36;background:#f5f0e5;border-left:5px solid #b69b68;padding:10px 13px;margin:19px 0 11px}
.paper .info-boxes{display:flex;gap:13px;margin-bottom:18px}
.paper .info-box{flex:1;min-width:0;background:#fffefa;border:1px solid #d8cdb6;border-radius:7px;overflow:hidden}
.paper .info-box-title{color:#fff;background:#173c36;padding:10px 12px;font-size:15px;font-weight:900;letter-spacing:.5px}
.paper .info-table{width:100%;border-collapse:collapse;margin:0}
.paper .info-table td{font-size:15px;padding:10px 11px;line-height:1.4;color:#293d38;border:0;border-bottom:1px solid #e9e3d8;text-align:left;overflow-wrap:anywhere}
.paper .info-table td:first-child{width:102px;background:#f9f6ef;font-weight:900;color:#38564a;border-right:1px solid #e9e3d8}
.paper .data-table,.paper .detail-table{width:100%;border-collapse:collapse;margin-bottom:15px;font-size:17px}
.paper .data-table th,.paper .detail-table th{background:#173c36;color:#fff;border:1px solid #173c36;padding:12px 9px;font-size:17px;font-weight:900;line-height:1.4;text-align:center}
.paper .data-table td,.paper .detail-table td{color:#243b33;border:1px solid #d9dfd8;padding:11px 9px;font-size:17px;line-height:1.45;font-weight:800;text-align:center}
.paper tbody tr:nth-child(even):not(.total-row){background:#f8f8f2}
.paper .total-row td{background:#eaf0e8;color:#173c36;font-size:15px;font-weight:900;border-top:2px solid #b69b68}
.paper .monthly-table td:nth-child(n+2),.paper .detail-table td:first-child,.paper .detail-table td:nth-child(n+3),.paper .report-totals b{font-variant-numeric:tabular-nums lining-nums;letter-spacing:.2px}
.paper .report-totals{box-sizing:border-box;margin:20px 0 0 auto;width:370px;max-width:100%;background:#f8f5ed;border:1px solid #d8c9a8;border-top:3px solid #b69b68;border-radius:7px;padding:13px 17px}
.paper .report-totals > div{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:8px 0;font-size:16px}
.paper .report-totals .report-grand{border-top:1.5px solid #b69b68;color:#173c36;font-size:21px;font-weight:900;padding-top:12px}
.paper .report-department{margin-top:28px;padding-top:16px;border-top:1px dashed #d8cdb6}
@media(max-width:720px){
 .wrap{padding:19px 16px}
 .head,.intro{align-items:flex-start;display:block}
 .head h1{font-size:24px}
 .grid{grid-template-columns:1fr}
 .card{padding:19px}
 .amount{font-size:26px}
 .overlay{padding:12px}
 .preview-head{align-items:flex-start;flex-wrap:wrap;padding:12px 14px}
}
@media(max-width:900px){
 .paper{zoom:min(1, calc(100cqw / 210mm));margin:8px auto}
}
@media print{
 @page{size:A4 portrait;margin:0}
 html,body{margin:0 !important;padding:0 !important;background:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body:has(#preview.show) header,body:has(#preview.show) main,body:has(#preview.show) .overlay{display:none !important}
 #preview.show{display:block !important;position:static !important;inset:auto !important;background:#fff !important;overflow:visible !important;height:auto !important}
 #preview.show .preview-head{display:none !important}
 #preview.show .scroll{display:block !important;overflow:visible !important;height:auto !important}
 #preview.show .paper{zoom:1 !important;box-shadow:none !important;margin:0 !important;width:auto !important;min-width:0 !important;max-width:none !important;padding:12mm !important;background:#fffefa !important}
 #preview.show .paper .report-department{margin:0 !important;padding:0 !important;border:0 !important;break-before:page !important;page-break-before:always !important;break-inside:auto;page-break-inside:auto}
 #preview.show .paper .report-page .monthly-table tr,#preview.show .paper .report-page .detail-table tr{page-break-inside:avoid;break-inside:avoid}
 #preview.show .paper .data-table thead,#preview.show .paper .detail-table thead{display:table-header-group}
 #preview.show .paper .invoice-header,#preview.show .paper .report-dept-meta,#preview.show .paper .report-section-title{break-after:avoid;page-break-after:avoid}
 #preview.show .paper .report-totals{break-inside:avoid;page-break-inside:avoid}
}
</style>
</head>
<body>
<header>
 <div class="wrap head">
  <div>
   <div class="eyebrow">BAI QI · FINANCE</div>
   <h1>對帳單送件中心</h1>
   <div class="muted" style="font-size:13px">核對同一份帳單 · 取得 Excel 或 PDF · 用 LINE 寄出後登記</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
   <div class="live">正式送件清單</div>
   <button class="btn" id="einvoiceTest" type="button">測試電子發票連線</button>
  </div>
 </div>
</header>
<main class="wrap">
 <section id="unsent-dashboard" aria-label="未送對帳單"></section>
 <div class="intro">
  <div>
   <h2 style="font-size:19px;margin-bottom:5px">待處理帳單</h2>
   <p class="muted" style="font-size:13px;margin-top:0">這裡是財務系統按「產生對帳單」後送過來的帳單。系統不會自動傳 LINE。下載或打開分享，都不算寄出，要等您傳完再按「我已寄出」。</p>
  </div>
  <button class="btn" id="refresh" type="button">重新整理</button>
 </div>
 <div id="banner" class="banner" hidden></div>
 <div class="filters">
  <button class="filter active" data-filter="all" type="button">全部</button>
  <button class="filter" data-filter="pending" type="button">待寄送</button>
  <button class="filter" data-filter="resend" type="button">新版待重寄</button>
  <button class="filter" data-filter="sent" type="button">已登記寄送</button>
  <button class="filter" data-filter="needs_review" type="button">開票後有變</button>
 </div>
 <div class="grid" id="cards" data-testid="dispatch-cards"></div>
 <p class="foot">同一家飯店、同一個結帳區間只留一份案件。內容沒變就不會重複新增；內容有變會變成新版本。已寄出的舊版紀錄會保留。</p>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
 <div class="dialog">
  <h2 id="dialogTitle">確認送出</h2>
  <div id="dialogBody" data-testid="send-dialog"></div>
  <div class="modal-actions">
   <button class="btn" id="cancel" type="button">返回</button>
   <button class="btn primary" id="next" type="button">繼續</button>
  </div>
 </div>
</div>
<div class="preview" id="preview" role="dialog" aria-modal="true" aria-label="對帳單內容">
 <div class="preview-head">
  <strong id="previewTitle">對帳單</strong>
  <div>
   <button id="printStatement" type="button">列印 / 存 PDF</button>
   <button id="closePreview" type="button">關閉預覽 ✕</button>
  </div>
 </div>
 <div class="scroll"><div class="paper" id="previewPaper" data-testid="statement-preview"></div></div>
</div>
<script type="module">
import {
    STATUS_LABELS,
    buildStatementWorkbook,
    formatCardAmount,
    formatPeriod,
    latestVersion,
    payableAmount,
    renderStatementHtml,
    statementFileBase,
    dispatchHotelName,
} from './statement-case.js?v=20261031-logistics-name';
import { createFirestoreRepository, createLocalRepository } from './statement-store.js?v=20261030-statement-dispatch';
import { handoffStatementFile, isPhoneShareDevice } from './statement-file-delivery.js?v=20261031-share-fix';
import { mountUnsentDashboard } from './unsent-dashboard.js?v=20261031-einvoice';
import { quoteInvoice } from './firebase-signature/functions/lib/einvoice-amount.js?v=20261031-einvoice';

const params = new URLSearchParams(location.search);
const localOnly = params.get('store') === 'local';
const $ = id => document.getElementById(id);
let repo = null;
let cases = [];
let activeFilter = 'all';
let selected = null;
let chosenFormat = 'xlsx';
let busy = false;
let itemTemplate = [];
let unsentDashboard = null;
let repoDb = null;
let repoFs = null;
let firebaseApp = null;

function taipeiStamp(iso) {
    if (!iso) return '';
    return new Intl.DateTimeFormat('zh-TW', {
        timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false,
    }).format(new Date(iso));
}
function showBanner(text) {
    const banner = $('banner');
    banner.hidden = !text;
    banner.textContent = text || '';
}
async function setup() {
    if (localOnly) {
        repo = createLocalRepository(localStorage);
        showBanner('這是只看這台電腦的檢查模式，不是正式送件清單。');
        return;
    }
    const appMod = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js');
    const fsMod = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js');
    firebaseApp = appMod.initializeApp({
        apiKey: 'AIzaSyBEXcnXOKRags29CvhM6TKe3N-zty-ela4',
        authDomain: 'hotel-inventory-3a1ad.firebaseapp.com',
        projectId: 'hotel-inventory-3a1ad',
        storageBucket: 'hotel-inventory-3a1ad.firebasestorage.app',
        messagingSenderId: '363844184412',
        appId: '1:363844184412:web:66cdd6425d53bde75f3999',
    });
    const db = fsMod.initializeFirestore(firebaseApp, { localCache: fsMod.memoryLocalCache() });
    repoDb = db;
    repoFs = fsMod;
    repo = createFirestoreRepository(db, {
        doc: fsMod.doc,
        runTransaction: fsMod.runTransaction,
        collection: fsMod.collection,
        getDocsFromServer: fsMod.getDocsFromServer,
    }, localStorage);
    try {
        const template = await fsMod.getDoc(fsMod.doc(db, 'inventory_config', 'master_template'));
        itemTemplate = template.exists() ? (template.data().items || []) : [];
    } catch (error) {
        console.warn('品項順序暫用帳單原本的順序', error);
        itemTemplate = [];
    }
}
function visibleCases() {
    return cases.filter(item => activeFilter === 'all' || item.state === activeFilter);
}
function render() {
    const list = visibleCases();
    const cards = $('cards');
    cards.replaceChildren();
    if (!list.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.dataset.testid = 'dispatch-empty';
        empty.textContent = cases.length
            ? '這個分類目前沒有帳單。'
            : '還沒有對帳單。結帳日早上 09:30 會自動產生；也可以到「結帳戰情系統」手動產生。完成後會出現在這裡。';
        cards.append(empty);
        return;
    }
    for (const item of list) {
        const version = latestVersion(item);
        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.testid = 'dispatch-card';
        const top = document.createElement('div');
        top.className = 'top';
        const titles = document.createElement('div');
        const hotel = document.createElement('div');
        hotel.className = 'hotel';
        hotel.textContent = dispatchHotelName(item);
        const period = document.createElement('div');
        period.className = 'period';
        period.textContent = formatPeriod(item.startDate, item.endDate);
        titles.append(hotel, period);
        const status = document.createElement('span');
        status.className = 'status' + (item.state === 'sent' ? ' ok' : item.state === 'pending' ? '' : ' warn');
        status.textContent = STATUS_LABELS[item.state] || item.state;
        top.append(titles, status);
        const amount = document.createElement('div');
        amount.className = 'amount';
        amount.textContent = version ? formatCardAmount(payableAmount(version.snapshot)) : '';
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.append(
            metaRow('LINE 收件名稱', item.lineRecipient || '尚未填寫'),
            metaRow('帳單版本', version ? `V${version.version}` : ''),
            metaRow('寄送格式', version?.sentFormat === 'pdf' ? 'PDF' : version?.sentFormat === 'xlsx' ? 'Excel' : '送出時選擇'),
        );
        const activeInvoice = item.invoiceStatus === 'invoiced' && (item.invoiceNumber || item.invoiceRecord?.number);
        const invoicedThisVersion = activeInvoice && Number(item.invoicedVersion) === Number(item.latestVersion);
        if (activeInvoice) meta.append(metaRow('發票號碼', invoicedThisVersion ? (item.invoiceNumber || item.invoiceRecord.number) : `${item.invoiceNumber || item.invoiceRecord.number}（上一版）`));
        const older = (item.versions || []).filter(row => row.version < item.latestVersion && row.sentAt);
        const actions = document.createElement('div');
        actions.className = 'actions';
        const preview = document.createElement('button');
        preview.className = 'btn preview-btn';
        preview.type = 'button';
        preview.textContent = '核對帳單';
        preview.onclick = () => showPreview(item);
        const send = document.createElement('button');
        send.className = 'btn primary send-btn';
        send.type = 'button';
        send.textContent = item.state === 'needs_review' ? '先不要寄' : item.state === 'sent' ? '再次取得檔案' : '確認送出';
        send.disabled = item.state === 'needs_review';
        send.onclick = () => showSend(item);
        const invoiceBtn = document.createElement('button');
        invoiceBtn.type = 'button';
        invoiceBtn.className = 'btn wide';
        if (invoicedThisVersion) {
            invoiceBtn.disabled = true;
            invoiceBtn.textContent = `已開立 ${item.invoiceNumber || item.invoiceRecord?.number || ''}`.trim();
        } else if (activeInvoice) {
            invoiceBtn.disabled = true;
            invoiceBtn.textContent = '請先作廢上一版發票';
        } else {
            invoiceBtn.textContent = '開立發票';
            invoiceBtn.onclick = () => showInvoice(item);
        }
        actions.append(preview, send, invoiceBtn);
        if (activeInvoice && item.provider === 'universalec') {
            const voidBtn = document.createElement('button');
            voidBtn.type = 'button';
            voidBtn.className = 'btn wide';
            voidBtn.textContent = '作廢發票';
            voidBtn.onclick = () => showVoid(item);
            actions.append(voidBtn);
        }
        const note = document.createElement('div');
        note.className = 'note';
        const notes = [];
        const unsignedReceipts = Number(item.autoGeneration?.unsignedReceiptCount) || 0;
        if (unsignedReceipts > 0) notes.push(`產生時有 ${unsignedReceipts} 張簽收單還沒簽名，金額仍含這些出貨。之後補簽名不會自動改這份帳單；要更新請到結帳戰情系統手動產生新版本。`);
        if (item.cloudPending) notes.push('這份還在補送雲端，其他電腦暫時看不到。請按重新整理。');
        if (older.length) notes.push(`上一版 V${older[older.length - 1].version} 已於 ${taipeiStamp(older[older.length - 1].sentAt)} 登記寄出。`);
        if (item.state === 'needs_review') notes.push('這份以前已開過票。新內容不能蓋掉舊帳，請先跟老闆確認差異，不要直接寄出。');
        else if (item.state === 'sent') notes.push(`已於 ${taipeiStamp(version?.sentAt)} 登記寄出。再次取得檔案不會改掉這個紀錄。`);
        else notes.push('核對的是這一份帳單。Excel 或 PDF 在送出時選擇，傳完 LINE 再登記。');
        note.textContent = notes.join('');
        card.append(top, amount, meta, actions, note);
        cards.append(card);
    }
}
function metaRow(label, value) {
    const row = document.createElement('div');
    row.className = 'meta-row';
    const span = document.createElement('span');
    span.textContent = label;
    const strong = document.createElement('strong');
    strong.textContent = value;
    row.append(span, strong);
    return row;
}
function showPreview(item) {
    const version = latestVersion(item);
    if (!version) return;
    $('previewTitle').textContent = `${dispatchHotelName(item)} · V${version.version}`;
    $('previewPaper').innerHTML = renderStatementHtml(version.snapshot, itemTemplate);
    $('preview').classList.add('show');
    document.body.style.overflow = 'hidden';
}
function closePreview() {
    $('preview').classList.remove('show');
    document.body.style.overflow = '';
}
function showSend(item) {
    selected = item;
    chosenFormat = 'xlsx';
    const version = latestVersion(item);
    $('dialogTitle').textContent = `確認送出 · ${dispatchHotelName(item)}`;
    $('dialogBody').replaceChildren();
    const intro = document.createElement('p');
    intro.className = 'subtle';
    intro.textContent = item.state === 'sent'
        ? '這一版已經登記寄出。可以再次取得同一份檔案。下載不等於再寄一次，狀態不會被清掉。'
        : '請確認 LINE 收件人與檔案格式。下一步只準備檔案，不會自動傳 LINE，也不會把這份改成已寄出。';
    const label = document.createElement('p');
    label.innerHTML = '<strong>LINE 收件名稱</strong>';
    const input = document.createElement('input');
    input.id = 'recipientName';
    input.value = item.lineRecipient || '';
    input.maxLength = 80;
    input.setAttribute('aria-label', 'LINE 收件名稱');
    const formatLabel = document.createElement('label');
    formatLabel.htmlFor = 'format';
    formatLabel.innerHTML = '<strong>本次檔案格式</strong>';
    const select = document.createElement('select');
    select.id = 'format';
    select.innerHTML = '<option value="xlsx">Excel（.xlsx）</option><option value="pdf">PDF（用列印存檔）</option>';
    const hint = document.createElement('p');
    hint.className = 'subtle';
    hint.textContent = version ? `現在準備的是 V${version.version}。核對畫面與檔案都來自同一份結帳內容。` : '';
    $('dialogBody').append(intro, label, input, formatLabel, select, hint);
    $('next').hidden = false;
    $('next').textContent = item.state === 'sent' ? '取得檔案' : '下一步：準備檔案';
    $('next').onclick = () => prepareAndContinue();
    $('overlay').classList.add('show');
}
async function prepareAndContinue() {
    if (!selected || busy) return;
    const name = $('recipientName')?.value.trim() || '';
    if (!name) { alert('請先填 LINE 收件名稱，同事才知道要傳給誰。'); return; }
    chosenFormat = $('format')?.value || 'xlsx';
    const expected = selected.latestVersion;
    // 分享與列印都要留在這次點擊裡。先交出檔案，再等收件人寫入。
    let handoff;
    try { handoff = beginPrepareFile(selected, chosenFormat); }
    catch (error) { handoff = Promise.reject(error); }
    const handoffResult = handoff.then(
        () => ({ ok: true }),
        error => ({ ok: false, error }),
    );
    busy = true;
    $('next').disabled = true;
    try {
        const savePromise = repo.saveRecipient(selected.id, name);
        try { await savePromise; }
        catch (error) { if (!error.queued) throw error; }
        selected.lineRecipient = name;
        const delivered = await handoffResult;
        if (!delivered.ok) throw delivered.error;
        if (selected.state === 'sent') {
            $('overlay').classList.remove('show');
            await reload();
            return;
        }
        showSentConfirm(expected);
    } catch (error) {
        alert(error.message || String(error));
    } finally {
        busy = false;
        $('next').disabled = false;
    }
}
function showSentConfirm(expectedVersion) {
    $('dialogTitle').textContent = '請先用 LINE 傳出，再登記';
    $('dialogBody').replaceChildren();
    const text = document.createElement('p');
    text.textContent = chosenFormat === 'pdf'
        ? '請用剛剛的列印畫面把這份存成 PDF，再用 LINE 傳給上面的收件人。'
        : 'Excel 已準備好。請用 LINE 把這個檔案傳給上面的收件人。';
    const warn = document.createElement('p');
    warn.className = 'subtle';
    warn.textContent = '下載、開啟分享或列印，都不代表客戶已經收到。只有您真的傳出去之後，才按下面的按鈕。';
    $('dialogBody').append(text, warn);
    $('next').textContent = '我已用 LINE 寄出，登記';
    $('next').dataset.testid = 'mark-sent';
    $('next').onclick = () => markSent(expectedVersion);
}
function beginPrepareFile(item, format) {
    const version = latestVersion(item);
    if (!version) throw new Error('找不到帳單內容。');
    const mobile = isPhoneShareDevice(navigator);
    if (format === 'pdf') {
        showPreview(item);
        return handoffStatementFile({
            format: 'pdf',
            mobile,
            print: () => window.print(),
        });
    }
    if (!window.XLSX) throw new Error('Excel 元件還沒載入，請稍後再試。');
    const workbook = buildStatementWorkbook(window.XLSX, version.snapshot, itemTemplate);
    const filename = `${statementFileBase(version.snapshot)}.xlsx`;
    const bytes = window.XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
    const file = new File([bytes], filename, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    return handoffStatementFile({
        format: 'xlsx',
        mobile,
        file,
        filename,
        download: () => window.XLSX.writeFile(workbook, filename),
        share: typeof navigator.share === 'function' ? data => navigator.share(data) : undefined,
        canShare: typeof navigator.canShare === 'function' ? data => navigator.canShare(data) : undefined,
    });
}
async function markSent(expectedVersion) {
    if (!selected || busy) return;
    busy = true;
    $('next').disabled = true;
    try {
        await repo.register(selected.id, expectedVersion, chosenFormat, new Date().toISOString());
        window.dispatchEvent(new Event("baiqi-sent-registered"));
        window.parent.postMessage({type:"baiqi-ledger-updated"},location.origin);
        $('overlay').classList.remove('show');
        await reload();
    } catch (error) {
        alert(error.queued
            ? '這台電腦已先記住寄出登記，雲端稍後會再補上。請按重新整理確認。'
            : (error.message || String(error)));
        if (error.queued) {
            $('overlay').classList.remove('show');
            await reload();
        }
    } finally {
        busy = false;
        $('next').disabled = false;
    }
}
async function reload() {
    if (!repo) return;
    $('refresh').disabled = true;
    try {
        const result = repo.cloud ? await repo.list() : { cases: await repo.list(), cloudError: null, fromCache: false };
        cases = result.cases || [];
        if (localOnly) showBanner('這是只看這台電腦的檢查模式，不是正式送件清單。');
        else if (result.fromCache) showBanner('雲端暫時讀不到。現在先顯示這台電腦留著的清單，請按重新整理。');
        else if (cases.some(item => item.cloudPending)) showBanner('有帳單還在補送雲端，其他電腦暫時看不到。請稍後按重新整理。');
        else showBanner('');
        render();
    } catch (error) {
        showBanner(error.message || '送件清單讀取失敗。');
        render();
    } finally {
        $('refresh').disabled = false;
    }
}
function money(value) {
    return `$${Number(value || 0).toLocaleString('zh-TW')}`;
}
function callableMessage(error) {
    return String(error?.message || error || '電子發票沒有完成。').replace(/^FirebaseError:\s*/i, '');
}
async function staffCallable(name) {
    if (localOnly || !firebaseApp) throw new Error('本機檢查模式不能開立發票。請開正式送件中心。');
    const authMod = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js');
    const fnMod = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js');
    const auth = authMod.getAuth(firebaseApp);
    if (!auth.currentUser) {
        const provider = new authMod.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await authMod.signInWithPopup(auth, provider);
    }
    return fnMod.httpsCallable(fnMod.getFunctions(firebaseApp, 'asia-east1'), name);
}
function showInvoice(item) {
    const version = latestVersion(item);
    if (!version) return;
    let quote;
    try { quote = quoteInvoice(version.snapshot); }
    catch (error) { alert(error.message || String(error)); return; }
    selected = item;
    $('dialogTitle').textContent = `確認開立發票 · ${dispatchHotelName(item)}`;
    $('dialogBody').replaceChildren();
    const intro = document.createElement('p');
    intro.textContent = '請核對下面的內容。按下「確認開立」才會向汎宇電商開立電子發票。系統不會在結帳日或登記寄出時自動開立。';
    const facts = document.createElement('div');
    facts.className = 'meta';
    facts.append(
        metaRow('發票抬頭', quote.buyer.name),
        metaRow('統編', quote.buyer.kind === 'b2b' ? quote.buyer.taxId : '無統編（開立 B2C）'),
        metaRow('對帳期間', quote.period),
        metaRow('未稅銷售額', money(quote.sales)),
        metaRow('營業稅 5%', money(quote.tax)),
        metaRow('含稅實付', money(quote.total)),
    );
    const label = document.createElement('label');
    label.htmlFor = 'invoiceDescription';
    label.innerHTML = '<strong>品項說明（可修改）</strong>';
    const input = document.createElement('textarea');
    input.id = 'invoiceDescription';
    input.maxLength = 100;
    input.value = quote.description;
    $('dialogBody').append(intro, facts, label, input);
    $('next').hidden = false;
    $('next').textContent = '確認開立';
    $('next').onclick = () => confirmIssue(item, version.version);
    $('overlay').classList.add('show');
}
async function confirmIssue(item, version) {
    if (busy) return;
    const description = $('invoiceDescription')?.value.trim() || '';
    if (!description) { alert('請填品項說明。'); return; }
    busy = true;
    $('next').disabled = true;
    try {
        const call = await staffCallable('issueStatementInvoice');
        const response = await call({ caseId: item.id, version, description });
        const data = response?.data || {};
        alert(data.already
            ? `這一版已經開過，發票號碼 ${data.invoiceNumber}。沒有再向汎宇送一次。`
            : `已開立發票 ${data.invoiceNumber}。系統沒有自動寄給客戶。`);
        $('overlay').classList.remove('show');
        window.parent.postMessage({ type: 'baiqi-ledger-updated' }, location.origin);
        unsentDashboard?.reload();
        await reload();
    } catch (error) {
        alert(callableMessage(error));
    } finally {
        busy = false;
        $('next').disabled = false;
    }
}
function showVoid(item) {
    const version = latestVersion(item);
    if (!version) return;
    selected = item;
    $('dialogTitle').textContent = `確認作廢發票 · ${item.invoiceNumber || ''}`;
    $('dialogBody').replaceChildren();
    const intro = document.createElement('p');
    intro.textContent = `作廢後這張 ${item.invoiceNumber || ''} 會向汎宇電商註記作廢，送件中心改回未開發票。按下確認才會送出。`;
    const label = document.createElement('label');
    label.htmlFor = 'voidReason';
    label.innerHTML = '<strong>作廢原因</strong>';
    const input = document.createElement('textarea');
    input.id = 'voidReason';
    input.maxLength = 100;
    input.placeholder = '例如：抬頭開錯';
    $('dialogBody').append(intro, label, input);
    $('next').hidden = false;
    $('next').textContent = '確認作廢';
    $('next').onclick = () => confirmVoid(item, version.version);
    $('overlay').classList.add('show');
}
async function confirmVoid(item, version) {
    if (busy) return;
    const reason = $('voidReason')?.value.trim() || '';
    if (!reason) { alert('請填寫作廢原因。'); return; }
    busy = true;
    $('next').disabled = true;
    try {
        const call = await staffCallable('voidStatementInvoice');
        await call({ caseId: item.id, version, reason });
        alert('發票已作廢。若要重開，請再按「開立發票」。');
        $('overlay').classList.remove('show');
        window.parent.postMessage({ type: 'baiqi-ledger-updated' }, location.origin);
        unsentDashboard?.reload();
        await reload();
    } catch (error) {
        alert(callableMessage(error));
    } finally {
        busy = false;
        $('next').disabled = false;
    }
}

$('cancel').onclick = () => $('overlay').classList.remove('show');
$('einvoiceTest').onclick = async () => {
    const button = $('einvoiceTest');
    button.disabled = true;
    try {
        const call = await staffCallable('testEInvoiceConnection');
        const data = (await call({})).data || {};
        alert(data.ok ? `電子發票連線成功。${data.message || ''} ${data.time || ''}`.trim() : '電子發票連線失敗。');
    } catch (error) {
        alert(callableMessage(error));
    } finally {
        button.disabled = false;
    }
};
$('closePreview').onclick = closePreview;
$('printStatement').onclick = () => window.print();
document.querySelectorAll('.filter').forEach(button => {
    button.onclick = () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button));
        render();
    };
});
$('refresh').onclick = () => {
    reload();
    unsentDashboard?.reload();
};
document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
        closePreview();
        $('overlay').classList.remove('show');
    }
});
window.addEventListener('message', event => {
    if (event.origin !== location.origin) return;
    if (['baiqi-refresh-statements','baiqi-ledger-updated'].includes(event.data?.type)) reload();
});
setup().then(() => {
    if (!localOnly && repo?.cloud) {
        unsentDashboard = mountUnsentDashboard($('unsent-dashboard'), {
            db: repoDb,
            fs: repoFs,
        });
    } else if ($('unsent-dashboard')) {
        $('unsent-dashboard').textContent = '本機檢查模式不統計正式環境的未送對帳單。';
    }
    return reload();
}).catch(error => {
    showBanner(error.message || '送件中心沒有啟動。');
});
